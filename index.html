    .ai-thinking-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, 0.24);
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.92), rgba(248,250,252,0.98));
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.08), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    .ai-thinking-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -45%;
      width: 42%;
      background: linear-gradient(110deg, transparent, rgba(255,255,255,0.78), transparent);
      transform: skewX(-18deg);
      animation: ai-card-sheen 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .ai-thinking-text {
      display: inline-block;
      background: linear-gradient(100deg, #64748b 5%, #2563eb 34%, #7dd3fc 48%, #2563eb 62%, #64748b 95%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: ai-text-shimmer 2.1s linear infinite;
    }
    .ai-thinking-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #60a5fa;
      animation: ai-dot-pulse 1s ease-in-out infinite;
    }
    .ai-thinking-dot:nth-child(2) { animation-delay: .16s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: .32s; }
    @keyframes ai-card-sheen {
      0%, 12% { left: -45%; opacity: 0; }
      28% { opacity: .8; }
      66% { left: 115%; opacity: .45; }
      100% { left: 115%; opacity: 0; }
    }
    @keyframes ai-text-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -140% 0; }
    }
    @keyframes ai-dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ai-thinking-card::before, .ai-thinking-text, .ai-thinking-dot { animation: none !important; }
    }

    .ai-source-list { display: grid; gap: 8px; margin-top: 12px; }

      display: flex; gap: 10px; align-items: flex-start; padding: 10px 11px;

    .ai-recommendation-card {

    .ai-web-search-note { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-size: 10px; line-height: 1.5; }

    .ai-followups { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .ai-followup-chip { border: 1px solid #dbeafe; background: #f8fbff; color: #1d4ed8; border-radius: 999px; padding: 7px 10px; font-size: 10px; font-weight: 700; line-height: 1.35; text-align: left; transition: background .15s ease, border-color .15s ease; }
    .ai-followup-chip:hover { background: #eff6ff; border-color: #93c5fd; }
    .ai-markdown { color: #334155; overflow-wrap: anywhere; line-height: 1.72; }
    .ai-markdown p { margin: 0 0 .8rem; }
    .ai-markdown p:last-child { margin-bottom: 0; }
    .ai-markdown h3, .ai-markdown h4 { color: #0f172a; font-weight: 800; line-height: 1.35; letter-spacing: -.025em; margin: 1.1rem 0 .55rem; }
    .ai-markdown h3 { font-size: 1.02rem; }
    .ai-markdown h4 { font-size: .94rem; }
    .ai-markdown ul, .ai-markdown ol { display: grid; gap: .55rem; margin: .65rem 0 1rem; padding: 0; list-style: none; }
    .ai-markdown li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: .42rem; align-items: start; }
    .ai-markdown .ai-markdown-bullet { display: block; width: 7px; height: 7px; border-radius: 999px; background: #3b82f6; margin: .62em auto 0; box-shadow: 0 0 0 3px #dbeafe; }
    .ai-markdown .ai-markdown-number { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: .68rem; font-weight: 800; margin-top: .1rem; }
    .ai-markdown strong { color: #0f172a; font-weight: 800; }
    .ai-markdown em { color: #475569; }
    .ai-markdown a { color: #2563eb; font-weight: 650; text-decoration: underline; text-decoration-color: #bfdbfe; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .ai-markdown code { padding: .12rem .32rem; border-radius: .4rem; background: #f1f5f9; color: #0f172a; font-size: .88em; }
    .ai-markdown blockquote { margin: .8rem 0; padding: .7rem .85rem; border-left: 3px solid #60a5fa; border-radius: 0 .8rem .8rem 0; background: #eff6ff; color: #334155; }
    .ai-markdown hr { margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0; }
    .ai-chat-disclaimer { padding: 10px 8px 2px; color: #94a3b8; text-align: center; font-size: 10px; line-height: 1.55; }
  </style>
</head>

  let departureReminderEnabled = localStorage.getItem(K.departureReminder) !== "false";
  let activityExpanded = false;
  let reminderMessage = "";
  let settingsOpen = false;

  const PAGE_KEY = "urlaubassistent-active-page";
  const VALID_PAGES = ["overview", "trips", "expenses", "people", "more"];

  function money(v) {
    return new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(Number(v || 0));
  }

  function iso() {
    return new Date().toISOString().slice(0, 10);
  }

  function shortDate(d) {
    if (!d) return "--";
    return new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" }).format(new Date(d + "T12:00:00"));
  }

  function emptyForm(category) {
    return { title: "", amount: "", category, personId: "", date: iso(), note: "" };
  }

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  const SHARE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  function generateShareCode(length = 10) {
    let result = "";
    for (let i = 0; i < length; i++) {
      result += SHARE_CHARS[Math.floor(Math.random() * SHARE_CHARS.length)];
    }
    return result.slice(0, 5) + "-" + result.slice(5);
  }

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function icon(name, cls = "h-5 w-5") {
    return `<i data-lucide="${name}" class="${cls}"></i>`;
  }

  function actorName() {
    const configured = session?.user?.user_metadata?.urlaub_assistent_name;
    if (typeof configured === "string" && configured.trim()) return configured.trim();
    const email = session?.user?.email || "";
    return email.includes("@") ? email.split("@")[0] : "Du";
  }

  function activityKey(tripId) { return K.activityPrefix + tripId; }

  function activityKey(tripId) { return K.activityPrefix + tripId; }

  function isRelevantActivity(item) {
    const text = String(item?.text || "");
    return [
      "hat den Urlaub",
      "ist dem Urlaub beigetreten",
      "hat eine Person hinzugefügt",
      "hat eine Ausgabe hinzugefügt",
      "hat eine Maut hinzugefügt",
      "hat etwas zur Packliste hinzugefügt",
      "hat ein To-do hinzugefügt",
      "hat eine Schuld eingetragen"
    ].some(prefix => text.includes(prefix));
  }

  function getActivities(tripId) {
    if (!tripId) return [];
    try {
      const parsed = JSON.parse(localStorage.getItem(activityKey(tripId)) || "[]");
      const clean = (Array.isArray(parsed) ? parsed : []).filter(isRelevantActivity);
      if (Array.isArray(parsed) && clean.length !== parsed.length) {
        localStorage.setItem(activityKey(tripId), JSON.stringify(clean.slice(0, 30)));
      }
      return clean;
    } catch { return []; }
  }

  function saveActivities(tripId, items) {
    if (tripId) localStorage.setItem(activityKey(tripId), JSON.stringify(items.filter(isRelevantActivity).slice(0, 30)));
  }

  function addActivity(tripId, text, iconName = "activity", actor = actorName()) {
    if (!tripId) return;
    const items = getActivities(tripId);
    saveActivities(tripId, [{id:uid(), text, icon:iconName, actor, createdAt:new Date().toISOString()}, ...items]);
  }

  function broadcastActivity(tripId, text, iconName = "activity") {
    if (!tripId || !session?.user?.id || !realtimeChannel) return;
    realtimeChannel.send({
      type: "broadcast",
      event: "activity",
      payload: {
        tripId,
        actorId: session.user.id,
        actor: actorName(),
        text,
        icon: iconName
      }
    }).catch(() => {});
  }

  function checklistKey(tripId) { return K.checklistPrefix + tripId; }

  function getChecklist(tripId) {
    const defaults = {documents:false, tickets:false, payment:false, luggage:false};
    if (!tripId) return defaults;
    try { return {...defaults, ...(JSON.parse(localStorage.getItem(checklistKey(tripId)) || "null") || {})}; }
    catch { return defaults; }
  }

  function saveChecklist(tripId, value) {
    if (tripId) localStorage.setItem(checklistKey(tripId), JSON.stringify(value));
  }

  function daysUntil(dateValue) {
    if (!dateValue) return null;
    const today = new Date();
    today.setHours(12,0,0,0);
    const target = new Date(dateValue + "T12:00:00");
    return Math.ceil((target - today) / 86400000);
  }

  function tripCheckData(trip) {
    const checklist = getChecklist(trip?.id);
    const items = [
      {key:"documents", label:"Ausweis / Reisepass", icon:"id-card"},
      {key:"tickets", label:"Tickets & Buchungen", icon:"ticket"},
      {key:"payment", label:"Karten & Zahlungsmittel", icon:"credit-card"},
      {key:"luggage", label:"Koffer & wichtige Sachen", icon:"luggage"}
    ];
    const done = items.filter(item => checklist[item.key]).length;
    return {checklist, items, done, total:items.length, days:daysUntil(trip?.startDate)};
  }

  function reminderSentKey(tripId, type, day) { return `${K.reminderSentPrefix}${tripId}-${type}-${day}`; }

  function sendBrowserNotification(title, body) {
    try {
      if (typeof Notification === "undefined" || Notification.permission !== "granted") return false;
      new Notification(title, {body});
      return true;
    } catch { return false; }
  }

  function checkReminders() {
    if (!session || !remindersEnabled || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const trip = activeTrip();
    if (!trip) return;
    const data = tripCheckData(trip);
    const today = iso();
    if (passportReminderEnabled && data.days !== null && [14,7,3,1,0].includes(data.days) && !data.checklist.documents) {
      const key = reminderSentKey(trip.id, "passport", today);
      if (localStorage.getItem(key) !== "1") {
        sendBrowserNotification("Urlaubassistent", data.days === 0 ? "Heute geht es los. Sind Ausweis oder Reisepass schon bereit?" : `Noch ${data.days} ${data.days === 1 ? "Tag" : "Tage"} bis zur Abreise. Denk an Ausweis oder Reisepass.`);
        localStorage.setItem(key, "1");
      }
    }
    if (departureReminderEnabled && data.days === 1 && data.done < data.total) {
      const key = reminderSentKey(trip.id, "departure", today);
      if (localStorage.getItem(key) !== "1") {
        sendBrowserNotification("Abreise-Check", `Noch ${data.total-data.done} wichtige Punkte offen. Ist alles fertig?`);
        localStorage.setItem(key, "1");
      }
    }
  }

  function requestNotificationPermission() {
    reminderMessage = "";
    if (typeof Notification === "undefined") {
      reminderMessage = "Dieser Browser unterstützt keine Benachrichtigungen."; render(); return;
    }
    Notification.requestPermission().then(permission => {
      reminderMessage = permission === "granted" ? "Benachrichtigungen sind aktiviert." : "Benachrichtigungen wurden nicht aktiviert.";
      render();
    }).catch(() => { reminderMessage = "Die Benachrichtigungen konnten nicht aktiviert werden."; render(); });
  }

  function notificationStatusText() {
    if (typeof Notification === "undefined") return "Nicht unterstützt";
    if (Notification.permission === "granted") return "Aktiv";
    if (Notification.permission === "denied") return "Blockiert";
    return "Noch nicht aktiviert";
  }

    const date = new Date(item.createdAt);
    const when = Number.isNaN(date.getTime()) ? "" : new Intl.DateTimeFormat("de-DE", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).format(date);
    return `<div class="flex items-start gap-3 rounded-2xl bg-slate-50 p-3 ring-1 ring-slate-200"><div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-white text-slate-700 ring-1 ring-slate-200">${icon(item.icon || "activity","h-4 w-4")}</div><div class="min-w-0 flex-1"><div class="text-sm font-medium text-slate-800"><span class="font-semibold">${esc(item.actor || "Teilnehmer")}</span> ${esc(item.text)}</div><div class="mt-1 text-xs text-slate-400">${esc(when)}</div></div></div>`;
  }

    // Realtime-Postgres dient hier nur noch zum Aktualisieren der Daten.
    // Der sichtbare Aktivitätsverlauf wird für neue Einträge über Broadcast gefüllt,
    // damit dort auch der tatsächliche Anzeigename des Erstellers steht.
    return;

    if (offline) {
      root.innerHTML = offlineHTML();
      lucide.createIcons();
      return;
    }

    if (checking) {
      root.innerHTML = `<div class="min-h-screen bg-slate-100 p-6 text-slate-700">Lade…</div>`;
      lucide.createIcons();
      return;
    }

    if (recovery) {
      root.innerHTML = recoveryHTML();
      lucide.createIcons();

    }

    if (!session) {
      root.innerHTML = authHTML();
      lucide.createIcons();
      return;

    if (showDeleteAccount) {
      root.innerHTML = deleteAccountHTML();
      lucide.createIcons();
      return;
    }

    root.innerHTML = appHTML();
    lucide.createIcons();
    checkReminders();
  }

  function buttonHTML(text, attrs = "", variant = "default") {
    const styles = variant === "soft"
      ? "bg-slate-100 text-slate-900 hover:bg-slate-200"
      : variant === "danger"
      ? "bg-rose-600 text-white hover:bg-rose-700"
      : variant === "ghost"
      ? "bg-transparent text-slate-700 hover:bg-slate-100"
      : "bg-slate-900 text-white hover:bg-slate-800";

  function inputHTML(type, value, placeholder, attrs = "") {

    return `<input type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${cleanAttrs} class="${mergedClass}">`;
  }

      ${topBarHTML(...pageTitle())}
      ${cardHTML("Urlaube", "Mehrere Reisen anlegen und auswählen", "map", `
        <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
          ${inputHTML("text", newTrip.name, "Name des Urlaubs", `id="trip-name"`)}
          ${inputHTML("text", newTrip.destination, "Zielort", `id="trip-destination"`)}
          <label class="space-y-1"><span class="text-xs font-medium text-slate-500">Startdatum</span>${inputHTML("date", newTrip.startDate, "", `id="trip-start"`)}</label>
          <label class="space-y-1"><span class="text-xs font-medium text-slate-500">Enddatum</span>${inputHTML("date", newTrip.endDate, "", `id="trip-end"`)}</label>
        </div>
        <div class="mt-3 grid gap-3 md:grid-cols-[1fr_160px]">${inputHTML("number", newTrip.budget, "Budget in EUR", `id="trip-budget"`)}${buttonHTML(`${icon("plus","h-4 w-4")} Urlaub anlegen`, `data-action="create-trip"`)}</div>
        <div class="mt-3">${buttonHTML(`${icon("link-2","h-4 w-4")} Urlaub beitreten`, `data-action="open-join"`, "soft")}</div>
        <div class="mt-5 space-y-2">${tripsVisible.length ? tripsVisible.map(trip => tripCardHTML(trip)).join("") : emptyHTML("Noch keine Urlaube angelegt.")}</div>
        ${trips.length > LIST_LIMIT ? moreButtonHTML("trips", tripsExpanded) : ""}
      `)}
      ${activeTrip() ? cardHTML("Teilnehmer", "Dieser Bereich zeigt dir die Personen des aktuell ausgewählten Urlaubs", "users", `
        <div class="flex flex-wrap gap-2">${people.length ? people.slice(0,LIST_LIMIT).map(p => `<span class="rounded-full bg-slate-100 px-3 py-2 text-sm text-slate-700">${esc(p.name)}</span>`).join("") : emptyHTML("Noch keine Personen hinzugefügt.")}</div>
      `) : ""}
    </div>`;
  }

  // Die festen Kategorien bleiben bewusst klein und übersichtlich.
  // Eigene Kategorien werden separat gespeichert und erscheinen nach dem Hinzufügen
  // ebenfalls direkt oben bei den normalen Kategorien.
  const EXPENSE_BASE_CATEGORIES = [
    { value: "Essen", label: "Essen", icon: "utensils" },
    { value: "Hotel", label: "Hotel", icon: "hotel" },
    { value: "Tank", label: "Tank", icon: "fuel" },
    { value: "Aktivitäten", label: "Aktivitäten", icon: "sparkles" },
    { value: "Sonstiges", label: "Sonstiges", icon: "layers-3" }
  ];

  const EXPENSE_CATEGORIES = EXPENSE_BASE_CATEGORIES.map(c => [c.value, c.label]);
  const EXPENSE_CATEGORY_ICONS = Object.fromEntries(EXPENSE_BASE_CATEGORIES.map(c => [c.value, c.icon]));

  function normalizeExpenseCategory(category) {
    const value = String(category || "").trim();
    return value.toLowerCase() === "tanken" ? "Tank" : value;
  }

  function storedCustomExpenseCategories(tripId) {
    if (!tripId) return [];
    const cached = Array.isArray(customExpenseCategoryCache[tripId]) ? customExpenseCategoryCache[tripId] : [];
    let stored = [];
    try {
      const raw = localStorage.getItem(K.customExpenseCategoriesPrefix + tripId);
      const parsed = JSON.parse(raw || "[]");
      stored = Array.isArray(parsed) ? parsed.map(v => String(v || "").trim()).filter(Boolean) : [];
    } catch {}
    return [...new Set([...cached, ...stored].map(normalizeExpenseCategory).filter(Boolean))];
  }

  function saveCustomExpenseCategories(tripId, categories) {
    if (!tripId) return [];
    const base = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const clean = [...new Set((categories || [])
      .map(v => String(v || "").trim())
      .filter(Boolean)
      .map(normalizeExpenseCategory)
      .filter(v => !base.has(v)))]
      .sort((a, b) => a.localeCompare(b, "de"));
    customExpenseCategoryCache[tripId] = clean;
    try {
      localStorage.setItem(K.customExpenseCategoriesPrefix + tripId, JSON.stringify(clean));
    } catch {}
    return clean;
  }

  function customExpenseCategories(trip) {
    const base = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const stored = storedCustomExpenseCategories(trip?.id);
    const used = (trip?.expenses || []).map(entry => normalizeExpenseCategory(entry.category));
    return [...new Set([...stored, ...used])]
      .filter(Boolean)
      .filter(category => !base.has(category))
      .sort((a, b) => a.localeCompare(b, "de"));
  }

  function expenseCategoryLabel(category, trip) {
    const value = normalizeExpenseCategory(category);
    return EXPENSE_BASE_CATEGORIES.find(c => c.value === value)?.label || value || "Essen";
  }

  function expenseCategoryIcon(category) {
    return EXPENSE_CATEGORY_ICONS[normalizeExpenseCategory(category)] || "tag";
  }

  function expenseCategorySelectHTML(trip) {
    const selected = normalizeExpenseCategory(expenseForm.category || "Essen") || "Essen";
    const baseValues = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const customCategories = customExpenseCategories(trip);
    const allCategories = [
      ...EXPENSE_BASE_CATEGORIES.map(c => ({ value: c.value, label: c.label, icon: c.icon, custom: false })),
      ...customCategories.map(category => ({ value: category, label: category, icon: "tag", custom: true }))
    ];
    const query = String(expenseCategorySearch || "").trim().toLocaleLowerCase("de-DE");
    const filtered = query
      ? allCategories.filter(item => item.label.toLocaleLowerCase("de-DE").includes(query))
      : allCategories;

    const categoryOptions = allCategories.map((category, index) => {
      const active = selected === category.value;
      const initiallyHidden = !expenseCategoryMoreOpen && index >= 9;
      return `<button type="button" data-search-option="1" data-search="${esc(category.label)}" data-action="${category.custom ? "select-expense-custom-category" : "select-expense-category"}" data-category="${esc(category.value)}" ${category.custom ? `data-custom-category="true"` : ""} ${disabledIfViewer()}
        class="group flex min-w-0 items-center gap-2.5 rounded-2xl border px-3 py-3 text-left transition ${initiallyHidden ? "hidden" : ""} ${active ? "border-slate-900 bg-slate-900 text-white shadow-sm" : "border-slate-200 bg-white text-slate-700 hover:border-blue-200 hover:bg-blue-50/50"} disabled:cursor-not-allowed disabled:opacity-50">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl ${active ? "bg-white/10 text-white" : "bg-blue-50 text-blue-700"}">${icon(category.icon, "h-4 w-4")}</span>
        <span class="min-w-0 flex-1 truncate text-sm font-semibold">${esc(category.label)}</span>
        ${active ? icon("check", "h-4 w-4") : icon("chevron-right", "h-4 w-4 text-slate-300 group-hover:text-blue-400")}
      </button>`;
    }).join("");


    return `<div class="relative">
      <div class="mb-2 flex items-center justify-between gap-3 px-1">
        <div class="flex items-center gap-2 text-sm font-semibold text-slate-800">
          <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-blue-50 text-blue-700">${icon("tag", "h-4 w-4")}</span>
          Kategorie
        </div>
        <span class="rounded-full bg-slate-100 px-3 py-1 text-[11px] font-semibold text-slate-500">${esc(expenseCategoryLabel(selected, trip))}</span>
      </div>

      <div class="rounded-3xl border border-slate-200 bg-white p-3 shadow-sm ring-1 ring-white">
        <div class="relative mb-3">
          <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-slate-400">${icon("search", "h-4 w-4")}</span>
          ${inputHTML("text", expenseCategorySearch, "Kategorie suchen…", `id="expense-category-search" ${readonlyIfViewer()} autocomplete="off" class="pl-10"`)}
        </div>

        <div id="expense-category-options" class="grid grid-cols-2 gap-2 sm:grid-cols-3">
          ${categoryOptions || `<div class="col-span-2 rounded-2xl bg-slate-50 px-4 py-4 text-sm text-slate-500 sm:col-span-3">Keine Kategorien vorhanden.</div>`}
        </div>
        <div id="expense-category-search-empty" class="hidden mt-2 rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-500">Keine Kategorie gefunden.</div>

        ${allCategories.length > 9 ? `<button type="button" data-action="toggle-expense-categories" class="mt-2 flex w-full items-center justify-center gap-2 rounded-2xl ${expenseCategoryMoreOpen ? "bg-blue-50 text-blue-700 hover:bg-blue-100" : "bg-slate-50 text-slate-600 hover:bg-blue-50 hover:text-blue-700"} px-4 py-3 text-sm font-semibold transition">${icon(expenseCategoryMoreOpen ? "chevrons-up" : "chevrons-down", "h-4 w-4")} ${expenseCategoryMoreOpen ? "Weniger anzeigen" : "Mehr Kategorien anzeigen"}</button>` : ""}
      </div>

      <input id="expense-category" type="hidden" value="${esc(selected)}" />

      <div class="mt-3 rounded-3xl border border-blue-100 bg-blue-50/80 p-4 shadow-sm">
        <div class="mb-3">
          <div class="flex items-center gap-2 text-sm font-semibold text-blue-900">${icon("tag", "h-4 w-4")} Eigene Kategorie</div>
          <div class="mt-1 text-[11px] leading-4 text-blue-800/65">Zum Beispiel „Burger“, „Geschenke“ oder „Eis“.</div>
        </div>

        <div class="flex items-stretch gap-2">
          <div class="min-w-0 flex-1">
            ${inputHTML("text", "", "z. B. Burger", `id="expense-custom-category" ${readonlyIfViewer()} autocomplete="off"`)}
          </div>
          <button type="button" data-action="add-expense-custom-category" ${disabledIfViewer()} aria-label="Eigene Kategorie hinzufügen" class="flex w-14 shrink-0 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm transition hover:bg-blue-700 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50">${icon("plus", "h-5 w-5")}</button>
        </div>
        <div class="mt-2 px-1 text-[11px] leading-4 text-blue-700/70">Mit + wird sie oben bei deinen Kategorien gespeichert.</div>
      </div>
    </div>`;
  }

  function expensePersonSelectHTML(trip) {
    const current = String(expenseForm.personId || "");
    const options = [
      { value: "", label: "Nicht zugeordnet", icon: "minus-circle" },
      ...trip.people.map(person => ({ value: person.id, label: person.name, icon: "user-round" }))
    ];
    return `<div class="min-w-0">
      <div class="mb-1 flex items-center justify-between gap-2 px-1"><span class="text-xs font-medium text-slate-500">Person zuordnen</span><span class="text-[11px] text-slate-400">${current ? "Zugeordnet" : "Optional"}</span></div>
      <div class="rounded-3xl border border-slate-200 bg-slate-50/80 p-3 ring-1 ring-white shadow-sm">
        <div class="flex gap-2 overflow-x-auto pb-0.5">
          ${options.map(option => {
            const active = option.value === current;
            return `<button type="button" data-action="select-expense-person" data-person-id="${esc(option.value)}" ${disabledIfViewer()}
              class="flex shrink-0 items-center gap-2 rounded-2xl border ${active ? "border-slate-900 bg-slate-900 text-white shadow-sm" : "border-slate-200 bg-white text-slate-700 hover:border-slate-300"} px-3 py-2.5 text-left transition disabled:cursor-not-allowed disabled:opacity-50">
              <span class="flex h-8 w-8 items-center justify-center rounded-xl ${active ? "bg-white/10 text-white" : "bg-slate-100 text-slate-600"}">${icon(option.icon, "h-4 w-4")}</span>
              <span class="max-w-[9rem] truncate text-sm font-semibold">${esc(option.label)}</span>
              ${active ? icon("check", "h-4 w-4") : ""}
            </button>`;
          }).join("")}
        </div>
      </div>
      <input id="expense-person" type="hidden" value="${esc(current)}" />
    </div>`;
  }

  function stableCategoryColor(category) {
    const key = normalizeExpenseCategory(category) || "Sonstiges";
    const baseColors = {
      "Essen": "#1557A6",
      "Hotel": "#123F7A",
      "Tank": "#1B6AC9",
      "Aktivitäten": "#214F91",
      "Sonstiges": "#2B79CC"
    };
    if (baseColors[key]) return baseColors[key];

    const blues = ["#0E3A73", "#12447F", "#174D8F", "#1B579E", "#1F61AD", "#2369B9", "#2872C4", "#2E78C8", "#346EB4"];
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
    return blues[Math.abs(hash) % blues.length];
  }

  function categoryTint(color, amount = 0.88) {
    const hex = String(color || "#1557A6").replace("#", "");
    if (hex.length !== 6) return "rgba(21,87,166,0.08)";
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    const p = Math.max(0, Math.min(1, amount));
    return `rgba(${Math.round(r + (255-r)*p)},${Math.round(g + (255-g)*p)},${Math.round(b + (255-b)*p)},0.92)`;
  }

  function expenseCategoryChartIcon(category) {
    return icon(expenseCategoryIcon(category), "h-6 w-6");
  }

  function expenseStackSegmentLabel(category, amount, total) {
    const percent = total > 0 ? Math.round((amount / total) * 100) : 0;
    const color = stableCategoryColor(category);
    return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}" class="flex min-w-0 items-center justify-center gap-2 rounded-xl px-1.5 py-1.5 text-center transition hover:bg-white/80 focus:outline-none">
      <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:${color}"></span>
      <span class="truncate text-xs font-semibold" style="color:${color}">${percent}% ${esc(category)}</span>
    </button>`;
  }

  function expenseCategoryChartHTML(trip) {
    const entries = Array.isArray(trip?.expenses) ? trip.expenses : [];
    const totals = {};
    entries.forEach(entry => {
      const category = normalizeExpenseCategory(entry.category) || "Sonstiges";
      const amount = Number(entry.amount || 0);
      if (amount > 0) totals[category] = (totals[category] || 0) + amount;
    });

    const rows = Object.entries(totals)
      .filter(([, amount]) => amount > 0)
      .sort((a, b) => b[1] - a[1]);
    const total = rows.reduce((sum, [, amount]) => sum + amount, 0);
    if (!rows.length || total <= 0) {
      return cardHTML("Ausgaben nach Kategorie", "So verteilt sich dein Urlaubsbudget", "pie-chart", emptyHTML("Noch keine Ausgaben für das Kreisdiagramm vorhanden."));
    }

    const selectedCategory = rows.some(([category]) => category === selectedExpenseChartCategory) ? selectedExpenseChartCategory : null;
    const selectedAmount = selectedCategory ? (totals[selectedCategory] || 0) : total;
    const selectedPercent = selectedCategory ? Math.round((selectedAmount / total) * 100) : 100;
    const selectedEntries = selectedCategory
      ? entries
          .filter(entry => (normalizeExpenseCategory(entry.category) || "Sonstiges") === selectedCategory && Number(entry.amount || 0) > 0)
          .sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0))
      : [];

    const segments = rows.map(([category, amount]) => {
      const percent = amount / total * 100;
      const color = stableCategoryColor(category);
      const selected = selectedCategory === category;
      return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}" title="${esc(category)} · ${money(amount)}"
        class="h-full min-w-0 transition-all duration-200 focus:outline-none ${selected ? "scale-y-105 shadow-[0_8px_20px_rgba(15,23,42,0.18)]" : "hover:brightness-105"}"
        style="width:${Math.max(percent, 1.15)}%;background:${color};opacity:${selectedCategory && !selected ? "0.38" : "1"};border-right:3px solid rgba(255,255,255,0.92);">
      </button>`;
    }).join("");

    const quickLabels = rows.slice(0, 4).map(([category, amount]) => expenseStackSegmentLabel(category, amount, total)).join("");
    const legend = rows.map(([category, amount]) => {
      const percent = Math.round(amount / total * 100);
      const color = stableCategoryColor(category);
      const tint = categoryTint(color, 0.84);
      const selected = selectedCategory === category;
      return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}"
        class="group w-full rounded-[1.5rem] border text-left transition-all duration-200 focus:outline-none ${selected ? "border-blue-200 bg-white shadow-[0_12px_28px_rgba(15,23,42,0.12)] -translate-y-0.5" : "border-slate-200 bg-white hover:border-blue-100 hover:shadow-sm"}">
        <div class="flex items-center gap-4 px-4 py-4 sm:px-5">
          <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full ring-1 ring-white shadow-sm" style="background:${tint};color:${color}">${expenseCategoryChartIcon(category)}</div>
          <div class="min-w-0 flex-1">
            <div class="truncate text-[18px] font-bold text-slate-900">${esc(category)}</div>
            <div class="mt-0.5 text-[14px] font-medium text-slate-500">${money(amount)}</div>
          </div>
          <div class="shrink-0 text-right">
            <div class="text-[18px] font-bold" style="color:${color}">${percent}%</div>
            <div class="mt-0.5 text-[11px] font-medium text-slate-400">der Gesamtausgaben</div>
          </div>
        </div>
      </button>`;
    }).join("");

    const detail = selectedCategory ? `
      <div class="mt-4 rounded-[1.5rem] border border-blue-100 bg-white p-4 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <div class="flex min-w-0 items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl" style="background:${categoryTint(stableCategoryColor(selectedCategory),0.84)};color:${stableCategoryColor(selectedCategory)}">${icon(expenseCategoryIcon(selectedCategory), "h-5 w-5")}</div>
            <div class="min-w-0">
              <div class="truncate text-base font-bold text-slate-900">${esc(selectedCategory)}</div>
              <div class="text-sm font-medium text-slate-500">${selectedPercent}% · ${money(selectedAmount)}</div>
            </div>
          </div>
          <button type="button" data-action="toggle-chart-category" data-category="${esc(selectedCategory)}" class="shrink-0 rounded-xl bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-200">Schließen</button>
        </div>
        <div class="mt-3 space-y-2">
          ${selectedEntries.length ? selectedEntries.map(entry => {
            const person = trip.people?.find(p => String(p.id) === String(entry.personId));
            return `<div class="flex items-center justify-between gap-3 rounded-2xl bg-slate-50 px-3.5 py-3 ring-1 ring-slate-200/80">
              <div class="min-w-0"><div class="truncate text-sm font-semibold text-slate-800">${esc(entry.title || "Ausgabe")}</div><div class="mt-0.5 truncate text-xs text-slate-500">${shortDate(entry.date)}${person ? ` · ${esc(person.name)}` : ""}${entry.note ? ` · ${esc(entry.note)}` : ""}</div></div>
              <div class="shrink-0 text-sm font-bold text-slate-900">${money(entry.amount)}</div>
            </div>`;
          }).join("") : emptyHTML("Keine einzelnen Ausgaben in dieser Kategorie gefunden.")}
        </div>
      </div>` : `<div class="mt-4 text-center text-xs font-medium text-slate-500">Tippe auf einen Bereich oder eine Kategorie, um die einzelnen Ausgaben zu sehen.</div>`;

    return cardHTML("Ausgaben nach Kategorie", "So verteilt sich dein Urlaubsbudget", "pie-chart", `
      <div class="overflow-hidden rounded-[2rem] bg-gradient-to-br from-blue-50/85 via-white to-blue-50/55 p-4 ring-1 ring-blue-100/90 sm:p-6">
        <div class="mt-1 text-center">
          <div class="text-xs font-bold uppercase tracking-[0.28em] text-slate-500">${selectedCategory ? esc(selectedCategory) : "Gesamt"}</div>
          <div class="mt-1 text-4xl font-black tracking-tight text-slate-950 sm:text-5xl">${money(selectedAmount)}</div>
          <div class="mt-2 text-sm font-semibold text-slate-500">${selectedCategory ? `${selectedPercent}% der Gesamtausgaben` : `${rows.length} ${rows.length === 1 ? "Kategorie" : "Kategorien"} · gesamte Ausgaben`}</div>
        </div>

        <div class="mt-7">
          <div class="flex h-16 w-full overflow-hidden rounded-full bg-slate-200/90 shadow-inner ring-4 ring-white/80">
            ${segments}
          </div>
          <div class="mt-3 grid grid-cols-2 gap-x-2 gap-y-1.5 sm:grid-cols-4">${quickLabels}</div>
        </div>

        <div class="mt-7">
          <div class="mb-3 flex items-center justify-between gap-3">
            <div class="text-base font-bold text-slate-950">Aufteilung</div>
            <div class="text-sm font-semibold text-slate-400">${rows.length} ${rows.length === 1 ? "Kategorie" : "Kategorien"}</div>
          </div>
          <div class="space-y-3">${legend}</div>
        </div>
        ${detail}
      </div>
    `);
  }

  function expensesPageHTML() {
    const trip = activeTrip();
    if (!trip) return `<div class="space-y-6">${topBarHTML(...pageTitle())}${emptyHTML("Lege zuerst einen Urlaub an, damit du Ausgaben verwalten kannst.")}</div>`;

    const totalsData = totals();
    const day = dayItems();
    const dayVisible = dayExpanded ? day : day.slice(0, LIST_LIMIT);
    const expensesVisible = expensesExpanded ? trip.expenses : trip.expenses.slice(0, LIST_LIMIT);
    const tollsVisible = tollsExpanded ? trip.tolls : trip.tolls.slice(0, LIST_LIMIT);

    return `<div class="space-y-6">
      ${topBarHTML(...pageTitle())}
      ${cardHTML("Tagesübersicht", "Kosten pro Tag ansehen", "receipt-text", `
        ${inputHTML("date", daySelected, "", `id="day-date"`)}
        <div class="mt-3 rounded-2xl bg-slate-50 p-4 ring-1 ring-slate-200"><div class="text-xs uppercase tracking-wide text-slate-500">Tagesausgaben</div><div class="mt-1 text-2xl font-bold text-slate-900">${money(day.reduce((s,e)=>s+Number(e.amount||0),0))}</div></div>
        <div class="mt-3 space-y-2">${dayVisible.length ? dayVisible.map(entry => `<div class="rounded-2xl border border-slate-200 p-3"><div class="flex items-center justify-between gap-3"><div><div class="font-medium">${esc(entry.title)}</div><div class="text-xs text-slate-500">${esc(entry.category)} · ${shortDate(entry.date)} · ${esc(entry.note || "ohne Notiz")}</div></div><div class="font-semibold">${money(entry.amount)}</div></div></div>`).join("") : emptyHTML("Für diesen Tag gibt es keine Einträge.")}</div>
        ${day.length > LIST_LIMIT ? moreButtonHTML("day", dayExpanded) : ""}
      `)}
      ${cardHTML("Ausgaben", "Eintragen, wer was bezahlt hat", "wallet-cards", `
        <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-[1fr_0.65fr_1.35fr]">${inputHTML("text", expenseForm.title, "Titel", `id="expense-title" ${readonlyIfViewer()}`)}${inputHTML("number", expenseForm.amount, "Betrag", `id="expense-amount" ${readonlyIfViewer()}`)}${expensePersonSelectHTML(trip)}</div>

  function aiContext() {
    const trip = activeTrip();
    const historicalTrips = trips
      .filter(t => (!trip || t.id !== trip.id) && String(t.endDate || "") < iso())
      .sort((a,b) => String(b.endDate || "").localeCompare(String(a.endDate || "")))
      .slice(0, 12)
      .map(t => {
        const rows = [...(t.expenses || []), ...(t.tolls || [])];
        const spent = rows.reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const categoryTotals = {};
        rows.forEach(e => {
          const category = String(e.category || "Sonstiges");
          categoryTotals[category] = (categoryTotals[category] || 0) + Number(e.amount || 0);
        });
        return {
          name: t.name,
          destination: t.destination,
          startDate: t.startDate,
          endDate: t.endDate,
          budget: Number(t.budget || 0),
          spent,
          remaining: Number(t.budget || 0) - spent,
          transactionCount: rows.length,
          categoryTotals: Object.entries(categoryTotals)
            .sort((a,b) => Number(b[1]) - Number(a[1]))
            .slice(0, 6)
            .map(([category, amount]) => ({ category, amount: Number(amount) }))
        };
      });

    const availableTrips = trips
      .filter(t => !trip || t.id !== trip.id)
      .slice(0, 10)
      .map(t => ({name:t.name,destination:t.destination,startDate:t.startDate,endDate:t.endDate,budget:t.budget}));

    if (!trip) {
      return {
        currentTrip: null,
        account: { name: actorName() },
        availableTrips,
        tripHistory: historicalTrips
      };
    }

    const allCurrentSpending = [...trip.expenses, ...trip.tolls];
    const total = allCurrentSpending.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    const currentCategoryTotals = {};
    allCurrentSpending.forEach(e => {
      const category = String(e.category || "Sonstiges");
      currentCategoryTotals[category] = (currentCategoryTotals[category] || 0) + Number(e.amount || 0);
    });
    const budget = Number(trip.budget || 0);
    const peopleCount = Math.max(1, (trip.people || []).length);
    const dayMs = 86400000;
    const todayMs = new Date(iso() + "T12:00:00").getTime();
    const startMs = trip.startDate ? new Date(trip.startDate + "T12:00:00").getTime() : NaN;
    const endMs = trip.endDate ? new Date(trip.endDate + "T12:00:00").getTime() : NaN;
    const plannedDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs
      ? Math.floor((endMs - startMs) / dayMs) + 1 : null;
    const remainingTripDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs && endMs >= todayMs
      ? Math.floor((endMs - Math.max(todayMs, startMs)) / dayMs) + 1 : 0;
    const elapsedTripDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs
      ? (todayMs < startMs ? 0 : Math.max(1, Math.min(plannedDays, Math.floor((Math.min(todayMs, endMs) - startMs) / dayMs) + 1))) : null;
    const remainingBudget = budget - total;

    return {
      account: { name: actorName() },
      currentTrip: {
        name: trip.name,
        destination: trip.destination,
        startDate: trip.startDate,
        endDate: trip.endDate,
        budget: trip.budget,
        role: trip.role,
        people: trip.people.map(p => p.name),
        spending: {
          total,
          remaining: remainingBudget,
          expenseCount: trip.expenses.length,
          tollCount: trip.tolls.length,
          categoryTotals: Object.entries(currentCategoryTotals)
            .sort((a,b) => Number(b[1]) - Number(a[1]))
            .slice(0, 8)
            .map(([category, amount]) => ({ category, amount: Number(amount) }))
        },
        budgetCoach: {
          peopleCount,
          plannedDays,
          elapsedTripDays,
          remainingTripDays,
          spentPerPerson: total / peopleCount,
          remainingPerPerson: remainingBudget / peopleCount,
          spendingPerElapsedDay: elapsedTripDays ? total / elapsedTripDays : null,
          suggestedDailyLimit: budget > 0 && remainingTripDays > 0 ? Math.max(0, remainingBudget / remainingTripDays) : null,
          usedPercent: budget > 0 ? (total / budget) * 100 : null,
          isOverBudget: budget > 0 && total > budget
        },
        recentExpenses: trip.expenses.slice(-12).map(e => ({title:e.title, amount:e.amount, category:e.category, date:e.date, note:e.note || ""})),
        recentTolls: trip.tolls.slice(-8).map(e => ({title:e.title, amount:e.amount, date:e.date, note:e.note || ""})),
        openTodos: trip.todos.filter(x=>!x.done).slice(0,20).map((x,i)=>({id:"todo-"+(i+1),text:x.text})),
        openPacking: trip.packlist.filter(x=>!x.done).slice(0,20).map((x,i)=>({id:"packing-"+(i+1),text:x.text})),
        customCategories: customExpenseCategories(trip)
      },
      availableTrips,
      tripHistory: historicalTrips
    };
  }

  function aiMarkdownInline(value) {
    let html = esc(value);
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (match, label, rawUrl) => {
      try {
        const safeUrl = new URL(rawUrl.replaceAll("&amp;", "&"));
        if (safeUrl.protocol !== "https:" && safeUrl.protocol !== "http:") return label;
        return '<a href="' + esc(safeUrl.href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
      } catch { return label; }
    });
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/__(.+?)__/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    return html;
  }

  function aiMarkdownHTML(value) {
    const lines = String(value ?? "").replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let paragraph = [];
    let list = null;
    let quote = [];
    let recommendationCardOpen = false;

    const flushParagraph = () => {
      if (!paragraph.length) return;
      out.push("<p>" + paragraph.map(aiMarkdownInline).join(" ") + "</p>");
      paragraph = [];
    };
    const flushList = () => {
      if (!list) return;
      const items = list.items.map(item => list.type === "ol"
        ? '<li><span class="ai-markdown-number">' + esc(item.number) + '</span><span>' + aiMarkdownInline(item.text) + '</span></li>'
        : '<li><span class="ai-markdown-bullet" aria-hidden="true"></span><span>' + aiMarkdownInline(item.text) + '</span></li>').join("");
      out.push("<" + list.type + ">" + items + "</" + list.type + ">");
      list = null;
    };
    const flushQuote = () => {
      if (!quote.length) return;
      out.push("<blockquote>" + quote.map(aiMarkdownInline).join(" ") + "</blockquote>");
      quote = [];
    };
    const flushBlocks = () => { flushParagraph(); flushList(); flushQuote(); };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) { flushBlocks(); continue; }

      const heading = line.match(/^(#{1,4})\s+(.+)$/);
      if (heading) {
        flushBlocks();
        const level = heading[1].length <= 3 ? 3 : 4;
        if (level === 3) {
          if (recommendationCardOpen) out.push("</section>");
          out.push('<section class="ai-recommendation-card"><h3>' + aiMarkdownInline(heading[2]) + "</h3>");
          recommendationCardOpen = true;
        } else {
          out.push("<h4>" + aiMarkdownInline(heading[2]) + "</h4>");
        }
        continue;
      }
      if (/^(---+|___+)\s*$/.test(line)) {
        flushBlocks(); out.push("<hr>"); continue;
      }

      const quoteLine = line.match(/^>\s?(.*)$/);
      if (quoteLine) {
        flushParagraph(); flushList();
        quote.push(quoteLine[1]);
        continue;
      }
      flushQuote();

      const unordered = line.match(/^[-*•]\s+(.+)$/);
      const ordered = line.match(/^(\d+)[.)]\s+(.+)$/);
      const match = unordered || ordered;
      if (match) {
        flushParagraph();
        const type = unordered ? "ul" : "ol";
        if (list && list.type !== type) flushList();
        if (!list) list = {type, items:[]};
        list.items.push(unordered ? {text:unordered[1]} : {number:ordered[1],text:ordered[2]});
        continue;
      }
      flushList();
      paragraph.push(line);
    }
    flushBlocks();
    if (recommendationCardOpen) out.push("</section>");
    return out.join("");
  }

  function aiQuestionNeedsWebSearch(input) {
    const q = String(input || "").toLowerCase();
    const asksForPersonalNumbers = /(meine?\s+(ausgaben|kosten|budgets?|rechnungen)|wie\s+viel\s+habe\s+ich\s+.*ausgegeben|wieviel\s+habe\s+ich\s+.*ausgegeben|bisherigen\s+urlaub|früheren\s+urlaub|letzten\s+urlaub\s+.*ausgegeben|ausgaben\s+vergleichen|budget\s+berechnen)/i.test(q);
    const asksForRecommendations = /(reiseziele?|wohin|urlaubsideen?|reiseideen?|reisevorschl[aä]ge?|empfehl.*(reise|urlaub|ziel)|plan.*(urlaub|reise)|urlaub.*(plan|ideen)|nächsten\s+urlaub|nächster\s+urlaub|ausflüge?|sehenswürdigkeiten?|attraktionen?|was\s+kann\s+man\s+in|beste\s+reisezeit|wann\s+.*reisen)/i.test(q);
    const asksForTravelResearch = /(wetter|öffnungszeit|einreisebestimmung|reisehinweis|hotelpreis|flugpreis|flugverbindung|eintrittspreis|wechselkurs|umrechnungskurs|veranstaltung|geöffnet|live-preis|aktuelle\s+preise|quellen\s+für|online\s+recherch)/i.test(q);
    const asksForCurrentInfo = /(aktuell|aktuelle|aktuellen|heute|jetzt|dieses\s+jahr|diesen\s+sommer|dieses\s+wochenende|preis|preise|verfügbarkeit|geöffnet)/i.test(q);
    if (asksForPersonalNumbers && !asksForRecommendations) return false;
    return asksForRecommendations || (asksForTravelResearch && asksForCurrentInfo);
  }

  function aiThinkingStepsFor(input) {
    const q = String(input || "").toLowerCase();
    if (aiQuestionNeedsWebSearch(input)) {

        "Ich vergleiche die gefundenen Quellen",

  }

  function stopAIThinking() {
    if (aiThinkingTimer !== null) {
      clearInterval(aiThinkingTimer);
      aiThinkingTimer = null;
    }
  }

  function startAIThinking(input) {
    stopAIThinking();
    const steps = aiThinkingStepsFor(input);
    let index = 0;
    aiThinkingStatus = steps[0];
    aiThinkingTimer = setInterval(() => {
      index = (index + 1) % steps.length;
      aiThinkingStatus = steps[index];
      const label = document.getElementById("ai-thinking-label");
      if (label) {
        label.textContent = aiThinkingStatus;
        label.classList.remove("ai-thinking-refresh");
        void label.offsetWidth;
        label.classList.add("ai-thinking-refresh");
      }
    }, 1750);
  }

  async function sendAIMessage(textOverride = "") {
    const input = String(textOverride || aiInput || "").trim();
    if (!input || aiLoading) return;
    if (aiQuotaRemaining === 0) {
      aiError = "Dein kostenloses KI-Limit für heute ist erreicht. Morgen kannst du wieder Fragen stellen.";
      render();
      return;
    }
    aiInput = "";
    aiError = "";
    aiMessages = [...aiMessages, {role:"user", content:input}];
    aiLoading = true;
    startAIThinking(input);
    render();
    try {
      const context = aiContext();
      const receiptImageForRequest = aiReceiptImageDataUrl;
      const payload = { messages: aiMessages.slice(-12), context, webSearchEnabled: aiWebSearchEnabled };
      if (receiptImageForRequest) payload.receiptImageDataUrl = receiptImageForRequest;
      const result = await supabase.functions.invoke("urlaubassistent-ai", { body: payload });
      const fnError = result.error;
      if (fnError) {
        let detail = {};
        const response = fnError?.context;
        try {
          if (response?.clone) detail = await response.clone().json();
        } catch {}
        const status = Number(response?.status || 0);
        if (detail?.code === "AI_DAILY_LIMIT" || status === 429) {
          aiQuotaRemaining = 0;
          aiError = detail?.global
            ? "Die kostenlose Reise-KI ist für heute bereits ausgelastet. Morgen geht es weiter."
            : "Du hast dein kostenloses KI-Limit für heute erreicht. Morgen geht es weiter.";
        } else if (detail?.code === "AI_PROVIDER_BUSY") {
          aiError = "Die kostenlose Reise-KI ist gerade stark ausgelastet. Bitte versuche es später erneut.";
        } else if (status === 401) {
          aiError = "Die Reise-KI ist gerade nicht verbunden. Bitte melde dich einmal neu an.";
        } else {
          aiError = "Die Reise-KI ist gerade nicht erreichbar. Deine restliche App funktioniert natürlich weiter.";
        }
        throw fnError;
      }
      const data = result.data || {};
      const reply = String(data?.reply || "").trim();
      if (!reply) throw new Error("empty-ai-reply");
      if (Number.isFinite(Number(data?.quota?.remaining))) aiQuotaRemaining = Math.max(0, Number(data.quota.remaining));
      const sources = Array.isArray(data?.sources) ? data.sources : [];
      const actions = normalizeAIActionProposal(data?.actions);
      if (Number.isFinite(Number(data?.searchQuota?.remaining))) aiSearchQuotaRemaining = Math.max(0, Number(data.searchQuota.remaining));
      aiMessages = [...aiMessages, {
        role:"assistant", content:reply, sources, actions,
        webSearchRequested:Boolean(data?.webSearchRequested),
        webSearchEligible:Boolean(data?.webSearchEligible),
        webSearchBlockedReason:String(data?.webSearchBlockedReason || ""),
        followUps:aiFollowUpsFor(input)
      }];
    } catch (e) {
      if (!aiError) {
        aiError = e?.message === "empty-ai-reply"
          ? "Die Reise-KI hat gerade keine Antwort zurückgegeben. Versuch es gleich noch einmal."
          : "Die Reise-KI ist gerade nicht erreichbar. Versuch es gleich noch einmal.";
      }
    } finally {
      stopAIThinking();
      aiLoading = false;
      if (aiReceiptImageDataUrl) { aiReceiptImageDataUrl = ""; aiReceiptImageName = ""; }
      render();
      setTimeout(()=>{ const box=document.getElementById("ai-chat-messages"); if(box) box.scrollTop=box.scrollHeight; }, 0);
    }
  }

  function normalizeAIActionProposal(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return null;
    const text = (v, max) => typeof v === "string" ? v.trim().slice(0, max || 160) : "";
    const rows = (list, kind) => (Array.isArray(list) ? list : []).slice(0, 10).map(item => {
      if (!item || typeof item !== "object") return null;
      if (kind === "text") {
        const value = text(item.text, 160);
        return value ? {text:value} : null;
      }
      const title = text(item.title, 100);
      const amount = Number(item.amount);
      if (!title || !Number.isFinite(amount) || amount <= 0 || amount > 1000000) return null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date || "")) ? String(item.date) : iso();
      return {title,amount:Math.round(amount*100)/100,category:text(item.category,48),date,note:text(item.note,220),personName:text(item.personName,80)};
    }).filter(Boolean);
    const ids = list => Array.isArray(list) ? [...new Set(list.filter(id=>typeof id==="string"&&id.length<=80).map(id=>id.trim()).filter(Boolean))].slice(0,20) : [];
    const actions = {
      expenses:rows(value.expenses,"expense"),
      tolls:rows(value.tolls,"toll"),
      packingItems:rows(value.packingItems,"text"),
      todos:rows(value.todos,"text"),
      completeTodoIds:ids(value.completeTodoIds),
      completePackingIds:ids(value.completePackingIds)
    };
    return Object.values(actions).some(list=>list.length) ? actions : null;
  }

  function aiActionPreviewHTML(actions, messageIndex) {
    const a=normalizeAIActionProposal(actions);
    if(!a)return "";
    const expenseTotal=a.expenses.reduce((sum,item)=>sum+item.amount,0);
    const tollTotal=a.tolls.reduce((sum,item)=>sum+item.amount,0);
    const count=a.expenses.length+a.tolls.length+a.packingItems.length+a.todos.length+a.completeTodoIds.length+a.completePackingIds.length;

  async function optimizeReceiptImage(file) {
    if(!file||!String(file.type||"").startsWith("image/"))throw new Error("Bitte wähle ein Foto oder Bild des Kassenbons.");
    if(file.size>15*1024*1024)throw new Error("Das Foto ist zu groß. Bitte wähle ein Bild unter 15 MB.");
    const source=await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onerror=()=>reject(new Error("Das Kassenbonfoto konnte nicht gelesen werden."));
      reader.onload=()=>resolve(String(reader.result||""));reader.readAsDataURL(file);
    });
    const image=await new Promise((resolve,reject)=>{
      const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Das Foto konnte nicht geöffnet werden."));img.src=source;
    });
    const scale=Math.min(1,1440/Math.max(image.width,image.height));
    const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    const ctx=canvas.getContext("2d");if(!ctx)throw new Error("Das Foto konnte nicht vorbereitet werden.");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
    let optimized=canvas.toDataURL("image/jpeg",0.78);if(optimized.length>2800000)optimized=canvas.toDataURL("image/jpeg",0.58);
    if(optimized.length>3000000)throw new Error("Das Bild ist noch zu groß. Bitte fotografiere den Bon erneut.");
    return optimized;
  }

  function startAISpeechInput() {
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){aiError="Dieser Browser unterstützt keine integrierte Spracherkennung. Nutze die Texteingabe oder die Kassenbon-Funktion.";render();return;}
    if(aiListening){try{aiSpeechRecognition?.stop();}catch{}aiListening=false;render();return;}
    try{
      const recognition=new Recognition();recognition.lang="de-DE";recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
      recognition.onresult=event=>{
        const transcript=String(event.results?.[0]?.[0]?.transcript||"").trim();aiListening=false;
        if(transcript)aiInput=[aiInput,transcript].filter(Boolean).join(" ").trim();else aiError="Ich habe nichts verstanden. Versuche es bitte noch einmal.";
        render();setTimeout(()=>{const input=document.getElementById("ai-input");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},0);
      };
      recognition.onerror=event=>{aiListening=false;aiError=event.error==="not-allowed"?"Bitte erlaube den Mikrofonzugriff in deinem Browser.":"Die Sprache konnte nicht erkannt werden. Du kannst es erneut versuchen oder tippen.";render();};
      recognition.onend=()=>{if(aiListening){aiListening=false;render();}};
      aiSpeechRecognition=recognition;aiListening=true;aiError="";render();recognition.start();
    }catch{aiListening=false;aiError="Das Mikrofon konnte nicht gestartet werden. Prüfe die Browser-Berechtigung.";render();}
  }

  async function applyAIActions(messageIndex) {
    if(aiActionsApplying)return;
    const message=aiMessages[messageIndex];const actions=normalizeAIActionProposal(message?.actions);const trip=activeTrip();
    if(!actions||!trip){aiError="Bitte wähle zuerst einen Urlaub aus.";render();return;}
    if(!session?.user?.id){aiError="Bitte melde dich an, um Änderungen zu speichern.";render();return;}
    if(trip.role==="viewer"){aiError="Du hast in diesem geteilten Urlaub nur Leserechte.";render();return;}
    const openTodos=trip.todos.filter(item=>!item.done).slice(0,20);
    const openPacking=trip.packlist.filter(item=>!item.done).slice(0,20);
    const completeTodoIds=actions.completeTodoIds.map(key=>{const match=/^todo-(\d+)$/.exec(String(key));return match?openTodos[Number(match[1])-1]?.id:null;}).filter(Boolean);
    const completePackingIds=actions.completePackingIds.map(key=>{const match=/^packing-(\d+)$/.exec(String(key));return match?openPacking[Number(match[1])-1]?.id:null;}).filter(Boolean);
    const expenses=actions.expenses.map(item=>{
      const person=item.personName?trip.people.find(p=>String(p.name).toLowerCase()===item.personName.toLowerCase()):null;
      return {user_id:session.user.id,trip_id:trip.id,title:item.title,amount:item.amount,category:normalizeExpenseCategory(item.category||"Sonstiges")||"Sonstiges",person_id:person?.id||null,note:item.note||"",expense_date:item.date||iso()};
    });
    const tolls=actions.tolls.map(item=>{
      const person=item.personName?trip.people.find(p=>String(p.name).toLowerCase()===item.personName.toLowerCase()):null;
      return {user_id:session.user.id,trip_id:trip.id,title:item.title,amount:item.amount,category:normalizeExpenseCategory(item.category||"Parken")||"Parken",person_id:person?.id||null,note:item.note||"",toll_date:item.date||iso()};
    });
    const counts={expenses:0,tolls:0,packing:0,todos:0,doneTodos:0,donePacking:0};aiActionsApplying=true;aiError="";render();
    try{
      if(expenses.length){const {error:e}=await supabase.from("trip_expenses").insert(expenses);if(e)throw e;counts.expenses=expenses.length;message.actions.expenses=[];addActivity(trip.id,"hat "+expenses.length+" KI-Ausgabe(n) eingetragen","receipt-text");}
      if(tolls.length){const {error:e}=await supabase.from("trip_tolls").insert(tolls);if(e)throw e;counts.tolls=tolls.length;message.actions.tolls=[];addActivity(trip.id,"hat "+tolls.length+" KI-Gebühreneintrag/-einträge eingetragen","car-front");}
      if(actions.packingItems.length){const rows=actions.packingItems.map(item=>({user_id:session.user.id,trip_id:trip.id,text:item.text,done:false}));const {error:e}=await supabase.from("trip_pack_items").insert(rows);if(e)throw e;counts.packing=rows.length;message.actions.packingItems=[];addActivity(trip.id,"hat "+rows.length+" KI-Packlistenpunkt(e) hinzugefügt","luggage");}
      if(actions.todos.length){const rows=actions.todos.map(item=>({user_id:session.user.id,trip_id:trip.id,text:item.text,done:false}));const {error:e}=await supabase.from("trip_todos").insert(rows);if(e)throw e;counts.todos=rows.length;message.actions.todos=[];addActivity(trip.id,"hat "+rows.length+" KI-To-do(s) hinzugefügt","list-checks");}
      if(completeTodoIds.length){const {error:e}=await supabase.from("trip_todos").update({done:true}).in("id",completeTodoIds).eq("trip_id",trip.id);if(e)throw e;counts.doneTodos=completeTodoIds.length;message.actions.completeTodoIds=[];}
      if(completePackingIds.length){const {error:e}=await supabase.from("trip_pack_items").update({done:true}).in("id",completePackingIds).eq("trip_id",trip.id);if(e)throw e;counts.donePacking=completePackingIds.length;message.actions.completePackingIds=[];}
      message.actions=null;message.actionsApplied=true;await loadTrips();
      const saved=[];if(counts.expenses)saved.push(counts.expenses+" "+(counts.expenses===1?"Ausgabe":"Ausgaben"));if(counts.tolls)saved.push(counts.tolls+" Gebühreneinträge");if(counts.packing)saved.push(counts.packing+" Packlistenpunkte");if(counts.todos)saved.push(counts.todos+" To-dos");if(counts.doneTodos)saved.push(counts.doneTodos+" To-dos abgehakt");if(counts.donePacking)saved.push(counts.donePacking+" Packlistenpunkte abgehakt");
      aiMessages=[...aiMessages,{role:"assistant",content:saved.length?"Erledigt! Gespeichert: "+saved.join(", ")+".":"Es gab keine gültigen Änderungen zum Speichern.",followUps:["Zeige mir mein aktuelles Budget","Was ist auf meiner Packliste noch offen?"]}];render();
    }catch(e){aiError="Nicht alle Änderungen konnten gespeichert werden. Bitte prüfe die Listen, bevor du es erneut versuchst. "+(e?.message||"");render();}
    finally{aiActionsApplying=false;render();}
  }

  function activeTrip() {
    return trips.find(t=>t.id===selectedTripId) || trips[0] || null;
  }

  function totals() {
    const trip = activeTrip();
    if (!trip) return { total:0, remaining:0 };
    const all = [...trip.expenses,...trip.tolls];
    const total = all.reduce((s,e)=>s+Number(e.amount||0),0);
    return { total, remaining:Number(trip.budget||0)-total };
  }

  function dayItems() {
    const trip = activeTrip();
    return trip ? [...trip.expenses,...trip.tolls].filter(e=>e.date===daySelected) : [];
  }

  async function loadTrips() {
    if (!session) return;
    loadingData = true;
    error = "";
    render();
    try {
      const membershipsRes = await supabase.from("trip_members").select("trip_id, role").eq("user_id", session.user.id);
      if (membershipsRes.error) throw membershipsRes.error;
      const membershipMap = new Map();
      (membershipsRes.data || []).forEach(r => membershipMap.set(r.trip_id, r.role));

      const tripsRes = await supabase.from("trips").select("*").order("created_at", { ascending:false });
      if (tripsRes.error) throw tripsRes.error;

      const [peopleRes, expensesRes, tollsRes, packRes, todoRes] = await Promise.all([
        supabase.from("trip_people").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_expenses").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_tolls").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_pack_items").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_todos").select("*").order("created_at", {ascending:true})
      ]);
      for (const r of [peopleRes,expensesRes,tollsRes,packRes,todoRes]) if (r.error) throw r.error;

      const ownTrips = (tripsRes.data || []).filter(t => t.user_id === session.user.id);
      if (ownTrips.length) {
        const memberships = ownTrips.map(t => ({ trip_id:t.id, user_id:session.user.id, role:"owner" }));
        const up = await supabase.from("trip_members").upsert(memberships,{onConflict:"trip_id,user_id",ignoreDuplicates:true});
        if (up.error) throw up.error;
        ownTrips.forEach(t => membershipMap.set(t.id,"owner"));
      }

      const group = (rows,key,build) => {
        const map = new Map();
        (rows||[]).forEach(r=>{ const arr=map.get(r[key])||[]; arr.push(build(r)); map.set(r[key],arr); });
        return map;
      };

      const peopleByTrip = group(peopleRes.data,"trip_id",r=>({id:r.id,name:r.name}));
      const expensesByTrip = group(expensesRes.data,"trip_id",r=>({id:r.id,title:r.title,amount:Number(r.amount||0),category:r.category||"Sonstiges",personId:r.person_id||null,date:r.expense_date||iso(),note:r.note||""}));
      const tollsByTrip = group(tollsRes.data,"trip_id",r=>({id:r.id,title:r.title,amount:Number(r.amount||0),category:r.category||"Maut",personId:r.person_id||null,date:r.toll_date||iso(),note:r.note||""}));
      const packByTrip = group(packRes.data,"trip_id",r=>({id:r.id,text:r.text,done:Boolean(r.done)}));
      const todoByTrip = group(todoRes.data,"trip_id",r=>({id:r.id,text:r.text,done:Boolean(r.done)}));

      trips = (tripsRes.data || []).map(r => {
        const role = r.user_id === session.user.id ? "owner" : (membershipMap.get(r.id) || "viewer");
        return { id:r.id,name:r.name,destination:r.destination||"",startDate:r.start_date||iso(),endDate:r.end_date||iso(),budget:Number(r.budget||0),status:r.status||"geplant",people:peopleByTrip.get(r.id)||[],expenses:expensesByTrip.get(r.id)||[],tolls:tollsByTrip.get(r.id)||[],packlist:packByTrip.get(r.id)||[],todos:todoByTrip.get(r.id)||[],role,shared:r.user_id!==session.user.id || role!=="owner" };
      });

      if (!selectedTripId && trips[0]) selectedTripId = trips[0].id;
      if (selectedTripId && !trips.some(t=>t.id===selectedTripId)) selectedTripId = trips[0]?.id || null;
      if (!daySelected && trips[0]) daySelected = trips[0].startDate;
    } catch (e) {
      error = "Daten konnten nicht geladen werden. Überprüfe ggf. deine Internetverbindung.";
    } finally {
      loadingData = false;
      render();
      setupRealtime();
    }
  }

  function setupRealtime() {
    if (!activeTrip()) return;
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    const id = activeTrip().id;
    realtimeChannel = supabase.channel("trip-" + id)
      .on("postgres_changes", {event:"*",schema:"public",table:"trips",filter:`id=eq.${id}`}, (payload) => { handleRealtimeActivity("trips",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_members",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_members",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_people",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_people",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_expenses",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_expenses",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_tolls",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_tolls",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_pack_items",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_pack_items",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_todos",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_todos",payload); loadTrips(); })
      .on("broadcast", {event:"activity"}, ({payload}) => {
        if (!payload || payload.tripId !== id || payload.actorId === session?.user?.id) return;

  async function createShareCode(tripId){
    const trip=trips.find(t=>t.id===tripId);if(!trip||trip.role!=="owner")return;
    shareLoading=true;shareCode="";render();
    try{
      const existing=await supabase.from("trip_share_codes").select("code").eq("trip_id",tripId).eq("active",true).maybeSingle();
      if(existing.error)throw existing.error;
      if(existing.data?.code){shareCode=existing.data.code;return;}
      let done=false;
      for(let i=0;i<10;i++){
        const code=generateShareCode();
        const r=await supabase.from("trip_share_codes").insert({trip_id:tripId,code,active:true});

  function openCustomExpenseCategoryDialog(category) {
    const trip = activeTrip();
    if (!trip || trip.role === "viewer") return;
    const value = normalizeExpenseCategory(String(category || "").trim());
    if (!value || EXPENSE_BASE_CATEGORIES.some(c => c.value === value)) return;
    customCategoryDialog = { category: value, message: "" };
    render();
    setTimeout(() => document.getElementById("edit-custom-category")?.focus(), 40);
  }

  async function saveCustomExpenseCategory() {
    const trip = activeTrip();
    if (!trip || !customCategoryDialog) return;
    if (trip.role === "viewer") return;
    const oldName = normalizeExpenseCategory(customCategoryDialog.category || "");
    const input = document.getElementById("edit-custom-category");
    const newName = normalizeExpenseCategory(String(input?.value || "").trim());
    if (!newName) {
      customCategoryDialog.message = "! Bitte einen Namen eingeben.";
      render();
      setTimeout(() => document.getElementById("edit-custom-category")?.focus(), 40);
      return;
    }
    if (newName.length > 40) {
      customCategoryDialog.message = "! Der Kategoriename ist zu lang.";
      render();
      return;
    }
    if (EXPENSE_BASE_CATEGORIES.some(c => c.value.toLocaleLowerCase("de-DE") === newName.toLocaleLowerCase("de-DE"))) {
      customCategoryDialog.message = "! Dieser Name ist bereits eine normale Kategorie.";
      render();
      return;
    }
    const existing = customExpenseCategories(trip);
    const duplicate = existing.some(c => c !== oldName && c.toLocaleLowerCase("de-DE") === newName.toLocaleLowerCase("de-DE"));
    if (duplicate) {
      customCategoryDialog.message = "! Diese eigene Kategorie gibt es bereits.";
      render();
      return;
    }
    try {
      if (oldName !== newName) {
        const { error: updateError } = await supabase.from("trip_expenses").update({ category: newName }).eq("trip_id", trip.id).eq("category", oldName);
        if (updateError) throw updateError;
      }
      saveCustomExpenseCategories(trip.id, existing.map(c => c === oldName ? newName : c));
      if (expenseForm.category === oldName) expenseForm.category = newName;
      expenseCategorySearch = "";
      expenseCategoryMoreOpen = false;
      
      customCategoryDialog = null;
      await loadTrips();
    } catch (e) {
      customCategoryDialog.message = `! ${e?.message || "Kategorie konnte nicht geändert werden."}`;
      render();
    }
  }

  async function deleteCustomExpenseCategory() {
    const trip = activeTrip();
    if (!trip || !customCategoryDialog) return;
    if (trip.role === "viewer") return;
    const oldName = normalizeExpenseCategory(customCategoryDialog.category || "");
    if (!oldName) return;
    const confirmed = window.confirm(`Eigene Kategorie „${oldName}“ wirklich löschen? Bereits gespeicherte Ausgaben dieser Kategorie werden zu „Sonstiges“.`);
    if (!confirmed) return;
    try {
      const { error: updateError } = await supabase.from("trip_expenses").update({ category: "Sonstiges" }).eq("trip_id", trip.id).eq("category", oldName);
      if (updateError) throw updateError;
      const remaining = customExpenseCategories(trip).filter(c => c !== oldName);
      saveCustomExpenseCategories(trip.id, remaining);
      if (expenseForm.category === oldName) expenseForm.category = "Sonstiges";
      expenseCategorySearch = "";
      expenseCategoryMoreOpen = false;
      
      customCategoryDialog = null;
      await loadTrips();
    } catch (e) {
      customCategoryDialog.message = `! ${e?.message || "Kategorie konnte nicht gelöscht werden."}`;
      render();
    }
  }

  function applyExpenseCategorySearch(){
    const query = String(expenseCategorySearch || "").trim().toLocaleLowerCase("de-DE");
    const options = [...document.querySelectorAll('[data-search-option]')];
    const moreButton = document.querySelector('[data-action="toggle-expense-categories"]');
    const noResults = document.getElementById("expense-category-search-empty");

    let matches = 0;
    options.forEach((option, index) => {
      const haystack = String(option.dataset.search || "").toLocaleLowerCase("de-DE");
      const matchesQuery = !query || haystack.includes(query);
      const hiddenByLimit = !query && !expenseCategoryMoreOpen && index >= 9;
      const shouldShow = matchesQuery && !hiddenByLimit;
      option.style.display = shouldShow ? "" : "none";
      if(matchesQuery) matches++;
    });

    if(noResults) noResults.style.display = query && matches === 0 ? "block" : "none";
    if(moreButton){
      moreButton.style.display = query ? "none" : "flex";
    }
  }
