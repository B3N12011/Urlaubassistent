    if(g("join-code"))joinCode=g("join-code").value;
    if(g("recovery-password"))recoveryPassword=g("recovery-password").value;
    if(g("recovery-password2"))recoveryPassword2=g("recovery-password2").value;
    if(g("delete-email"))deleteEmail=g("delete-email").value;
    if(g("delete-password"))deletePassword=g("delete-password").value;
    if(g("settings-username"))settingsUsername=g("settings-username").value;
    if(g("settings-password"))settingsPassword=g("settings-password").value;
    if(g("settings-password2"))settingsPassword2=g("settings-password2").value;
  }

  let expenseCategoryLongPressTimer = null;
  let expenseCategoryLongPressTarget = null;
  let suppressExpenseCategoryClick = false;

  root.addEventListener("pointerdown", (event) => {
    const el = event.target.closest('button[data-custom-category="true"]');
    if (!el || el.disabled) return;
    clearTimeout(expenseCategoryLongPressTimer);
    expenseCategoryLongPressTarget = el;
    expenseCategoryLongPressTimer = setTimeout(() => {
      const value = normalizeExpenseCategory(el.dataset.category || "");
      expenseCategoryLongPressTimer = null;
      expenseCategoryLongPressTarget = null;
      suppressExpenseCategoryClick = true;
      openCustomExpenseCategoryDialog(value);
    }, 650);
  });

  function cancelExpenseCategoryLongPress(event) {
    if (!expenseCategoryLongPressTarget) return;
    if (event && event.type === "pointerleave" && event.target?.closest?.('button[data-custom-category="true"]') !== expenseCategoryLongPressTarget) return;
    clearTimeout(expenseCategoryLongPressTimer);
    expenseCategoryLongPressTimer = null;
    expenseCategoryLongPressTarget = null;
  }

  root.addEventListener("pointerup", cancelExpenseCategoryLongPress);
  root.addEventListener("pointercancel", cancelExpenseCategoryLongPress);
  root.addEventListener("pointerleave", cancelExpenseCategoryLongPress);
  root.addEventListener("dblclick", (event) => {
    const el = event.target.closest('button[data-custom-category="true"]');
    if (!el || el.disabled) return;
    clearTimeout(expenseCategoryLongPressTimer);
    expenseCategoryLongPressTimer = null;
    expenseCategoryLongPressTarget = null;
    suppressExpenseCategoryClick = true;
    event.preventDefault();
    event.stopPropagation();
    openCustomExpenseCategoryDialog(el.dataset.category || "");
  });

  root.addEventListener("input", (event) => {
    readInputs();
    if(event.target?.id === "expense-custom-category"){
      expenseCustomCategory = event.target.value;
      if(expenseCustomCategory.trim()) expenseForm.category="__custom__";
      else if(expenseForm.category === "__custom__") expenseForm.category="Essen";
    }
    if(event.target?.id === "expense-category-search") applyExpenseCategorySearch();
    if(event.target?.id === "ai-input") aiInput = event.target.value;
  });

  root.addEventListener("keydown", (event) => {
    if(event.target?.id !== "ai-input") return;
    if(event.key === "Enter" && !event.shiftKey){
      event.preventDefault();
      aiInput = event.target.value;
      sendAIMessage();
    }
  });
  root.addEventListener("change", async (event) => {
    readInputs();
    if(event.target?.id === "ai-receipt-input"){
      const file=event.target.files?.[0];
      if(!file)return;
      aiReceiptProcessing=true;aiError="";render();
      try{
        aiReceiptImageDataUrl=await optimizeReceiptImage(file);
        aiReceiptImageName=file.name||"Kassenbonfoto";
        aiInput="Bitte lies diesen Kassenbon aus und bereite eine Ausgabe über den Gesamtbetrag vor. Frage nach, wenn Geschäft, Betrag oder Datum nicht sicher erkennbar sind.";
      }catch(e){aiReceiptImageDataUrl="";aiReceiptImageName="";aiError=e.message||"Das Kassenbonfoto konnte nicht vorbereitet werden.";}finally{aiReceiptProcessing=false;render();}
      return;
    }
    if(event.target?.id === "expense-category-search"){
      expenseCategorySearch = event.target.value;
      applyExpenseCategorySearch();
    }
  });

  root.addEventListener("click", async (event) => {
    const el = event.target.closest("[data-action]");
    if (!el) return;
    readInputs();
    const action=el.dataset.action;

    try {
      if ((action === "select-expense-custom-category") && suppressExpenseCategoryClick) {
        suppressExpenseCategoryClick = false;
        return;
      }
      if(action==="navigate"){
        const page=el.dataset.page;
        if(VALID_PAGES.includes(page)){
          activePage=page;
          localStorage.setItem(PAGE_KEY,activePage);
          readInputs();
          render();
        }
        return;
      }
      if(action==="toggle-ai"){aiOpen=!aiOpen;aiError="";render();return;}
      if(action==="toggle-ai-web-search"){aiWebSearchEnabled=!aiWebSearchEnabled;localStorage.setItem(K.aiWebSearchEnabled,String(aiWebSearchEnabled));render();return;}
      if(action==="ai-start-voice"){startAISpeechInput();return;}
      if(action==="ai-receipt"){if(activeTrip()?.role==="viewer"){aiError="Du hast in diesem geteilten Urlaub nur Leserechte.";render();return;}document.getElementById("ai-receipt-input")?.click();return;}
      if(action==="remove-ai-receipt"){aiReceiptImageDataUrl="";aiReceiptImageName="";render();return;}
      if(action==="ai-multiple-expenses"){aiInput="Ich möchte mehrere echte Ausgaben auf einmal eintragen. Bitte frage nach den Beträgen und Beschreibungen, falls ich sie noch nicht genannt habe. Erstelle dann einen Entwurf, den ich vor dem Speichern prüfen kann.";aiError="";render();setTimeout(()=>{const input=document.getElementById("ai-input");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},0);return;}
      if(action==="ai-trip-manage"){aiInput="Hilf mir, meinen aktuell geöffneten Urlaub zu verwalten. Prüfe offene To-dos und Packliste und hilf mir, die Änderungen vorzubereiten. Frage nach, wenn nicht klar ist, was geändert werden soll.";aiError="";render();setTimeout(()=>{const input=document.getElementById("ai-input");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},0);return;}
      if(action==="approve-ai-actions"){await applyAIActions(Number(el.dataset.messageIndex));return;}
      if(action==="discard-ai-actions"){discardAIActions(Number(el.dataset.messageIndex));return;}
      if(action==="ai-prompt"){aiOpen=true;aiInput=el.dataset.prompt||"";render();setTimeout(()=>{const input=document.getElementById("ai-input");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},0);return;}
      if(action==="ai-followup"){await sendAIMessage(el.dataset.prompt||"");return;}
      if(action==="send-ai"){await sendAIMessage();return;}
      if(action==="accept-cookies"){acceptedCookies=true;render();return;}
      if(action==="auth-mode"){authMode=el.dataset.mode;authMessage="";authResetMessage="";render();return;}
      if(action==="toggle-auth-password"){showAuthPassword=!showAuthPassword;render();return;}
      if(action==="toggle-privacy"){privacyOpen=!privacyOpen;render();return;}
      if(action==="submit-auth"){await submitAuth();return;}
      if(action==="reset-password"){await resetPassword();return;}
      if(action==="update-password"){await updatePassword();return;}
      if(action==="open-settings"){
        settingsOpen=true;
        settingsPrivacyOpen=false;
        settingsStorageOpen=false;
        settingsMessage="";
        settingsUsername=session?.user?.user_metadata?.urlaub_assistent_name||"";
        settingsPassword="";
        settingsPassword2="";
        render();
        return;
      }
      if(action==="close-settings"){settingsOpen=false;settingsMessage="";render();return;}
      if(action==="toggle-settings-privacy"){settingsPrivacyOpen=!settingsPrivacyOpen;render();return;}
      if(action==="toggle-settings-storage"){settingsStorageOpen=!settingsStorageOpen;render();return;}
      if(action==="reopen-cookie-info"){acceptedCookies=true;settingsOpen=false;render();return;}
      if(action==="save-username"){
        const name=settingsUsername.trim();
        if(!name){settingsMessage="Name darf nicht leer sein.";render();return;}
        if(name.length>32){settingsMessage="Name darf höchstens 32 Zeichen lang sein.";render();return;}
        settingsMessage="";
        try{
          const {data,error:e}=await supabase.auth.updateUser({data:{urlaub_assistent_name:name}});
          if(e)throw e;
          session={...session,user:{...session.user,user_metadata:{...(session.user.user_metadata||{}),...(data?.user?.user_metadata||{}),urlaub_assistent_name:name}}};
          settingsMessage="Name erfolgreich gespeichert.";
        }catch(e){settingsMessage=e.message||"Name konnte nicht gespeichert werden.";}
        render();
        return;
      }
      if(action==="save-settings-password"){
        if(settingsPassword.length<6){settingsMessage="Passwort muss mindestens 6 Zeichen haben.";render();return;}
        if(settingsPassword!==settingsPassword2){settingsMessage="Passwörter stimmen nicht überein.";render();return;}
        try{
          const {error:e}=await supabase.auth.updateUser({password:settingsPassword});
          if(e)throw e;
          settingsPassword="";settingsPassword2="";settingsMessage="Passwort erfolgreich geändert.";
        }catch(e){settingsMessage=e.message||"Passwort konnte nicht geändert werden.";}
        render();
        return;
      }
      if(action==="show-delete-account"){showDeleteAccount=true;deleteEmail=session?.user?.email||"";deletePassword="";render();return;}
      if(action==="cancel-account-delete"){showDeleteAccount=false;render();return;}
      if(action==="account-reset"){authEmail=deleteEmail;showDeleteAccount=false;render();setTimeout(()=>resetPassword(),0);return;}
      if(action==="delete-account"){if(!window.confirm("Wirklich alle Daten und den Account löschen?"))return;await deleteAccount();return;}
      if(action==="sign-out"){await signOut();return;}
      if(action==="create-trip"){await createTrip();return;}
      if(action==="select-trip"){selectedTripId=el.dataset.id;localStorage.setItem(K.trip,selectedTripId);selectedPersonId=null;loadPersonMeta();activityExpanded=false;reminderMessage="";if(activeTrip()?.startDate)daySelected=activeTrip().startDate;render();setupRealtime();return;}
      if(action==="delete-trip"){deleteDialog={label:"Urlaub",onConfirm:()=>deleteTrip(el.dataset.id)};render();return;}
      if(action==="share-trip"){shareTripId=el.dataset.id;shareDialogOpen=true;shareCode="";render();await createShareCode(shareTripId);return;}
      if(action==="close-share"){shareDialogOpen=false;shareTripId=null;shareCode="";render();return;}
      if(action==="copy-share-code"){try{await navigator.clipboard.writeText(shareCode);}catch{}return;}
      if(action==="open-join"){joinDialogOpen=true;joinMessage="";joinCode="";render();return;}
      if(action==="close-join"){joinDialogOpen=false;joinMessage="";joinCode="";render();return;}
      if(action==="join-trip"){await joinSharedTrip();return;}
      if(action==="add-person"){await addPerson();return;}
      if(action==="select-person"){selectedPersonId=el.dataset.id;personPanel="overview";personExpensesExpanded=false;owesExpanded=false;owedToExpanded=false;loadPersonMeta();const current=personMeta.budgets[selectedPersonId]||0;personBudgetInput=current?String(current):"";render();return;}
      if(action==="person-section"){personPanel=el.dataset.section||"overview";debtPersonOpen=false;render();return;}
      if(action==="set-debt-direction"){debtForm.direction=el.dataset.direction||"owedBy";render();return;}
      if(action==="toggle-debt-person"){debtPersonOpen=!debtPersonOpen;render();return;}
      if(action==="select-debt-person"){debtForm.otherPersonId=el.dataset.id||"";debtPersonOpen=false;render();return;}
      if(action==="close-person"){selectedPersonId=null;personPanel="overview";render();return;}
      if(action==="delete-person"){deleteDialog={label:"Person",onConfirm:()=>deletePerson(el.dataset.id)};render();return;}
      if(action==="save-person-budget"){savePersonBudget();return;}
      if(action==="add-debt"){await addDebt();return;}
      if(action==="delete-debt"){deleteDebt(el.dataset.id);return;}
      if(action==="add-expense"){await addEntry("expense");return;}
      if(action==="add-toll"){await addEntry("toll");return;}
      if(action==="close-custom-category"){customCategoryDialog=null;render();return;}
      if(action==="save-custom-category"){await saveCustomExpenseCategory();return;}
      if(action==="delete-custom-category"){await deleteCustomExpenseCategory();return;}
      if(action==="select-expense-person"){
        expenseForm.personId=el.dataset.personId||"";
        render();
        return;
      }
      if(action==="select-expense-category"){
        expenseForm.category=normalizeExpenseCategory(el.dataset.category||"Sonstiges");
        expenseCustomCategory="";
        expenseCategorySearch="";
        expenseCategoryMoreOpen=false;
        render();
        return;
      }
      if(action==="toggle-chart-category"){
        const value=normalizeExpenseCategory(String(el.dataset.category||"").trim());
        selectedExpenseChartCategory = selectedExpenseChartCategory === value ? null : value;
        render();
        return;
      }
      if(action==="select-expense-custom-category"){
        const value=normalizeExpenseCategory(String(el.dataset.category||"").trim());
        if(!value)return;
        const trip=activeTrip();
        if(trip){
          const existing=storedCustomExpenseCategories(trip.id);
          saveCustomExpenseCategories(trip.id, [...existing, value]);
        }
        expenseForm.category=value;
        expenseCustomCategory="";
        expenseCategorySearch="";
        expenseCategoryMoreOpen=false;
        render();
        return;
      }
      if(action==="create-expense-category"){
        expenseForm.category="__custom__";
        expenseCustomCategory="";
        expenseCategorySearch="";
        expenseCategoryMoreOpen=false;
        render();
        setTimeout(()=>document.getElementById("expense-custom-category")?.focus(),40);
        return;
      }
      if(action==="toggle-expense-categories"){
        expenseCategoryMoreOpen=!expenseCategoryMoreOpen;
        render();
        return;
      }
      if(action==="add-expense-custom-category"){
        const value=normalizeExpenseCategory(String(document.getElementById("expense-custom-category")?.value ?? (expenseCustomCategory || "")).trim());
        if(!value){
          expenseCustomCategory="";
          render();
          setTimeout(()=>document.getElementById("expense-custom-category")?.focus(),40);
          return;
        }
        const trip=activeTrip();
        if(trip){
          const existing=storedCustomExpenseCategories(trip.id);
          saveCustomExpenseCategories(trip.id, [...existing, value]);
        }
        expenseForm.category=value;
        expenseCustomCategory="";
        expenseCategorySearch="";
        expenseCategoryMoreOpen=false;
        render();
        return;
      }
      if(action==="create-search-category"){
        const value=normalizeExpenseCategory(String(expenseCategorySearch||"").trim());
        if(!value) return;
        const trip=activeTrip();
        if(trip){
          const existing=storedCustomExpenseCategories(trip.id);
          saveCustomExpenseCategories(trip.id, [...existing, value]);
        }
        expenseForm.category=value;
        expenseCustomCategory="";
        expenseCategorySearch="";
        expenseCategoryMoreOpen=false;
        render();
        return;
      }
      if(action==="delete-entry"){await deleteEntry(el.dataset.kind,el.dataset.id);return;}
      if(action==="add-pack"){await addList("pack");return;}
      if(action==="add-todo"){await addList("todo");return;}
      if(action==="toggle-list"){await toggleList(el.dataset.kind,el.dataset.id);return;}
      if(action==="delete-list"){await deleteList(el.dataset.kind,el.dataset.id);return;}
      if(action==="toggle-check"){
        const trip=activeTrip(); if(!trip)return;
        const checks=getChecklist(trip.id); const key=el.dataset.check;
        if(!Object.prototype.hasOwnProperty.call(checks,key))return;
        checks[key]=!checks[key]; saveChecklist(trip.id,checks);

        render(); return;
      }
      if(action==="toggle-reminders"){
        remindersEnabled=!remindersEnabled; localStorage.setItem(K.reminders,String(remindersEnabled));
        reminderMessage=remindersEnabled?"Erinnerungen sind eingeschaltet.":"Erinnerungen sind ausgeschaltet."; render(); return;
      }
      if(action==="toggle-passport-reminder"){
        passportReminderEnabled=!passportReminderEnabled; localStorage.setItem(K.passportReminder,String(passportReminderEnabled)); render(); return;
      }
      if(action==="toggle-departure-reminder"){
        departureReminderEnabled=!departureReminderEnabled; localStorage.setItem(K.departureReminder,String(departureReminderEnabled)); render(); return;
      }
      if(action==="enable-notifications"){requestNotificationPermission();return;}
      if(action==="test-reminder"){
        if(typeof Notification==="undefined"){reminderMessage="Dieser Browser unterstützt keine Benachrichtigungen.";render();return;}
        if(Notification.permission!=="granted"){requestNotificationPermission();return;}
        const check=tripCheckData(activeTrip());
        const openCount=check.total-check.done;
        const sent=sendBrowserNotification("Urlaubassistent",openCount?`Noch ${openCount} Punkte im Reise-Check offen.`:"Der Reise-Check ist vollständig erledigt.");
        reminderMessage=sent?"Testbenachrichtigung wurde gesendet.":"Die Benachrichtigung konnte nicht gesendet werden."; render(); return;
      }
      if(action==="toggle-more"){
        const target=el.dataset.target;
        const map={trips:"tripsExpanded",people:"peopleExpanded",expenses:"expensesExpanded",tolls:"tollsExpanded",day:"dayExpanded",pack:"packExpanded",todo:"todoExpanded",personExpenses:"personExpensesExpanded",owes:"owesExpanded",owedTo:"owedToExpanded",activity:"activityExpanded"};
        const prop=map[target];
        if(prop==="tripsExpanded")tripsExpanded=!tripsExpanded;
        if(prop==="peopleExpanded")peopleExpanded=!peopleExpanded;
        if(prop==="expensesExpanded")expensesExpanded=!expensesExpanded;
        if(prop==="tollsExpanded")tollsExpanded=!tollsExpanded;
        if(prop==="dayExpanded")dayExpanded=!dayExpanded;
        if(prop==="packExpanded")packExpanded=!packExpanded;
        if(prop==="todoExpanded")todoExpanded=!todoExpanded;
        if(prop==="personExpensesExpanded")personExpensesExpanded=!personExpensesExpanded;
        if(prop==="owesExpanded")owesExpanded=!owesExpanded;
        if(prop==="owedToExpanded")owedToExpanded=!owedToExpanded;
        if(prop==="activityExpanded")activityExpanded=!activityExpanded;
        render();return;
      }
      if(action==="cancel-delete"){deleteDialog=null;render();return;}
      if(action==="confirm-delete"){const d=deleteDialog;deleteDialog=null;if(d?.onConfirm)await d.onConfirm();return;}
    } catch(e) {
      error=e.message||"Etwas ist schiefgelaufen.";
      render();
    }
  });

  // Keep these UI state variables accessible without changing the data model.
  Object.defineProperties(window, {
    tripsExpanded:{get:()=>tripsExpanded,set:v=>{tripsExpanded=!!v}},
    peopleExpanded:{get:()=>peopleExpanded,set:v=>{peopleExpanded=!!v}},
    expensesExpanded:{get:()=>expensesExpanded,set:v=>{expensesExpanded=!!v}},
    tollsExpanded:{get:()=>tollsExpanded,set:v=>{tollsExpanded=!!v}},
    dayExpanded:{get:()=>dayExpanded,set:v=>{dayExpanded=!!v}},
    packExpanded:{get:()=>packExpanded,set:v=>{packExpanded=!!v}},
    todoExpanded:{get:()=>todoExpanded,set:v=>{todoExpanded=!!v}},
    personExpensesExpanded:{get:()=>personExpensesExpanded,set:v=>{personExpensesExpanded=!!v}},
    owesExpanded:{get:()=>owesExpanded,set:v=>{owesExpanded=!!v}},
    owedToExpanded:{get:()=>owedToExpanded,set:v=>{owedToExpanded=!!v}}
  });

  window.addEventListener("online",()=>{offline=false;render();if(session)loadTrips();});
  window.addEventListener("offline",()=>{offline=true;render();});


  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js?v=9").catch(() => {});
    }, { once: true });
  }

  const params=new URLSearchParams(location.search);
  recovery=params.get("type")==="recovery";

  supabase.auth.getSession().then(({data})=>{
    session=data.session||null;
    settingsUsername=session?.user?.user_metadata?.urlaub_assistent_name||"";
    checking=false;
    acceptedCookies=true;
    render();
    if(session){acceptedCookies=true;loadTrips();}
  }).catch(()=>{checking=false;render();});

  supabase.auth.onAuthStateChange((_event,nextSession)=>{
    session=nextSession;
    if(!session) aiOpen=false;
    settingsUsername=session?.user?.user_metadata?.urlaub_assistent_name||"";
    if(_event==="PASSWORD_RECOVERY") recovery=true;
    if(session && !recovery){acceptedCookies=true;loadTrips();}else{render();}
  });

  render();
})();
</script>
</body>
</html>
