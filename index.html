  function activeTrip() {
    return trips.find(t=>t.id===selectedTripId) || trips[0] || null;
  }

  function aiChatStorageKey() {
    if (!session?.user?.id) return "";
    const trip = activeTrip();
    return K.aiChatPrefix + session.user.id + "-" + (trip?.id || "general");
  }

  function aiConversationStorageKey() {
    if (!session?.user?.id) return "";
    const trip = activeTrip();
    return "urlaubassistent-ai-active-conversation-" + session.user.id + "-" + (trip?.id || "general");
  }

  function newAIConversationId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, ch => {
      const r = Math.random() * 16 | 0;
      return (ch === "x" ? r : (r & 3 | 8)).toString(16);
    });
  }

  function aiChatTitleFromMessages(messages) {
    const firstUser = (Array.isArray(messages) ? messages : []).find(message => message?.role === "user" && String(message.content || "").trim());
    const raw = String(firstUser?.content || "").trim().replace(/\s+/g, " ");
    if (!raw) return "Neuer Chat";
    if (/kassenbon|bonfoto|beleg fotograf/i.test(raw)) return "Kassenbon auswerten";
    return raw.slice(0, 64) + (raw.length > 64 ? "…" : "");
  }

  function defaultAIChatMessage() {
    return {
      role:"assistant",
      content:"Hi! Ich bin dein Reise-KI-Assistent. Ich helfe dir bei Urlaub, Budget und Packliste. Du kannst mir Fragen stellen, per Mikrofon Ausgaben diktieren oder einen Kassenbon fotografieren. Änderungen speichere ich erst nach deiner Bestätigung."
    };
  }

  function restoreAIChatMessages(storedMessages) {
    return (Array.isArray(storedMessages) ? storedMessages : []).slice(-60).map(message => {
      if (!message || !["user","assistant"].includes(message.role) || typeof message.content !== "string") return null;
      const item = {role:message.role,content:message.content.slice(0,7000)};
      if (Array.isArray(message.sources)) item.sources = message.sources.slice(0,3);
      if (message.webSearchRequested) item.webSearchRequested = true;
      if (message.webSearchEligible) item.webSearchEligible = true;
      if (message.webSearchBlockedReason) item.webSearchBlockedReason = String(message.webSearchBlockedReason).slice(0,32);
      if (Array.isArray(message.followUps)) item.followUps = message.followUps.slice(0,3);
      if (message.pendingActionDiscarded) {
        item.content += "\n\n*Ein offener Änderungsentwurf wurde beim Neuladen aus Sicherheitsgründen verworfen. Bitte fordere ihn erneut an; gespeichert wurde noch nichts.*";
        item.actionsDismissed = true;
      }
      if (message.actionsApplied) item.actionsApplied = true;
      if (message.actionsDismissed) item.actionsDismissed = true;
      return item;
    }).filter(Boolean);
  }

  function messagesForAIStorage() {
    return aiMessages.slice(-60).map(message => {
      const stored = { role:message.role === "user" ? "user" : "assistant", content:String(message.content || "").slice(0,7000) };
      if (Array.isArray(message.sources)) {
        stored.sources = message.sources.slice(0,3).map(source => {
          try {
            const url = new URL(String(source.url || ""));
            if (url.protocol !== "https:") return null;
            return {url:url.href,title:String(source.title || url.hostname).slice(0,150),snippet:String(source.snippet || "").slice(0,220)};
          } catch { return null; }
        }).filter(Boolean);
      }
      if (message.webSearchRequested) stored.webSearchRequested = true;
      if (message.webSearchEligible) stored.webSearchEligible = true;
      if (message.webSearchBlockedReason) stored.webSearchBlockedReason = String(message.webSearchBlockedReason).slice(0,32);
      if (Array.isArray(message.followUps)) stored.followUps = message.followUps.slice(0,3).map(v=>String(v).slice(0,120));
      if (message.actions && !message.actionsApplied && !message.actionsDismissed) stored.pendingActionDiscarded = true;
      if (message.actionsApplied) stored.actionsApplied = true;
      if (message.actionsDismissed) stored.actionsDismissed = true;
      return stored;
    });
  }

  function setAIChatSaveStatus(status) {
    aiChatSaveStatus = String(status || "");
    const label = document.getElementById("ai-chat-save-status");
    if (label) {
      label.textContent = aiChatSaveStatus;
      const statusLower = aiChatSaveStatus.toLowerCase();
      label.className = "mt-1 text-center text-[10px] leading-4 font-semibold " + (statusLower.includes("fehlgeschlagen") ? "text-amber-600" : statusLower.includes("synchronisiere") ? "text-slate-500" : /gespeichert/i.test(aiChatSaveStatus) ? "text-emerald-600" : "text-slate-500");
    }
  }

  function saveAIChatHistory() {
    const key = aiChatStorageKey();
    if (!key) return Promise.resolve();
    try {
      const messages = messagesForAIStorage();
      const savedAt = new Date().toISOString();
      const hasUserMessages = messages.some(message => message.role === "user");
      if (hasUserMessages && session?.user?.id && !aiCurrentConversationId) {
        aiCurrentConversationId = newAIConversationId();
        aiCurrentConversationCreatedAt = savedAt;
        const activeKey = aiConversationStorageKey();
        if (activeKey) localStorage.setItem(activeKey, aiCurrentConversationId);
      }
      const snapshot = {version:1,savedAt,conversationId:aiCurrentConversationId,newChat:!hasUserMessages&&!aiCurrentConversationId,messages};
      localStorage.setItem(key,JSON.stringify(snapshot));
      aiChatLoadedStorageKey = key;
      setAIChatSaveStatus(hasUserMessages ? "Lokal gespeichert · synchronisiere mit deinem Konto…" : "Neuer Chat");

      if (session?.user?.id) {
        const trip = activeTrip();
        const scopeKey = trip?.id ? "trip:" + trip.id : "general";
        const legacyRow = {user_id:session.user.id,scope_key:scopeKey,trip_id:trip?.id || null,messages,updated_at:savedAt};
        const shouldSaveConversation = hasUserMessages && Boolean(aiCurrentConversationId);
        const conversationRow = shouldSaveConversation ? {
          id:aiCurrentConversationId,
          user_id:session.user.id,
          trip_id:trip?.id || null,
          title:aiChatTitleFromMessages(messages),
          messages,
          created_at:aiCurrentConversationCreatedAt || savedAt,
          updated_at:savedAt
        } : null;
        aiChatCloudSaveQueue = aiChatCloudSaveQueue.catch(()=>{}).then(async()=>{
          const {error:legacyError} = await supabase.from("ai_chat_history").upsert(legacyRow,{onConflict:"user_id,scope_key"});
          if (legacyError) console.warn("AI cloud history save failed; local history is kept",legacyError.message || "");
          if (!conversationRow) {
            setAIChatSaveStatus(legacyError ? "Lokal gespeichert · Cloud-Sync fehlgeschlagen" : (hasUserMessages ? "In deinem Konto gespeichert" : "Bereit für deinen nächsten Chat"));
            return;
          }
          const {error:conversationError} = await supabase.from("ai_chat_conversations").upsert(conversationRow,{onConflict:"id"});
          if (conversationError) {
            console.warn("AI saved conversation could not be synced",conversationError.message || "");
            setAIChatSaveStatus("Lokal gespeichert · Konto-Sync fehlgeschlagen");
            return;
          }
          aiSavedChats = [conversationRow,...aiSavedChats.filter(chat=>chat.id!==conversationRow.id)]
            .sort((a,b)=>String(b.updated_at||"").localeCompare(String(a.updated_at||"")))
            .slice(0,30);
          setAIChatSaveStatus("In deinem Konto gespeichert");
        }).catch(e=>{
          console.warn("AI chat cloud save failed; local copy remains",e?.message || "");
          setAIChatSaveStatus("Lokal gespeichert · Konto-Sync fehlgeschlagen");
        });
      } else {
        setAIChatSaveStatus(hasUserMessages ? "Nur auf diesem Gerät gespeichert · bitte anmelden, um zu synchronisieren" : "Bereit für deinen nächsten Chat");
      }
      return aiChatCloudSaveQueue;
    } catch(e) {
      console.warn("AI chat history could not be stored locally",e?.message || "");
      setAIChatSaveStatus("Speichern auf diesem Gerät fehlgeschlagen");
      return Promise.resolve();
    }
  }

  async function loadAISavedChats() {
    if (!session?.user?.id) {
      aiSavedChats=[];
      aiChatHistoryError="Bitte melde dich an, um gespeicherte Chats zu öffnen.";
      return [];
    }
    const requestKey=aiChatStorageKey();
    const trip=activeTrip();
    await aiChatCloudSaveQueue.catch(()=>{});
    aiChatHistoryLoading=true;
    aiChatHistoryError="";
    render();
    try {
      let query=supabase.from("ai_chat_conversations")
        .select("id,title,trip_id,messages,created_at,updated_at")
        .eq("user_id",session.user.id);
      query=trip?.id ? query.eq("trip_id",trip.id) : query.is("trip_id",null);
      const {data,error:cloudError}=await query.order("updated_at",{ascending:false}).limit(30);
      if(cloudError)throw cloudError;
      if(aiChatStorageKey()!==requestKey)return aiSavedChats;
      aiSavedChats=Array.isArray(data)?data:[];
    } catch(e) {
      aiChatHistoryError=friendlyAppError(e,"Laden des Chat-Verlaufs");
      console.warn("Saved AI chats could not be loaded",e?.message||"");
    } finally {
      aiChatHistoryLoading=false;
      render();
    }
    return aiSavedChats;
  }

  function aiSavedChatsHTML() {
    const trip=activeTrip();
    const heading=trip ? "Chats für "+trip.name : "Allgemeine Chats";
    const cards=aiSavedChats.map(chat=>{
      const messages=restoreAIChatMessages(chat.messages);
      const lastUser=[...messages].reverse().find(message=>message.role==="user");
      const lastAssistant=[...messages].reverse().find(message=>message.role==="assistant");
      const snippet=String(lastUser?.content||lastAssistant?.content||"Unterhaltung").replace(/\s+/g," ").slice(0,100);
      let dateLabel="Gespeichert";

      return '<button type="button" data-action="open-ai-saved-chat" data-chat-id="'+esc(chat.id)+'" class="flex w-full items-start gap-3 rounded-2xl border border-slate-200 bg-white p-3 text-left shadow-sm transition hover:border-slate-300 hover:bg-slate-100/40 active:scale-[.99]">'+
        '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-white ring-1 ring-slate-200">'+icon("messages-square","h-5 w-5")+'</span>'+
        '<span class="min-w-0 flex-1"><span class="block truncate text-sm font-bold text-slate-900">'+esc(chat.title||"Urlaub-Chat")+'</span><span class="mt-1 block text-[11px] leading-4 text-slate-500">'+esc(snippet)+'</span><span class="mt-2 block text-[10px] font-semibold text-slate-400">'+esc(dateLabel)+' · '+messages.filter(message=>message.role==="user").length+' Nachrichten</span></span>'+
        icon("chevron-right","mt-2 h-4 w-4 shrink-0 text-slate-400")+'</button>';
    }).join("");
    return '<div class="space-y-3">'+
      '<div class="flex items-center gap-3"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-white">'+icon("messages-square","h-5 w-5")+'</span><div class="min-w-0 flex-1"><h3 class="text-base font-extrabold text-slate-900">Gespeicherte Chats</h3><p class="text-xs text-slate-500">'+esc(heading)+' · nur für dein Konto sichtbar</p></div></div>'+
      (aiChatHistoryLoading?'<div class="rounded-2xl border border-slate-200 bg-white p-4 text-sm text-slate-500"><span class="ai-thinking-text">Chat-Verlauf wird geladen…</span></div>':"")+
      (aiChatHistoryError?'<div class="rounded-2xl border border-amber-200 bg-amber-50 p-3 text-xs leading-5 text-amber-800">'+esc(aiChatHistoryError)+'</div>':"")+
      (!aiChatHistoryLoading&&!aiSavedChats.length&&!aiChatHistoryError?'<div class="rounded-2xl border border-dashed border-slate-300 bg-white/80 p-5 text-center"><span class="mx-auto flex h-11 w-11 items-center justify-center rounded-2xl bg-slate-100 text-slate-500">'+icon("messages-square","h-5 w-5")+'</span><div class="mt-3 text-sm font-bold text-slate-800">Noch keine gespeicherten Gespräche</div><div class="mt-1 text-xs leading-5 text-slate-500">Sobald du eine Frage stellst, wird dieser Chat gespeichert und kann später hier wieder geöffnet werden.</div></div>':"")+
      (cards?'<div class="space-y-2">'+cards+'</div>':"")+
      '<div class="grid grid-cols-2 gap-2 pt-1"><button type="button" data-action="new-ai-chat" class="flex items-center justify-center gap-1.5 rounded-xl bg-slate-900 px-3 py-3 text-xs font-bold text-white">'+icon("plus","h-4 w-4")+' Neuer Chat</button><button type="button" data-action="back-to-ai-chat" class="rounded-xl border border-slate-200 bg-white px-3 py-3 text-xs font-bold text-slate-600">Zurück zum Chat</button></div>'+
    '</div>';
  }

  async function openAISavedChat(chatId) {
    const wanted=String(chatId||"");
    let chat=aiSavedChats.find(item=>String(item.id)===wanted);
    if(!chat) {
      await loadAISavedChats();
      chat=aiSavedChats.find(item=>String(item.id)===wanted);
    }
    if(!chat){aiChatHistoryError="Dieser gespeicherte Chat wurde nicht gefunden.";render();return;}
    await aiChatCloudSaveQueue.catch(()=>{});
    aiCurrentConversationId=chat.id;
    aiCurrentConversationCreatedAt=chat.created_at||chat.updated_at||new Date().toISOString();
    const activeKey=aiConversationStorageKey();
    if(activeKey)localStorage.setItem(activeKey,aiCurrentConversationId);
    aiMessages=restoreAIChatMessages(chat.messages);
    if(!aiMessages.length)aiMessages=[defaultAIChatMessage()];
    aiChatHistoryOpen=false;
    aiError="";
    aiInput="";
    await saveAIChatHistory();
    render();
    setTimeout(()=>{const box=document.getElementById("ai-chat-messages");if(box)box.scrollTop=box.scrollHeight;},0);
  }

  async function startNewAIChat() {
    saveAIChatHistory();
    await aiChatCloudSaveQueue.catch(()=>{});
    aiCurrentConversationId=null;
    aiCurrentConversationCreatedAt=null;
    const activeKey=aiConversationStorageKey();
    if(activeKey)localStorage.removeItem(activeKey);
    aiMessages=[defaultAIChatMessage()];
    aiInput="";
    aiError="";
    aiChatHistoryOpen=false;
    saveAIChatHistory();
    render();
  }

  async function loadAIChatHistory(force = false) {
    const key = aiChatStorageKey();
    if (!key || !session?.user?.id) return;
    if (!force && key === aiChatLoadedStorageKey) return;
    aiChatLoadedStorageKey = key;
    aiSavedChats=[];
    aiChatHistoryOpen=false;
    aiChatHistoryError="";
    const activeKey=aiConversationStorageKey();
    aiCurrentConversationId=activeKey?localStorage.getItem(activeKey):null;
    aiCurrentConversationCreatedAt=null;
    const trip = activeTrip();
    const scopeKey = trip?.id ? "trip:" + trip.id : "general";
    let localSnapshot = null;
    let localMessages = [];
    try {
      localSnapshot = JSON.parse(localStorage.getItem(key) || "null");
      if(!aiCurrentConversationId&&localSnapshot?.conversationId)aiCurrentConversationId=String(localSnapshot.conversationId);
      localMessages = restoreAIChatMessages(Array.isArray(localSnapshot) ? localSnapshot : localSnapshot?.messages);
      if (localMessages.length) aiMessages = localMessages;
    } catch {
      localSnapshot = null;
      localMessages = [];
    }

    let cloudLoaded = false;
    try {
      const {data,error:cloudError} = await supabase.from("ai_chat_history")
        .select("messages,updated_at")
        .eq("user_id",session.user.id)
        .eq("scope_key",scopeKey)
        .maybeSingle();
      if (cloudError) throw cloudError;
      if (aiChatStorageKey() !== key) return;
      const cloudMessages = restoreAIChatMessages(data?.messages);
      const localTime = Date.parse(String(localSnapshot?.savedAt || ""));
      const cloudTime = Date.parse(String(data?.updated_at || ""));
      const cloudIsNewer = cloudMessages.length && (!localMessages.length || (Number.isFinite(cloudTime) && (!Number.isFinite(localTime) || cloudTime > localTime)));
      if (cloudIsNewer) {
        aiMessages = cloudMessages;
        localSnapshot = {version:1,savedAt:data.updated_at,messages:data.messages,conversationId:aiCurrentConversationId,newChat:localSnapshot?.newChat===true&&!aiCurrentConversationId};
        localStorage.setItem(key,JSON.stringify(localSnapshot));
        aiChatLoadedStorageKey = key;
        cloudLoaded = true;
      } else if (localMessages.length) {
        saveAIChatHistory();
        cloudLoaded = true;
      } else if (cloudMessages.length) {
        aiMessages = cloudMessages;
        localSnapshot = {version:1,savedAt:data.updated_at,messages:data.messages,conversationId:aiCurrentConversationId,newChat:localSnapshot?.newChat===true&&!aiCurrentConversationId};
        localStorage.setItem(key,JSON.stringify(localSnapshot));
        cloudLoaded = true;
      }
    } catch(e) {
      console.warn("AI cloud history could not be loaded; local history is used",e?.message || "");
    }

    await aiChatCloudSaveQueue.catch(()=>{});
    await loadAISavedChats();
    if(aiChatStorageKey()!==key)return;
    let currentChat=aiSavedChats.find(chat=>String(chat.id)===String(aiCurrentConversationId||""));
    if(!currentChat&&aiSavedChats.length&&localSnapshot?.newChat!==true) {
      const newest=aiSavedChats[0];
      const localTime=Date.parse(String(localSnapshot?.savedAt||""));
      const newestTime=Date.parse(String(newest.updated_at||""));
      if(!localMessages.some(message=>message.role==="user") || (Number.isFinite(newestTime)&&(!Number.isFinite(localTime)||newestTime>=localTime)))currentChat=newest;
    }
    if(currentChat) {
      aiCurrentConversationId=currentChat.id;
      aiCurrentConversationCreatedAt=currentChat.created_at||currentChat.updated_at||new Date().toISOString();
      const activeConversationKey=aiConversationStorageKey();
      if(activeConversationKey)localStorage.setItem(activeConversationKey,aiCurrentConversationId);
      const freshestSnapshot = (() => { try { return JSON.parse(localStorage.getItem(key)||"null"); } catch { return null; } })();
      const freshestLocalMessages = restoreAIChatMessages(freshestSnapshot?.messages);
      const localTime = Date.parse(String(freshestSnapshot?.savedAt||""));
      const savedTime = Date.parse(String(currentChat.updated_at||""));
      const localIsNewer = String(freshestSnapshot?.conversationId||"")===String(currentChat.id) &&
        freshestLocalMessages.some(message=>message.role==="user") &&
        Number.isFinite(localTime) && (!Number.isFinite(savedTime)||localTime>savedTime);
      if(localIsNewer) {
        aiMessages=freshestLocalMessages;
        saveAIChatHistory();
      } else {
        aiMessages=restoreAIChatMessages(currentChat.messages);
        if(!aiMessages.length)aiMessages=[defaultAIChatMessage()];
        localSnapshot={version:1,savedAt:currentChat.updated_at,conversationId:currentChat.id,messages:currentChat.messages};
        localStorage.setItem(key,JSON.stringify(localSnapshot));
      }
    } else if(aiMessages.some(message=>message.role==="user")) {
      saveAIChatHistory();
    } else {
      aiMessages=[defaultAIChatMessage()];
      saveAIChatHistory();
    }
  }

  function totals() {
    const trip = activeTrip();
    if (!trip) return { total:0, remaining:0 };
    const all = [...trip.expenses,...trip.tolls];
    const total = all.reduce((s,e)=>s+Number(e.amount||0),0);
    return { total, remaining:Number(trip.budget||0)-total };
  }

  function dayItems() {
    const trip = activeTrip();
    return trip ? [...trip.expenses,...trip.tolls].filter(e=>e.date===daySelected) : [];
  }

  function familyDisplayName() {
    const metadataName = session?.user?.user_metadata?.urlaub_assistant_name
      || session?.user?.user_metadata?.urlaub_assistent_name
      || session?.user?.email?.split("@")[0]
      || "Familienmitglied";
    return String(metadataName).trim().slice(0, 64) || "Familienmitglied";
  }

  function generateFamilyInviteCode() {
    const chars = SHARE_CHARS;
    const bytes = new Uint8Array(10);
    if (window.crypto?.getRandomValues) {
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes, value => chars[value % chars.length]).join("");
    }
    return generateShareCode(10).replaceAll("-", "");
  }

  function formatFamilyInviteCode(code) {
    const normalized = String(code || "").replaceAll("-", "").toUpperCase();
    return normalized.length === 10 ? normalized.slice(0, 5) + "-" + normalized.slice(5) : normalized;
  }

  async function loadFamily() {
    if (!session?.user?.id) {
      family = null;
      familyMembers = [];
      familyInvites = [];
      familySharedTripMemberIds = new Map();
      familyRenameOpen = false;
      familyRenameName = "";
      familyLoading = false;
      return;
    }

    familyLoading = true;
    try {
      const membershipResult = await supabase
        .from("family_members")
        .select("id, family_id, user_id, role, display_name, joined_at")
        .eq("user_id", session.user.id)
        .maybeSingle();

      if (membershipResult.error) throw membershipResult.error;
      if (!membershipResult.data) {
        family = null;
        familyMembers = [];
        familyInvites = [];
        familySharedTripMemberIds = new Map();
        familyRenameOpen = false;
        familyRenameName = "";
        familySharedTripIds = new Set();
        familyInviteCode = "";
        familyLoading = false;
        familyError = "";
        return;
      }

      const familyResult = await supabase
        .from("families")
        .select("id, name, owner_user_id, auto_share_new_trips, created_at")
        .eq("id", membershipResult.data.family_id)
        .maybeSingle();
      if (familyResult.error) throw familyResult.error;
      if (!familyResult.data) throw new Error("Family wurde nicht gefunden.");

      const membersResult = await supabase
        .from("family_members")
        .select("id, family_id, user_id, role, display_name, joined_at")
        .eq("family_id", familyResult.data.id)
        .order("joined_at", { ascending: true });
      if (membersResult.error) throw membersResult.error;

      family = familyResult.data;
      if (!familyRenameOpen) familyRenameName = family.name;
      familyMembers = membersResult.data || [];
      familyError = "";
      await refreshFamilySharedTripStatus();
      await loadFamilyInvites();
    } catch (e) {
      console.error("Family laden fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Laden der Family-Daten");
    } finally {
      familyLoading = false;
    }
  }

  async function loadFamilyInvites() {
    if (!family?.id || family.owner_user_id !== session?.user?.id) {
      familyInvites = [];
      return;
    }
    const result = await supabase.rpc("list_family_invites", { p_family_id: family.id });
    if (result.error) throw result.error;
    familyInvites = result.data || [];
  }

  async function createFamily() {
    const name = familyNameInput.trim();
    familyError = "";
    familyMessage = "";
    if (!session?.user?.id) {
      familyError = "Bitte melde dich zuerst an.";
      render();
      return;
    }
    if (!name) {
      familyError = "Gib deiner Family zuerst einen Namen.";
      render();
      return;
    }
    if (name.length > 50) {
      familyError = "Der Familienname darf höchstens 50 Zeichen lang sein.";
      render();
      return;
    }

    familySaving = true;
    render();
    try {
      const result = await supabase
        .from("families")
        .insert({ name, owner_user_id: session.user.id, auto_share_new_trips: false })
        .select("id")
        .single();
      if (result.error) throw result.error;

      familyNameInput = "";
      familyInviteCode = "";
      await loadFamily();
      familyMessage = "Deine Family ist erstellt. Du kannst jetzt Mitglieder einladen.";
    } catch (e) {
      console.error("Family erstellen fehlgeschlagen:", e);
      const message = String(e?.message || "");
      const lowerMessage = message.toLowerCase();
      familyError = message.includes("family_members_user_id_key") || lowerMessage.includes("duplicate key")
        ? "Dieses Konto gehört bereits zu einer Family."
        : e?.code === "42501" || lowerMessage.includes("row-level security")
          ? "Die Datenbank hat das Erstellen aus Sicherheitsgründen abgelehnt. Die Berechtigung wurde korrigiert. Aktualisiere die App und versuche es erneut, falls dieser Fehler bleibt."
          : /fetch|network|failed to fetch|offline|timeout/i.test(message)
            ? "Es konnte keine Verbindung zum Server hergestellt werden. Prüfe WLAN oder mobile Daten und versuche es erneut."
            : friendlyAppError(e, "Erstellen der Family");
    } finally {
      familySaving = false;
      render();
    }
  }

  async function revokeFamilyInvite(inviteId) {
    if (!family?.id || family.owner_user_id !== session?.user?.id || familySaving) return;
    familySaving = true; familyError = ""; familyMessage = ""; render();
    try {
      const invite = familyInvites.find(item => item.id === inviteId);
      const result = await supabase.rpc("revoke_family_invite", { p_invite_id: inviteId });
      if (result.error) throw result.error;
      if (invite && familyInviteCode && formatFamilyInviteCode(familyInviteCode) === formatFamilyInviteCode(invite.code)) familyInviteCode = "";
      await loadFamilyInvites();
      familyMessage = "Der Einladungscode wurde widerrufen.";
    } catch (e) {
      console.error("Einladungscode widerrufen fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Widerrufen des Einladungscodes");
    } finally { familySaving = false; render(); }
  }

  async function removeFamilyMember(memberId) {
    if (!family?.id || family.owner_user_id !== session?.user?.id || familySaving) return;
    familySaving = true; familyError = ""; familyMessage = ""; render();
    try {
      const result = await supabase.rpc("remove_family_member", { p_member_id: memberId });
      if (result.error) throw result.error;
      await loadFamily();
      familyMessage = "Das Familienmitglied wurde entfernt. Frühere Urlaubsfreigaben bleiben bestehen und können separat verwaltet werden.";
    } catch (e) {
      console.error("Family-Mitglied entfernen fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Entfernen des Familienmitglieds");
    } finally { familySaving = false; render(); }
  }

  async function leaveFamily() {
    if (!family?.id || family.owner_user_id === session?.user?.id || familySaving) return;
    familySaving = true; familyError = ""; familyMessage = ""; render();
    try {
      const result = await supabase.rpc("leave_family");
      if (result.error) throw result.error;
      family = null; familyMembers = []; familyInvites = []; familyInviteCode = "";
      familySharedTripIds = new Set(); familySharedTripMemberIds = new Map();
      familyRenameOpen = false; familyRenameName = "";
      familyMessage = "Du hast die Family verlassen. Frühere Urlaubsfreigaben bleiben bestehen.";
    } catch (e) {
      console.error("Family verlassen fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Verlassen der Family");
    } finally { familySaving = false; render(); }
  }

  async function createFamilyInvite() {
    if (!family?.id || family.owner_user_id !== session?.user?.id) {
      familyError = "Nur die Familienadministration kann Einladungen erstellen.";
      render();
      return;
    }
    familyInviteLoading = true;
    familyError = "";
    familyMessage = "";
    render();

    try {
      let createdCode = "";
      for (let attempt = 0; attempt < 8; attempt++) {
        const code = generateFamilyInviteCode();
        const result = await supabase.rpc("create_family_invite", {
          p_family_id: family.id,
          p_code: code
        });
        if (!result.error) {
          createdCode = code;
          break;
        }
        if (!String(result.error.message || "").toLowerCase().includes("duplicate")) {
          throw result.error;
        }
      }
      if (!createdCode) throw new Error("Es konnte kein eindeutiger Einladungscode erstellt werden.");
      familyInviteCode = createdCode;
      await loadFamilyInvites();
      familyMessage = "Einladungscode erstellt. Er ist 7 Tage gültig und kann einmal verwendet werden.";
    } catch (e) {
      console.error("Family-Einladung erstellen fehlgeschlagen:", e);
      familyError = String(e?.message || "").includes("Familienadministration")
        ? "Nur die Familienadministration kann Einladungen erstellen."
        : friendlyAppError(e, "Erstellen des Einladungscodes");
    } finally {
      familyInviteLoading = false;
      render();
    }
  }

  async function joinFamilyByCode() {
    familyError = "";
    familyMessage = "";
    const code = familyJoinCodeInput.trim().toUpperCase();
    if (!code) {
      familyError = "Gib den Einladungscode ein.";
      render();
      return;
    }

    familySaving = true;
    render();
    try {
      const result = await supabase.rpc("join_family_by_code", {
        p_code: code,
        p_display_name: familyDisplayName()
      });
      if (result.error) throw result.error;

      familyJoinCodeInput = "";
      familyInviteCode = "";

    } catch (e) {
      console.error("Family-Beitritt fehlgeschlagen:", e);
      const message = String(e?.message || "");
      familyError = message.includes("gültig") || message.includes("abgelaufen")

        : message.includes("bereits Mitglied")
          ? message
          : friendlyAppError(e, "Beitreten zur Family");

  async function refreshFamilySharedTripStatus() {
    familySharedTripIds = new Set();
    familySharedTripMemberIds = new Map();
    if (!family?.id || !session?.user?.id || !familyMembers.length) return;

    const familyUserIds = [...new Set(familyMembers.map(member => member.user_id).filter(Boolean))];
    const otherFamilyUserIds = familyUserIds.filter(userId => userId !== session.user.id);
    const ownedTripIds = trips.filter(trip => trip.role === "owner").map(trip => trip.id);
    if (!otherFamilyUserIds.length || !ownedTripIds.length) return;

    try {
      const result = await supabase.from("trip_members").select("trip_id, user_id")
        .in("trip_id", ownedTripIds).in("user_id", otherFamilyUserIds);
      if (result.error) throw result.error;

      const membersByTrip = new Map();
      (result.data || []).forEach(row => {
        const ids = membersByTrip.get(row.trip_id) || new Set();
        ids.add(row.user_id); membersByTrip.set(row.trip_id, ids);
      });
      ownedTripIds.forEach(tripId => {
        const included = membersByTrip.get(tripId) || new Set();
        familySharedTripMemberIds.set(tripId, included);
        if (otherFamilyUserIds.every(userId => included.has(userId))) familySharedTripIds.add(tripId);
      });
    } catch (e) {
      console.warn("Family-Urlaubsfreigaben konnten nicht geprüft werden:", e);
    }
  }

  async function shareTripWithFamily(tripId) {
    const trip = trips.find(item => item.id === tripId);
    if (!session?.user?.id || !family?.id) {
      familyError = "Erstelle zuerst eine Family oder tritt einer Family bei.";
      render();
      return;
    }
    if (!trip || trip.role !== "owner") {
      familyError = "Du kannst nur Urlaube teilen, die du selbst erstellt hast.";
      render();
      return;
    }
    if (familySaving) return;

    familySaving = true;
    familyError = "";
    familyMessage = "";
    render();
    try {
      const result = await supabase.rpc("share_trip_with_family", { p_trip_id: tripId });
      if (result.error) throw result.error;
      const addedCount = Number(result.data || 0);
      await refreshFamilySharedTripStatus();
      familyMessage = addedCount > 0
        ? `„${trip.name}“ wurde mit ${addedCount} Familienmitglied${addedCount === 1 ? "" : "ern"} geteilt.`
        : `„${trip.name}“ ist bereits mit allen Familienmitgliedern geteilt.`;
    } catch (e) {
      console.error("Urlaub mit Family teilen fehlgeschlagen:", e);
      const msg = String(e?.message || "");
      familyError = msg.includes("Family") || msg.includes("Familien")
        ? msg
        : friendlyAppError(e, "Teilen des Urlaubs mit der Family");
    } finally {
      familySaving = false;
      render();
    }
  }

  async function unshareTripWithFamilyMember(tripId, userId) {
    const trip = trips.find(item => item.id === tripId && item.role === "owner");
    const member = familyMembers.find(item => item.user_id === userId && item.user_id !== session?.user?.id);
    const sharedIds = familySharedTripMemberIds.get(tripId) || new Set();
    if (!trip || !member || !sharedIds.has(userId) || familySaving) return;

    familySaving = true;
    familyError = "";
    familyMessage = "";
    render();
    try {
      const result = await supabase.from("trip_members").delete().eq("trip_id", tripId).eq("user_id", userId);
      if (result.error) throw result.error;
      await refreshFamilySharedTripStatus();
      familyMessage = "Der Zugriff auf „" + trip.name + "“ wurde für " + (member.display_name || "Familienmitglied") + " entfernt.";
    } catch (e) {
      console.error("Urlaubsfreigabe für Familienmitglied entfernen fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Entfernen der Urlaubsfreigabe");
    } finally {
      familySaving = false;
      render();
    }
  }

  async function saveFamilyName() {
    if (!family?.id || family.owner_user_id !== session?.user?.id || familySaving) return;
    const name = familyRenameName.trim();
    familyError = "";
    familyMessage = "";
    if (!name) {
      familyError = "Gib deiner Family zuerst einen Namen.";
      render();
      return;
    }
    if (name.length > 50) {
      familyError = "Der Familienname darf höchstens 50 Zeichen lang sein.";
      render();
      return;
    }

    familySaving = true;
    render();
    try {
      const result = await supabase
        .from("families")
        .update({ name })
        .eq("id", family.id)
        .eq("owner_user_id", session.user.id)
        .select("id, name, owner_user_id, auto_share_new_trips, created_at")
        .single();
      if (result.error) throw result.error;
      family = result.data;
      familyRenameName = family.name;

  async function deleteFamily() {
    if (!family?.id || family.owner_user_id !== session?.user?.id || familySaving) return;
    const familyId = family.id;
    familySaving = true;
    familyError = "";
    familyMessage = "";
    render();
    try {
      const result = await supabase
        .from("families")
        .delete()
        .eq("id", familyId)
        .eq("owner_user_id", session.user.id)
        .select("id")
        .maybeSingle();
      if (result.error) throw result.error;
      if (!result.data) throw new Error("Die Family wurde nicht gefunden oder du bist nicht die Familienadministration.");

      family = null;
      familyMembers = [];
      familyInvites = [];
      familyInviteCode = "";
      familySharedTripMemberIds = new Map();
      familyRenameOpen = false;
      familyNameInput = "";
      familySharedTripIds = new Set();
      familyMessage = "Die Family wurde gelöscht. Bereits einzeln geteilte Urlaube bleiben weiterhin geteilt.";
      familyError = "";
    } catch (e) {
      console.error("Family löschen fehlgeschlagen:", e);
      familyError = e?.code === "42501"
        ? "Du hast keine Berechtigung, diese Family zu löschen."
        : friendlyAppError(e, "Löschen der Family");
    } finally {
      familySaving = false;
      render();
    }
  }

  async function toggleFamilyAutoShare() {
    if (!family?.id || family.owner_user_id !== session?.user?.id || familySaving) return;
    const nextValue = !family.auto_share_new_trips;
    familySaving = true;
    familyError = "";
    familyMessage = "";
    render();
    try {
      const result = await supabase
        .from("families")
        .update({ auto_share_new_trips: nextValue })
        .eq("id", family.id)
        .eq("owner_user_id", session.user.id)
        .select("id, name, owner_user_id, auto_share_new_trips, created_at")
        .single();
      if (result.error) throw result.error;
      family = result.data;
      familyMessage = nextValue
        ? "Automatisches Teilen ist aktiviert. Nur neu erstellte Urlaube werden automatisch geteilt."
        : "Automatisches Teilen ist ausgeschaltet.";
    } catch (e) {
      console.error("Family-Freigabe speichern fehlgeschlagen:", e);
      familyError = friendlyAppError(e, "Speichern der Family-Einstellung");
    } finally {
      familySaving = false;
      render();
    }
  }

  const OFFLINE_CACHE_PREFIX = "urlaubassistent-offline-trips-v1-";
  const OFFLINE_QUEUE_PREFIX = "urlaubassistent-offline-queue-v1-";

  function localOperationId() {
    if (window.crypto?.randomUUID) return window.crypto.randomUUID();
    return "offline-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }

  function offlineStorageKey(prefix) {
    return session?.user?.id ? prefix + session.user.id : "";
  }

  function readOfflineQueue() {
    const key = offlineStorageKey(OFFLINE_QUEUE_PREFIX);
    if (!key) return [];
    try {
      const value = JSON.parse(localStorage.getItem(key) || "[]");
      const allowedTables = new Set(["trips", "trip_members", "trip_people", "trip_expenses", "trip_tolls", "trip_pack_items", "trip_todos", "trip_share_codes"]);
      const allowedMethods = new Set(["upsert", "update", "delete"]);
      return Array.isArray(value) ? value.filter(item =>
        item && item.userId === session.user.id && allowedTables.has(item.table) && allowedMethods.has(item.method) &&
        (!item.filters || Array.isArray(item.filters))
      ) : [];
    } catch {
      return [];
    }
  }

  function writeOfflineQueue(queue) {
    const key = offlineStorageKey(OFFLINE_QUEUE_PREFIX);
    if (!key) throw new Error("Bitte melde dich an, bevor lokale Änderungen gespeichert werden.");
    localStorage.setItem(key, JSON.stringify(queue));
  }

  function pendingOfflineOperationCount() {
    return readOfflineQueue().length;
  }

  function isOfflineNetworkFailure(err) {
    const message = String(err?.message || err || "").toLowerCase();
    if (!navigator.onLine) return true;
    if (Number(err?.status || err?.statusCode || 0) > 0 || err?.code === "42501") return false;
    return err?.name === "TypeError" ||
      /failed to fetch|networkerror|network request failed|fetch failed|load failed|internet disconnected|connection refused|network is unreachable/.test(message);
  }

  function offlineColumnToProperty(table, column) {
    const maps = {
      trips: { start_date: "startDate", end_date: "endDate", user_id: "userId" },
      trip_people: { user_id: "userId" },
      trip_expenses: { person_id: "personId", expense_date: "date", user_id: "userId" },
      trip_tolls: { person_id: "personId", toll_date: "date", user_id: "userId" },
      trip_pack_items: { user_id: "userId" },
      trip_todos: { user_id: "userId" }
    };
    return maps[table]?.[column] || column;
  }

  function offlineModelRow(table, row) {
    if (table === "trip_people") return { id: row.id, name: row.name };
    if (table === "trip_expenses") return { id: row.id, title: row.title, amount: Number(row.amount || 0), category: row.category || "Sonstiges", personId: row.person_id || null, date: row.expense_date || iso(), note: row.note || "" };
    if (table === "trip_tolls") return { id: row.id, title: row.title, amount: Number(row.amount || 0), category: row.category || "Maut", personId: row.person_id || null, date: row.toll_date || iso(), note: row.note || "" };
    if (table === "trip_pack_items" || table === "trip_todos") return { id: row.id, text: row.text, done: Boolean(row.done) };
    return { ...row };
  }

  function offlineApplyPayloadToModel(table, model, payload) {
    for (const [column, value] of Object.entries(payload || {})) {
      if (column === "trip_id" || column === "id" || column === "user_id" || column === "created_at" || column === "updated_at") continue;
      model[offlineColumnToProperty(table, column)] = value;
    }
    if (Object.prototype.hasOwnProperty.call(payload || {}, "amount")) model.amount = Number(payload.amount || 0);
    if (Object.prototype.hasOwnProperty.call(payload || {}, "done")) model.done = Boolean(payload.done);
    if (Object.prototype.hasOwnProperty.call(payload || {}, "person_id")) model.personId = payload.person_id || null;
    return model;
  }

  function offlineFiltersMatch(table, model, filters, tripId) {
    return (filters || []).every(filter => {
      if (filter.column === "trip_id") return String(tripId || "") === String(filter.value || "");
      const property = offlineColumnToProperty(table, filter.column);
      if (property === "user_id" || property === "userId") return true;
      const left = model?.[property];
      const right = filter.value;
      return left == null && right == null ? true : String(left) === String(right);
    });
  }

  function applyOfflineOperation(op) {
    if (!op || op.userId !== session?.user?.id) return;
    const table = op.table;
    const payload = op.payload || {};
    const filters = op.filters || [];
    const method = op.method;
    const tripFilter = filters.find(filter => filter.column === "trip_id")?.value || payload.trip_id;
    const rowId = payload.id || filters.find(filter => filter.column === "id")?.value;

    if (table === "trips") {
      if (method === "delete") {
        const id = rowId;
        trips = trips.filter(trip => trip.id !== id);
        if (selectedTripId === id) selectedTripId = trips[0]?.id || null;
        return;
      }
      let trip = trips.find(item => item.id === (payload.id || rowId));
      if (!trip && (method === "upsert" || method === "insert")) {
        trip = {
          id: payload.id, name: payload.name || "Neuer Urlaub", destination: payload.destination || "",
          startDate: payload.start_date || iso(), endDate: payload.end_date || iso(),
          budget: Number(payload.budget || 0), status: payload.status || "geplant",
          people: [], expenses: [], tolls: [], packlist: [], todos: [],
          role: "owner", shared: false
        };
        trips.unshift(trip);
      }
      if (trip) {
        offlineApplyPayloadToModel("trips", trip, payload);
        if (payload.name) trip.name = payload.name;
        if (payload.destination !== undefined) trip.destination = payload.destination || "";
        if (payload.start_date) trip.startDate = payload.start_date;
        if (payload.end_date) trip.endDate = payload.end_date;
        if (payload.budget !== undefined) trip.budget = Number(payload.budget || 0);
        trip.role = trip.role || "owner";
      }
      return;
    }

    if (table === "trip_members" || table === "trip_share_codes") return;

    let trip = tripFilter ? trips.find(item => item.id === tripFilter) : null;
    if (!trip && rowId) {
      trip = trips.find(item => {
        const key = table === "trip_people" ? "people" :
          table === "trip_expenses" ? "expenses" :
          table === "trip_tolls" ? "tolls" :
          table === "trip_pack_items" ? "packlist" :
          table === "trip_todos" ? "todos" : "";
        return key && item[key]?.some(row => row.id === rowId);
      });
    }
    if (!trip) return;

    const key = table === "trip_people" ? "people" :
      table === "trip_expenses" ? "expenses" :
      table === "trip_tolls" ? "tolls" :
      table === "trip_pack_items" ? "packlist" :
      table === "trip_todos" ? "todos" : "";
    if (!key) return;
    const rows = Array.isArray(trip[key]) ? trip[key] : (trip[key] = []);

    if (method === "delete") {
      trip[key] = rows.filter(row => !offlineFiltersMatch(table, row, filters, trip.id));
      return;
    }
    if (method === "upsert" || method === "insert") {
      let row = payload.id ? rows.find(item => item.id === payload.id) : null;
      if (!row) {
        row = offlineModelRow(table, payload);
        rows.push(row);
      } else {
        offlineApplyPayloadToModel(table, row, payload);
      }
      return;
    }
    if (method === "update") {
      rows.forEach(row => {
        if (offlineFiltersMatch(table, row, filters, trip.id)) offlineApplyPayloadToModel(table, row, payload);
      });
    }
  }

  function saveOfflineTripsCache() {
    const key = offlineStorageKey(OFFLINE_CACHE_PREFIX);
    if (!key || !session?.user?.id) return false;
    try {
      localStorage.setItem(key, JSON.stringify({
        version: 1, userId: session.user.id, savedAt: new Date().toISOString(),
        selectedTripId, trips
      }));
      offlineCacheLoaded = true;
      offlineCacheUserId = session.user.id;
      return true;
    } catch (e) {
      console.error("Offline-Cache konnte nicht gespeichert werden:", e);
      offlineSyncMessage = "Der Gerätespeicher ist voll. Einige Änderungen können möglicherweise nicht lokal gesichert werden.";
      return false;
    }
  }

  function restoreOfflineTripsCache() {
    const key = offlineStorageKey(OFFLINE_CACHE_PREFIX);
    if (!key || !session?.user?.id) return false;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || "null");
      if (!saved || saved.version !== 1 || saved.userId !== session.user.id || !Array.isArray(saved.trips)) return false;
      trips = saved.trips;
      selectedTripId = saved.selectedTripId || localStorage.getItem(K.trip) || trips[0]?.id || null;
      if (selectedTripId && !trips.some(trip => trip.id === selectedTripId)) selectedTripId = trips[0]?.id || null;
      if (!daySelected && trips[0]) daySelected = trips[0].startDate;
      offlineCacheLoaded = true;
      offlineCacheUserId = session.user.id;
      readOfflineQueue().forEach(applyOfflineOperation);
      saveOfflineTripsCache();
      return true;
    } catch (e) {
      console.warn("Offline-Cache konnte nicht gelesen werden:", e);
      return false;
    }
  }

  async function executeOfflineOperation(op) {
    const allowedTables = new Set(["trips", "trip_members", "trip_people", "trip_expenses", "trip_tolls", "trip_pack_items", "trip_todos", "trip_share_codes"]);
    if (!session?.user?.id || op.userId !== session.user.id) throw new Error("Die gespeicherten Änderungen gehören nicht zu diesem Konto.");
    if (!allowedTables.has(op.table)) throw new Error("Diese lokale Änderung ist nicht für die Synchronisierung zugelassen.");
    let query = supabase.from(op.table);
    if (op.method === "upsert") {
      const options = { onConflict: op.onConflict || (op.table === "trip_members" ? "trip_id,user_id" : "id") };
      if (op.ignoreDuplicates) options.ignoreDuplicates = true;
      query = query.upsert(op.payload, options);
    } else if (op.method === "update") {
      query = query.update(op.payload);
    } else if (op.method === "delete") {
      query = query.delete();
    } else {
      throw new Error("Unbekannte lokale Änderung.");
    }
    (op.filters || []).forEach(filter => {
      query = filter.value === null ? query.is(filter.column, null) : query.eq(filter.column, filter.value);
    });
    const result = await query;
    if (result.error) throw result.error;
  }

  async function queueOfflineOperations(operations) {
    const queue = readOfflineQueue();
    for (const op of operations) {
      if (!queue.some(existing => existing.queueId === op.queueId)) queue.push(op);
      applyOfflineOperation(op);
    }
    writeOfflineQueue(queue);
    const saved = saveOfflineTripsCache();
    if (!saved) throw new Error("Die Änderung wurde vorbereitet, aber der lokale Gerätespeicher konnte nicht vollständig gesichert werden. Bitte schaffe Speicherplatz und versuche es erneut.");
    offlineSyncMessage = queue.length + (queue.length === 1 ? " Änderung lokal gespeichert. Synchronisierung folgt bei Verbindung." : " Änderungen lokal gespeichert. Synchronisierung folgt bei Verbindung.");
    render();
  }

  async function persistLocalFirstOperations(operations) {
    if (!session?.user?.id) throw new Error("Bitte melde dich an, bevor du Änderungen speicherst.");
    const prepared = operations.map(operation => ({
      ...operation,
      queueId: operation.queueId || localOperationId(),
      userId: session.user.id,
      filters: operation.filters || []
    }));

    if (!navigator.onLine) {
      await queueOfflineOperations(prepared);
      return { queued: true };
    }

    if (pendingOfflineOperationCount() && !offlineSyncInProgress) {
      const earlierChangesSynced = await syncOfflineChanges({ renderAfter: false });
      if (!earlierChangesSynced) {
        await queueOfflineOperations(prepared);
        return { queued: true };
      }
    }

    try {
      for (const op of prepared) await executeOfflineOperation(op);
      prepared.forEach(applyOfflineOperation);
      saveOfflineTripsCache();
      if (pendingOfflineOperationCount() === 0) offlineSyncMessage = "";
      return { queued: false };
    } catch (e) {
      if (isOfflineNetworkFailure(e)) {
        await queueOfflineOperations(prepared);
        return { queued: true, error: e };
      }
      throw e;
    }
  }

  async function syncOfflineChanges(options = {}) {
    const renderAfter = options.renderAfter !== false;
    if (!session?.user?.id || !navigator.onLine || offlineSyncInProgress) return false;
    if (!pendingOfflineOperationCount()) {
      offlineSyncMessage = "";
      return true;
    }
    offlineSyncInProgress = true;
    offline = false;
    offlineSyncMessage = "Änderungen werden mit deinem Konto synchronisiert …";
    if (renderAfter) render();
    try {
      while (true) {
        const queue = readOfflineQueue();
        const op = queue[0];
        if (!op) break;
        try {
          await executeOfflineOperation(op);
        } catch (e) {
          console.error("Offline-Synchronisierung fehlgeschlagen:", e);
          if (isOfflineNetworkFailure(e)) offline = true;
          const remaining = readOfflineQueue().length;
          offlineSyncMessage = friendlyAppError(e, "Synchronisieren") + (remaining ? " Noch " + remaining + (remaining === 1 ? " Änderung wartet." : " Änderungen warten.") : "");
          break;
        }
        writeOfflineQueue(readOfflineQueue().filter(item => item.queueId !== op.queueId));
      }
      const remaining = pendingOfflineOperationCount();
      if (!remaining) {
        offline = false;
        offlineSyncMessage = "";
        saveOfflineTripsCache();
      }
      return remaining === 0;
    } catch (e) {
      console.error("Lokale Änderungen konnten nicht synchronisiert werden:", e);
      offlineSyncMessage = friendlyAppError(e, "Synchronisieren");
      return false;
    } finally {
      offlineSyncInProgress = false;
      if (renderAfter) render();
    }
  }

  function offlineStatusHTML() {
    const pending = pendingOfflineOperationCount();
    const offlineNow = offline || !navigator.onLine;
    if (!offlineNow && !pending && !offlineSyncMessage) return "";
    const title = offlineSyncInProgress ? "Synchronisierung läuft" : offlineNow ? "Offline-Modus" : pending ? "Änderungen warten auf Synchronisierung" : "Synchronisierung";
    const message = offlineNow
      ? "Deine gespeicherten Reisen bleiben verfügbar. Neue Änderungen werden zuerst auf diesem Gerät gespeichert."
      : pending
        ? "Die Änderungen bleiben auf diesem Gerät erhalten und werden erneut übertragen, sobald die Verbindung funktioniert."
        : offlineSyncMessage;
    return '<div class="mb-4 flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-3.5 shadow-sm sm:flex-row sm:items-center">' +
      '<span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-white">' + icon(offlineNow ? "wifi-off" : "cloud-upload", "h-5 w-5") + '</span>' +
      '<div class="min-w-0 flex-1"><div class="text-sm font-semibold text-slate-900">' + esc(title) + '</div><p class="mt-1 text-xs leading-5 text-slate-500">' + esc(message) + '</p>' +
      (pending ? '<div class="mt-1 text-xs font-semibold text-slate-700">' + pending + (pending === 1 ? ' ausstehende Änderung' : ' ausstehende Änderungen') + '</div>' : '') +
      '</div>' +
      (navigator.onLine && pending && !offlineSyncInProgress ? '<button type="button" data-action="sync-offline-now" class="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-slate-900 px-3 py-2.5 text-xs font-semibold text-white transition hover:bg-slate-800">' + icon("refresh-cw", "h-4 w-4") + ' Jetzt synchronisieren</button>' : '') +
      '</div>';
  }

  async function loadTrips() {
    if (!session) return;
    error = "";
    if (!navigator.onLine) {
      offline = true;
      if (!restoreOfflineTripsCache()) {
        error = "Keine Internetverbindung und noch keine lokal gespeicherten Urlaube auf diesem Gerät. Öffne die App einmal mit Internet, damit deine Reisen gespeichert werden können.";
      }
      render();
      return;
    }
    try {
      if (pendingOfflineOperationCount() && !offlineSyncInProgress) await syncOfflineChanges({ renderAfter: false });
      const membershipsRes = await supabase.from("trip_members").select("trip_id, role").eq("user_id", session.user.id);
      if (membershipsRes.error) throw membershipsRes.error;
      const membershipMap = new Map();
      (membershipsRes.data || []).forEach(r => membershipMap.set(r.trip_id, r.role));

      const tripsRes = await supabase.from("trips").select("*").order("created_at", { ascending:false });
      if (tripsRes.error) throw tripsRes.error;

      const [peopleRes, expensesRes, tollsRes, packRes, todoRes] = await Promise.all([
        supabase.from("trip_people").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_expenses").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_tolls").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_pack_items").select("*").order("created_at", {ascending:true}),
        supabase.from("trip_todos").select("*").order("created_at", {ascending:true})
      ]);
      for (const r of [peopleRes,expensesRes,tollsRes,packRes,todoRes]) if (r.error) throw r.error;

      const ownTrips = (tripsRes.data || []).filter(t => t.user_id === session.user.id);
      if (ownTrips.length) {
        const memberships = ownTrips.map(t => ({ trip_id:t.id, user_id:session.user.id, role:"owner" }));
        const up = await supabase.from("trip_members").upsert(memberships,{onConflict:"trip_id,user_id",ignoreDuplicates:true});
        if (up.error) throw up.error;
        ownTrips.forEach(t => membershipMap.set(t.id,"owner"));
      }

      const group = (rows,key,build) => {
        const map = new Map();
        (rows||[]).forEach(r=>{ const arr=map.get(r[key])||[]; arr.push(build(r)); map.set(r[key],arr); });
        return map;
      };

      const peopleByTrip = group(peopleRes.data,"trip_id",r=>({id:r.id,name:r.name}));
      const expensesByTrip = group(expensesRes.data,"trip_id",r=>({id:r.id,title:r.title,amount:Number(r.amount||0),category:r.category||"Sonstiges",personId:r.person_id||null,date:r.expense_date||iso(),note:r.note||""}));
      const tollsByTrip = group(tollsRes.data,"trip_id",r=>({id:r.id,title:r.title,amount:Number(r.amount||0),category:r.category||"Maut",personId:r.person_id||null,date:r.toll_date||iso(),note:r.note||""}));
      const packByTrip = group(packRes.data,"trip_id",r=>({id:r.id,text:r.text,done:Boolean(r.done)}));
      const todoByTrip = group(todoRes.data,"trip_id",r=>({id:r.id,text:r.text,done:Boolean(r.done)}));

      trips = (tripsRes.data || []).map(r => {
        const role = r.user_id === session.user.id ? "owner" : (membershipMap.get(r.id) || "viewer");
        return { id:r.id,name:r.name,destination:r.destination||"",startDate:r.start_date||iso(),endDate:r.end_date||iso(),budget:Number(r.budget||0),status:r.status||"geplant",people:peopleByTrip.get(r.id)||[],expenses:expensesByTrip.get(r.id)||[],tolls:tollsByTrip.get(r.id)||[],packlist:packByTrip.get(r.id)||[],todos:todoByTrip.get(r.id)||[],role,shared:r.user_id!==session.user.id || role!=="owner" };
      });

      readOfflineQueue().forEach(applyOfflineOperation);
      offline = false;
      offlineCacheLoaded = true;
      saveOfflineTripsCache();

      if (!selectedTripId && trips[0]) selectedTripId = trips[0].id;
      if (selectedTripId && !trips.some(t=>t.id===selectedTripId)) selectedTripId = trips[0]?.id || null;
      if (!daySelected && trips[0]) daySelected = trips[0].startDate;
      await loadAIChatHistory();
      await loadFamily();
    } catch (e) {
      console.error("Urlaubsdaten laden fehlgeschlagen:", e);
      if (isOfflineNetworkFailure(e)) offline = true;
      if (restoreOfflineTripsCache()) {
        error = "";
        if (pendingOfflineOperationCount()) offlineSyncMessage = "Deine lokalen Änderungen warten auf die Verbindung.";
      } else {
        error = friendlyAppError(e, "Laden der Urlaubsdaten");
      }
    } finally {
      render();
      if (navigator.onLine && !offline) setupRealtime();
    }
  }

  function setupRealtime() {
    if (!activeTrip()) return;
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    const id = activeTrip().id;
    realtimeChannel = supabase.channel("trip-" + id)
      .on("postgres_changes", {event:"*",schema:"public",table:"trips",filter:`id=eq.${id}`}, (payload) => { handleRealtimeActivity("trips",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_members",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_members",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_people",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_people",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_expenses",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_expenses",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_tolls",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_tolls",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_pack_items",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_pack_items",payload); loadTrips(); })
      .on("postgres_changes", {event:"*",schema:"public",table:"trip_todos",filter:`trip_id=eq.${id}`}, (payload) => { handleRealtimeActivity("trip_todos",payload); loadTrips(); })
      .on("broadcast", {event:"activity"}, ({payload}) => {
        if (!payload || payload.tripId !== id || payload.actorId === session?.user?.id) return;
        addActivity(id, payload.text || "hat einen neuen Eintrag hinzugefügt", payload.icon || "activity", payload.actor || "Teilnehmer");
        render();
      })
      .subscribe();
  }

  async function createTrip() {
    if (!newTrip.name.trim()) return;
    if (!session?.user?.id) { error = "Bitte melde dich an."; render(); return; }
    const shouldAutoShare = Boolean(family?.auto_share_new_trips);
    const tripId = localOperationId();
    const personId = localOperationId();
    const name = newTrip.name.trim();
    const tripPayload = {
      id: tripId, user_id: session.user.id, name,
      destination: newTrip.destination.trim(),
      start_date: newTrip.startDate || iso(),
      end_date: newTrip.endDate || iso(),
      budget: Number(newTrip.budget || 0), status: "geplant"
    };
    const operations = [
      { table: "trips", method: "upsert", payload: tripPayload, onConflict: "id" },
      { table: "trip_members", method: "upsert", payload: { trip_id: tripId, user_id: session.user.id, role: "owner" }, onConflict: "trip_id,user_id", ignoreDuplicates: true },
      { table: "trip_people", method: "upsert", payload: { id: personId, user_id: session.user.id, trip_id: tripId, name: "Ich" }, onConflict: "id" }
    ];
    try {
      const saved = await persistLocalFirstOperations(operations);
      newTrip = { name: "", destination: "", startDate: "", endDate: "", budget: "" };
      selectedTripId = tripId;
      localStorage.setItem(K.trip, selectedTripId);
      daySelected = iso();
      addActivity(tripId, "hat den Urlaub „" + name + "“ erstellt", "map");
      let autoShareMessage = "";
      let autoShareError = "";
      if (shouldAutoShare && !saved.queued) {
        try {
          const shareResult = await supabase.rpc("share_trip_with_family", { p_trip_id: tripId });
          if (shareResult.error) throw shareResult.error;
          const addedCount = Number(shareResult.data || 0);
          autoShareMessage = addedCount > 0
            ? "Der neue Urlaub „" + name + "“ wurde mit " + addedCount + " Familienmitglied" + (addedCount === 1 ? "" : "ern") + " geteilt."
            : (familyMembers.filter(member => member.user_id !== session.user.id).length
                ? "Der Urlaub „" + name + "“ ist bereits mit allen Familienmitgliedern geteilt."
                : "Der Urlaub wurde erstellt. Sobald weitere Familienmitglieder beitreten, können sie diesen Urlaub ebenfalls erhalten.");
        } catch (shareError) {
          console.error("Automatisches Family-Teilen fehlgeschlagen:", shareError);
          autoShareError = "Der Urlaub wurde erstellt, aber nicht automatisch mit der Family geteilt. Du kannst ihn unten unter „Bestehende Urlaube teilen“ freigeben.";
        }
      } else if (shouldAutoShare && saved.queued) {
        familyMessage = "Der Urlaub ist lokal gespeichert. Automatisches Family-Teilen braucht Internet; teile ihn nach der Synchronisierung im Family-Bereich.";
        familyError = "";
      }
      if (!saved.queued) broadcastActivity(tripId, "hat den Urlaub „" + name + "“ erstellt", "map");
      await loadTrips();
      if (autoShareError) { familyError = autoShareError; familyMessage = ""; }
      else if (autoShareMessage) { familyMessage = autoShareMessage; familyError = ""; }
      if (autoShareError || autoShareMessage || (shouldAutoShare && saved.queued)) render();
    } catch (e) {
      console.error("Urlaub erstellen fehlgeschlagen:", e);
      error = friendlyAppError(e, "Erstellen des Urlaubs");
      render();
    }
  }

  async function deleteTrip(id) {
    try {
      const trip = trips.find(item => item.id === id);

  async function createShareCode(tripId){
    const trip=trips.find(t=>t.id===tripId);if(!trip||trip.role!=="owner")return;
    shareLoading=true;shareCode="";render();
    try{
      const existing=await supabase.from("trip_share_codes").select("code").eq("trip_id",tripId).eq("active",true).maybeSingle();
      if(existing.error)throw existing.error;
      if(existing.data?.code){shareCode=existing.data.code;return;}
      let done=false;
      for(let i=0;i<10;i++){
        const code=generateShareCode();
        const r=await supabase.from("trip_share_codes").insert({trip_id:tripId,code,active:true});
        if(!r.error){shareCode=code;done=true;break;}
      }
      if(!done)throw new Error("Es konnte kein eindeutiger Sharing-Code erstellt werden.");

  async function deleteAccount(){
    deleteMessage = "";
    const expectedUserId = session?.user?.id || "";
    const expectedEmail = String(session?.user?.email || "").trim().toLowerCase();
    const enteredEmail = String(deleteEmail || "").trim().toLowerCase();

    if (!expectedUserId || !expectedEmail) {
      deleteMessage = "Bitte melde dich zuerst erneut an.";
      render();
      return;
    }
    if (!enteredEmail) {
      deleteMessage = "Bitte gib deine E-Mail-Adresse ein.";
      render();
      return;
    }
    if (enteredEmail !== expectedEmail) {
      deleteMessage = "Gib bitte die E-Mail-Adresse des aktuell angemeldeten Kontos ein.";
      render();
      return;
    }
    if (!deletePassword.trim()) {
      deleteMessage = "Bitte gib dein Passwort zur Bestätigung ein.";
      render();
      return;
    }

    deleteLoading = true;
    render();
    try {
      const login = await supabase.auth.signInWithPassword({
        email: deleteEmail.trim(),
        password: deletePassword
      });
      if (login.error) throw login.error;
      if (login.data.user?.id !== expectedUserId) {
        throw new Error("Das bestätigte Konto stimmt nicht mit dem aktuell angemeldeten Konto überein. Bitte melde dich erneut an.");
      }

      const result = await supabase.functions.invoke("delete-account", {
        body: { email: deleteEmail.trim() }
      });
      if (result.error) {
        let serverMessage = "";
        try {
          const response = result.error.context;
          if (response instanceof Response) {
            const payload = await response.clone().json();
            serverMessage = String(payload?.error || payload?.message || "");
          }
        } catch {}
        throw serverMessage ? new Error(serverMessage) : result.error;
      }
      if (result.data?.success !== true) {
        throw new Error("Der Server hat die Kontolöschung nicht bestätigt. Bitte prüfe den Status, bevor du es erneut versuchst.");
      }

      const deletedTripIds = [...new Set(trips.map(trip => trip?.id).filter(Boolean))];
      const userStoragePrefixes = [
        K.aiChatPrefix + expectedUserId + "-",
        "urlaubassistent-ai-active-conversation-" + expectedUserId + "-"
      ];
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key && userStoragePrefixes.some(prefix => key.startsWith(prefix))) localStorage.removeItem(key);
      }
      for (const tripId of deletedTripIds) {
        localStorage.removeItem(K.activityPrefix + tripId);
        localStorage.removeItem(K.checklistPrefix + tripId);
        localStorage.removeItem(K.customExpenseCategoriesPrefix + tripId);
        localStorage.removeItem("urlaubassistent-person-meta-" + tripId);
        const reminderPrefix = K.reminderSentPrefix + tripId;
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && key.startsWith(reminderPrefix)) localStorage.removeItem(key);
        }
      }
      localStorage.removeItem(K.trip);
      await supabase.auth.signOut({ scope: "local" }).catch(() => {});
      session = null;
      trips = [];
      selectedTripId = null;
      family = null;
      familyMembers = [];
      aiMessages = [];
      aiSavedChats = [];
      showDeleteAccount = false;
      authMode = "signin";
      authEmail = deleteEmail.trim();
      authPassword = "";
      authMessage = "Dein Konto und die zugehörigen Daten wurden dauerhaft gelöscht.";
      authResetMessage = "";
      deleteEmail = "";
      deletePassword = "";
    } catch (e) {
      console.error("Kontolöschung fehlgeschlagen:", e);
      deleteMessage = friendlyAppError(e, "Löschen des Kontos");
    } finally {
      deleteLoading = false;
      render();
    }
  }

      if(!privacyAccepted)throw new Error("Bitte die Datenschutz-Checkbox aktivieren.");
      if(authMode==="signup"&&!ageConfirmed)throw new Error("Bitte bestätigen, dass du 18 Jahre oder älter bist.");
      if(!authEmail.trim()||!authPassword)throw new Error("Bitte gib E-Mail-Adresse und Passwort ein.");
      if(authMode==="signin"&&authPassword.length<6)throw new Error("Bitte gib dein Passwort vollständig ein.");
      if(authMode==="signup"){
        const passwordProblem = newPasswordValidationError(authPassword);
        if(passwordProblem)throw new Error("Passwort zu schwach: " + passwordProblem);
      }
      const result=authMode==="signup"?await supabase.auth.signUp({email:authEmail.trim(),password:authPassword,options:{emailRedirectTo:window.location.origin+window.location.pathname}}):await supabase.auth.signInWithPassword({email:authEmail.trim(),password:authPassword});
      if(result.error)throw result.error;
      if(result.data.session){session=result.data.session;acceptedCookies=true;await loadTrips();}else if(authMode==="signup"){authMessage="Konto erstellt. Bitte ggf. E-Mail bestätigen.";}
    }catch(e){
      const msg=e?.message||"Anmeldung fehlgeschlagen.";
      if(/invalid login credentials/i.test(msg)){
        authMessage="E-Mail oder Passwort stimmen nicht. Falls du dich gerade erst registriert hast, bestätige zuerst die E-Mail-Adresse oder nutze „Passwort vergessen?“.";
      }else if(/email not confirmed/i.test(msg)){
        authMessage="Deine E-Mail-Adresse wurde noch nicht bestätigt. Öffne zuerst die Bestätigungs-Mail.";

  async function saveCustomExpenseCategory() {
    const trip = activeTrip();
    if (!trip || !customCategoryDialog) return;
    if (trip.role === "viewer") return;
    const oldName = normalizeExpenseCategory(customCategoryDialog.category || "");
    const input = document.getElementById("edit-custom-category");
    const newName = normalizeExpenseCategory(String(input?.value || "").trim());
    if (!newName) {
      customCategoryDialog.message = "! Bitte einen Namen eingeben.";
      render();
      setTimeout(() => document.getElementById("edit-custom-category")?.focus(), 40);
      return;
    }
    if (newName.length > 40) {
      customCategoryDialog.message = "! Der Kategoriename ist zu lang.";
      render();
      return;
    }
    if (EXPENSE_BASE_CATEGORIES.some(c => c.value.toLocaleLowerCase("de-DE") === newName.toLocaleLowerCase("de-DE"))) {
      customCategoryDialog.message = "! Dieser Name ist bereits eine normale Kategorie.";
      render();
      return;
    }
    const existing = customExpenseCategories(trip);
    const duplicate = existing.some(c => c !== oldName && c.toLocaleLowerCase("de-DE") === newName.toLocaleLowerCase("de-DE"));
    if (duplicate) {
      customCategoryDialog.message = "! Diese eigene Kategorie gibt es bereits.";
      render();
      return;
    }
    try {
      if (oldName !== newName) {
        await persistLocalFirstOperations([{
          table: "trip_expenses", method: "update", payload: { category: newName },
          filters: [{ column: "trip_id", value: trip.id }, { column: "category", value: oldName }]
        }]);
      }
      saveCustomExpenseCategories(trip.id, existing.map(c => c === oldName ? newName : c));
      if (expenseForm.category === oldName) expenseForm.category = newName;
      expenseCategorySearch = "";
      expenseCategoryMoreOpen = false;
      
      customCategoryDialog = null;
      await loadTrips();
    } catch (e) {
      customCategoryDialog.message = `! ${e?.message || "Kategorie konnte nicht geändert werden."}`;
      render();
    }
  }

    const query = String(expenseCategorySearch || "").trim().toLocaleLowerCase("de-DE");
    const options = [...document.querySelectorAll('[data-search-option]')];
    const moreButton = document.querySelector('[data-action="toggle-expense-categories"]');
    const noResults = document.getElementById("expense-category-search-empty");

    let matches = 0;
    options.forEach((option, index) => {
      const haystack = String(option.dataset.search || "").toLocaleLowerCase("de-DE");
      const matchesQuery = !query || haystack.includes(query);
      const hiddenByLimit = !query && !expenseCategoryMoreOpen && index >= 9;
      const shouldShow = matchesQuery && !hiddenByLimit;
      option.style.display = shouldShow ? "" : "none";
      if(matchesQuery) matches++;
    });

    if(noResults) noResults.style.display = query && matches === 0 ? "block" : "none";
    if(moreButton){
      moreButton.style.display = query ? "none" : "flex";
    }
  }

      }
      if(action==="delete-entry"){await deleteEntry(el.dataset.kind,el.dataset.id);return;}
      if(action==="add-pack"){await addList("pack");return;}
      if(action==="add-todo"){await addList("todo");return;}
      if(action==="toggle-list"){await toggleList(el.dataset.kind,el.dataset.id);return;}
      if(action==="delete-list"){await deleteList(el.dataset.kind,el.dataset.id);return;}
      if(action==="toggle-check"){
        const trip=activeTrip(); if(!trip)return;
        const checks=getChecklist(trip.id); const key=el.dataset.check;
        if(!Object.prototype.hasOwnProperty.call(checks,key))return;
        checks[key]=!checks[key]; saveChecklist(trip.id,checks);

        render(); return;
      }
      if(action==="toggle-reminders"){
        remindersEnabled=!remindersEnabled; localStorage.setItem(K.reminders,String(remindersEnabled));
        reminderMessage=remindersEnabled?"Erinnerungen sind eingeschaltet.":"Erinnerungen sind ausgeschaltet."; render(); return;
      }
      if(action==="toggle-passport-reminder"){
        passportReminderEnabled=!passportReminderEnabled; localStorage.setItem(K.passportReminder,String(passportReminderEnabled)); render(); return;
      }
      if(action==="toggle-departure-reminder"){
        departureReminderEnabled=!departureReminderEnabled; localStorage.setItem(K.departureReminder,String(departureReminderEnabled)); render(); return;
      }
      if(action==="enable-notifications"){requestNotificationPermission();return;}
      if(action==="test-reminder"){
        if(typeof Notification==="undefined"){reminderMessage="Dieser Browser unterstützt keine Benachrichtigungen.";render();return;}
        if(Notification.permission!=="granted"){requestNotificationPermission();return;}
        const check=tripCheckData(activeTrip());
        const openCount=check.total-check.done;
        const sent=sendBrowserNotification("Urlaubassistent",openCount?`Noch ${openCount} Punkte im Reise-Check offen.`:"Der Reise-Check ist vollständig erledigt.");
        reminderMessage=sent?"Testbenachrichtigung wurde gesendet.":"Die Benachrichtigung konnte nicht gesendet werden."; render(); return;
      }
      if(action==="toggle-more"){
        const target=el.dataset.target;
        const map={trips:"tripsExpanded",people:"peopleExpanded",expenses:"expensesExpanded",tolls:"tollsExpanded",day:"dayExpanded",pack:"packExpanded",todo:"todoExpanded",personExpenses:"personExpensesExpanded",owes:"owesExpanded",owedTo:"owedToExpanded",activity:"activityExpanded"};
        const prop=map[target];
        if(prop==="tripsExpanded")tripsExpanded=!tripsExpanded;
        if(prop==="peopleExpanded")peopleExpanded=!peopleExpanded;
        if(prop==="expensesExpanded")expensesExpanded=!expensesExpanded;
        if(prop==="tollsExpanded")tollsExpanded=!tollsExpanded;
        if(prop==="dayExpanded")dayExpanded=!dayExpanded;
        if(prop==="packExpanded")packExpanded=!packExpanded;
        if(prop==="todoExpanded")todoExpanded=!todoExpanded;
        if(prop==="personExpensesExpanded")personExpensesExpanded=!personExpensesExpanded;
        if(prop==="owesExpanded")owesExpanded=!owesExpanded;
        if(prop==="owedToExpanded")owedToExpanded=!owedToExpanded;
        if(prop==="activityExpanded")activityExpanded=!activityExpanded;
        render();return;
      }
      if(action==="cancel-delete"){deleteDialog=null;render();return;}
      if(action==="confirm-delete"){const d=deleteDialog;deleteDialog=null;if(d?.onConfirm)await d.onConfirm();return;}
    } catch(e) {
      error=e.message||"Etwas ist schiefgelaufen.";
      render();
    }
  });

  // Keep these UI state variables accessible without changing the data model.
  Object.defineProperties(window, {
    tripsExpanded:{get:()=>tripsExpanded,set:v=>{tripsExpanded=!!v}},
    peopleExpanded:{get:()=>peopleExpanded,set:v=>{peopleExpanded=!!v}},
    expensesExpanded:{get:()=>expensesExpanded,set:v=>{expensesExpanded=!!v}},
    tollsExpanded:{get:()=>tollsExpanded,set:v=>{tollsExpanded=!!v}},
    dayExpanded:{get:()=>dayExpanded,set:v=>{dayExpanded=!!v}},
    packExpanded:{get:()=>packExpanded,set:v=>{packExpanded=!!v}},
    todoExpanded:{get:()=>todoExpanded,set:v=>{todoExpanded=!!v}},
    personExpensesExpanded:{get:()=>personExpensesExpanded,set:v=>{personExpensesExpanded=!!v}},
    owesExpanded:{get:()=>owesExpanded,set:v=>{owesExpanded=!!v}},
    owedToExpanded:{get:()=>owedToExpanded,set:v=>{owedToExpanded=!!v}}
  });

  window.addEventListener("online", async () => {
    offline = false;
    if (session) {
      await syncOfflineChanges({ renderAfter: false });
      await loadTrips();
    } else { render(); }
  });
  window.addEventListener("offline", () => {
    offline = true;
    if (session) restoreOfflineTripsCache();
    render();
  });


  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPWAInstallPrompt = event;
    render();
  });
  window.addEventListener("appinstalled", () => {
    pwaInstalled = true;
    deferredPWAInstallPrompt = null;
    render();
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js?v=52").catch(() => {});
    }, { once: true });
  }

  const params=new URLSearchParams(location.search);
  recovery=params.get("type")==="recovery";

  const waitForMinimumSplash = () => new Promise(resolve => {
    const remaining = MIN_SPLASH_MS - (Date.now() - splashStartedAt);
    window.setTimeout(resolve, Math.max(0, remaining));
  });

  supabase.auth.getSession().then(async ({data})=>{
    session=data.session||null;
    settingsUsername=session?.user?.user_metadata?.urlaub_assistent_name||"";
    await waitForMinimumSplash();
    checking=false;
    acceptedCookies=true;
    if(session && !recovery){loadTrips();}
    else{render();}
  }).catch(async ()=>{
    await waitForMinimumSplash();
    checking=false;
    render();
  });

  supabase.auth.onAuthStateChange((_event,nextSession)=>{
    session=nextSession;
    if(!session) aiOpen=false;
    settingsUsername=session?.user?.user_metadata?.urlaub_assistent_name||"";
    if(_event==="INITIAL_SESSION") return;
    if(_event==="PASSWORD_RECOVERY") recovery=true;
    if(session && !recovery){acceptedCookies=true;loadTrips();}else{render();}
  });

  render();
})();
</script>
</body>
</html>
