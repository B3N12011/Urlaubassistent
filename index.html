<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urlaubassistent</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Urlaubassistent" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    .modal-backdrop { backdrop-filter: blur(3px); }
    input, select, textarea, button { font: inherit; }
    input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
    body { padding-bottom: 0; }

    nav button { -webkit-tap-highlight-color: transparent; }
    /* Short, lightweight motion for page changes and touch feedback. */
    /* Animate the complete page as well as its individual sections. */
    main#ua-page-content.ua-page-enter {
      animation: ua-page-container-in 460ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > * {
      animation: ua-page-item-in 420ms cubic-bezier(.18,.72,.25,1) both;
      will-change: opacity, transform;
    }
    .ua-page-enter > .space-y-6 > *:nth-child(1) { animation-delay: 0ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(2) { animation-delay: 35ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(3) { animation-delay: 65ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(4) { animation-delay: 95ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(5) { animation-delay: 125ms; }
    .ua-page-enter > .space-y-6 > *:nth-child(n+6) { animation-delay: 145ms; }
    @keyframes ua-page-container-in {
      from { opacity: .35; transform: translate3d(0, 16px, 0) scale(.995); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    @keyframes ua-page-item-in {
      from { opacity: .25; transform: translate3d(0, 14px, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes ua-modal-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ua-modal-panel-in {
      from { opacity: 0; transform: translate3d(0, 10px, 0) scale(.985); }
      to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }
    .ua-modal-enter { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .ua-modal-enter > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    .modal-backdrop { animation: ua-modal-backdrop-in 190ms ease-out both; }
    .modal-backdrop > div { animation: ua-modal-panel-in 240ms cubic-bezier(.2,.75,.25,1) both; }
    nav button {
      transition: color 200ms ease, background-color 220ms ease, box-shadow 220ms ease, transform 220ms cubic-bezier(.2,.75,.25,1);
    }
    nav button:active { transform: scale(.96); }
    nav button span:first-child {
      transition: transform 220ms cubic-bezier(.2,.75,.25,1), background-color 220ms ease, color 220ms ease;
    }
    nav button:active span:first-child { transform: scale(.92); }
    button[data-action] {
      transition-property: color, background-color, border-color, box-shadow, transform, opacity;
      transition-duration: 190ms;
      transition-timing-function: cubic-bezier(.2,.75,.25,1);
      -webkit-tap-highlight-color: transparent;
    }
    button[data-action]:active:not(:disabled) { transform: scale(.975); }
    main#ua-page-content section { transition: box-shadow 220ms ease, border-color 220ms ease; }
    @media (hover: hover) and (pointer: fine) {
      main#ua-page-content section:hover { box-shadow: 0 10px 28px rgba(15, 23, 42, 0.055); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ua-page-enter > .space-y-6 > *, .ua-modal-enter, .ua-modal-enter > div,
      .modal-backdrop, .modal-backdrop > div { animation: none !important; }
      nav button, nav button span:first-child, button[data-action],
      main#ua-page-content section { transition: none !important; }
    }
    .person-dark-input {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.10);
    }
    .person-dark-input::placeholder {
      color: rgba(255, 255, 255, 0.42) !important;
    }
    .person-dark-input:focus {
      border-color: rgba(255, 255, 255, 0.24) !important;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .person-dark-input:disabled {
      opacity: 0.6;
    }
    .debt-choice {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.78);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-choice:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
    }
    .debt-choice.active {
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.96);
      color: #0f172a;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .debt-person-picker {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
    }
    .debt-person-picker:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.14);
    }
    .glass-nav {
      background: rgba(247, 252, 255, 0.86);
      border-top: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 -8px 24px rgba(14, 116, 144, 0.08), 0 1px 0 rgba(255, 255, 255, 0.9) inset;
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
    }

    .ai-thinking-card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(96, 165, 250, 0.24);
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(239,246,255,0.92), rgba(248,250,252,0.98));
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.08), inset 0 1px 0 rgba(255,255,255,0.95);
    }
    .ai-thinking-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -45%;
      width: 42%;
      background: linear-gradient(110deg, transparent, rgba(255,255,255,0.78), transparent);
      transform: skewX(-18deg);
      animation: ai-card-sheen 2.4s ease-in-out infinite;
      pointer-events: none;
    }
    .ai-thinking-text {
      display: inline-block;
      background: linear-gradient(100deg, #64748b 5%, #2563eb 34%, #7dd3fc 48%, #2563eb 62%, #64748b 95%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: ai-text-shimmer 2.1s linear infinite;
    }
    .ai-thinking-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #60a5fa;
      animation: ai-dot-pulse 1s ease-in-out infinite;
    }
    .ai-thinking-dot:nth-child(2) { animation-delay: .16s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: .32s; }
    @keyframes ai-card-sheen {
      0%, 12% { left: -45%; opacity: 0; }
      28% { opacity: .8; }
      66% { left: 115%; opacity: .45; }
      100% { left: 115%; opacity: 0; }
    }
    @keyframes ai-text-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -140% 0; }
    }
    @keyframes ai-dot-pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-3px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ai-thinking-card::before, .ai-thinking-text, .ai-thinking-dot { animation: none !important; }
    }

    .ai-source-list { display: grid; gap: 8px; margin-top: 12px; }
    .ai-source-card {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 11px;
      border: 1px solid rgba(148,163,184,.20); border-radius: 15px;
      background: rgba(248,250,252,.92); text-decoration: none;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .ai-source-card:hover { border-color: rgba(96,165,250,.55); background: #eff6ff; transform: translateY(-1px); }
    .ai-source-favicon { width: 28px; height: 28px; border-radius: 9px; background: white; padding: 4px; object-fit: contain; flex: 0 0 auto; border: 1px solid #e2e8f0; }
    .ai-source-title { font-size: 11px; line-height: 1.35; font-weight: 700; color: #0f172a; }
    .ai-source-domain { margin-top: 3px; font-size: 10px; font-weight: 600; color: #2563eb; }
    .ai-source-snippet { margin-top: 4px; font-size: 10px; line-height: 1.45; color: #64748b; }
    .ai-source-heading { display: flex; align-items: center; gap: 6px; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .ai-recommendation-card {
      margin: .85rem 0; padding: 14px; border: 1px solid rgba(96,165,250,.24);
      border-radius: 18px; background: linear-gradient(145deg, #ffffff, #f8fbff);
      box-shadow: 0 5px 18px rgba(15,23,42,.035), inset 0 1px 0 #fff;
    }
    .ai-recommendation-card h3 { display: flex; align-items: center; gap: .55rem; margin-top: 0 !important; padding-bottom: 8px; border-bottom: 1px solid #eaf0f7; }
    .ai-recommendation-icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9px; background: #eff6ff; color: #2563eb; }
    .ai-recommendation-card h3 strong { flex: 1; }
    .ai-recommendation-card > :last-child { margin-bottom: 0; }
    .ai-web-search-note { margin-top: 10px; padding: 9px 11px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-size: 10px; line-height: 1.5; }
    .ai-web-search-note.is-limited { background: #fff7ed; color: #9a3412; }
    .ai-followups { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .ai-followup-chip { border: 1px solid #dbeafe; background: #f8fbff; color: #1d4ed8; border-radius: 999px; padding: 7px 10px; font-size: 10px; font-weight: 700; line-height: 1.35; text-align: left; transition: background .15s ease, border-color .15s ease; }
    .ai-followup-chip:hover { background: #eff6ff; border-color: #93c5fd; }
    .ai-markdown { color: #334155; overflow-wrap: anywhere; line-height: 1.72; }
    .ai-markdown p { margin: 0 0 .8rem; }
    .ai-markdown p:last-child { margin-bottom: 0; }
    .ai-markdown h3, .ai-markdown h4 { color: #0f172a; font-weight: 800; line-height: 1.35; letter-spacing: -.025em; margin: 1.1rem 0 .55rem; }
    .ai-markdown h3 { font-size: 1.02rem; }
    .ai-markdown h4 { font-size: .94rem; }
    .ai-markdown ul, .ai-markdown ol { display: grid; gap: .55rem; margin: .65rem 0 1rem; padding: 0; list-style: none; }
    .ai-markdown li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: .42rem; align-items: start; }
    .ai-markdown .ai-markdown-bullet { display: block; width: 7px; height: 7px; border-radius: 999px; background: #3b82f6; margin: .62em auto 0; box-shadow: 0 0 0 3px #dbeafe; }
    .ai-markdown .ai-markdown-number { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 7px; background: #eff6ff; color: #1d4ed8; font-size: .68rem; font-weight: 800; margin-top: .1rem; }
    .ai-markdown strong { color: #0f172a; font-weight: 800; }
    .ai-markdown em { color: #475569; }
    .ai-markdown a { color: #2563eb; font-weight: 650; text-decoration: underline; text-decoration-color: #bfdbfe; text-underline-offset: 3px; overflow-wrap: anywhere; }
    .ai-markdown code { padding: .12rem .32rem; border-radius: .4rem; background: #f1f5f9; color: #0f172a; font-size: .88em; }
    .ai-markdown blockquote { margin: .8rem 0; padding: .7rem .85rem; border-left: 3px solid #60a5fa; border-radius: 0 .8rem .8rem 0; background: #eff6ff; color: #334155; }
    .ai-markdown hr { margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0; }
    .ai-chat-disclaimer { padding: 10px 8px 2px; color: #94a3b8; text-align: center; font-size: 10px; line-height: 1.55; }
  
    .ua-status-screen {
      background:
        radial-gradient(ellipse at 50% 42%, rgba(219,234,254,0.50) 0%, rgba(248,250,252,0.88) 42%, #f8fafc 78%),
        #f8fafc;
      isolation: isolate;
    }
    .ua-status-glow {
      position: absolute;
      width: 18rem;
      height: 18rem;
      border-radius: 9999px;
      filter: blur(54px);
      pointer-events: none;
      opacity: 0.52;
    }
    .ua-status-glow-one { top: -8rem; left: -8rem; background: rgba(147,197,253,0.28); }
    .ua-status-glow-two { right: -9rem; bottom: -10rem; background: rgba(191,219,254,0.44); }
    .ua-loading-screen {
      color: #f8fafc;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(30,64,175,.34) 0%, rgba(15,23,42,0) 42%),
        radial-gradient(ellipse at 85% 88%, rgba(8,145,178,.12) 0%, rgba(8,145,178,0) 32%),
        linear-gradient(148deg, #070d1e 0%, #0f172a 48%, #111d3a 100%);
      isolation: isolate;
    }
    .ua-loading-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    .ua-loading-screen .ua-status-glow {
      width: 22rem; height: 22rem; filter: blur(72px); opacity: .8;
      animation: ua-splash-drift 8s ease-in-out infinite alternate;
    }
    .ua-loading-screen .ua-status-glow-one { top: -11rem; left: -10rem; background: rgba(37,99,235,.28); }
    .ua-loading-screen .ua-status-glow-two { right: -12rem; bottom: -12rem; background: rgba(6,182,212,.18); animation-delay: -3s; }
    .ua-splash-content {
      width: 100%; max-width: 26rem; padding: 2rem .5rem;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .ua-splash-logo-shell {
      position: relative; display: flex; width: 136px; height: 136px;
      align-items: center; justify-content: center;
      border: 1px solid rgba(191,219,254,.27); border-radius: 38px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      box-shadow: 0 28px 70px rgba(0,0,0,.28), 0 0 0 8px rgba(147,197,253,.035), inset 0 1px 0 rgba(255,255,255,.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      animation: ua-splash-logo-arrive 700ms cubic-bezier(.2,.75,.25,1) both, ua-splash-logo-breathe 3.2s ease-in-out 700ms infinite;
    }
    .ua-splash-logo-shell::after {
      content: ""; position: absolute; inset: -8px; border: 1px solid rgba(125,211,252,.10);
      border-radius: 45px; pointer-events: none;
    }
    .ua-app-mark {
      display: block; width: 108px; height: 108px; border-radius: 28px;
      object-fit: cover; box-shadow: 0 12px 30px rgba(0,0,0,.24), 0 0 28px rgba(59,130,246,.16);
    }
    .ua-splash-brand { margin-top: 2rem; font-size: 11px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; color: #93c5fd; }
    .ua-splash-title { margin-top: .65rem; color: #fff; font-size: clamp(1.8rem, 7vw, 2.25rem); font-weight: 800; letter-spacing: -.045em; line-height: 1.12; }
    .ua-splash-subtitle { margin-top: .75rem; max-width: 19rem; color: rgba(226,232,240,.76); font-size: .96rem; line-height: 1.6; }
    .ua-splash-loading-row { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 18px; margin-top: 2rem; color: rgba(203,213,225,.78); font-size: .78rem; font-weight: 600; letter-spacing: .015em; }
    .ua-loading-dots { display: flex; align-items: center; justify-content: center; gap: 7px; }
    .ua-loading-dots span {
      display: block; width: 7px; height: 7px; border-radius: 9999px; background: #93c5fd;
      opacity: .38; transform: translateY(0) scale(.8); animation: ua-dot-bounce 850ms ease-in-out infinite;
    }
    .ua-loading-dots span:nth-child(2) { animation-delay: 150ms; }
    .ua-loading-dots span:nth-child(3) { animation-delay: 300ms; }
    .ua-splash-progress { position: relative; overflow: hidden; width: 158px; height: 3px; margin-top: 1rem; border-radius: 999px; background: rgba(148,163,184,.17); }
    .ua-splash-progress span {
      display: block; width: 38%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa, #67e8f9); box-shadow: 0 0 14px rgba(96,165,250,.55);
      animation: ua-splash-progress 1.55s ease-in-out infinite;
    }
    .ua-splash-footer {
      position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 10px;
      color: rgba(148,163,184,.55); font-size: 9px; font-weight: 700; letter-spacing: .2em;
    }
    .ua-splash-footer-dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(96,165,250,.7); }
    .ua-offline-mark { animation: ua-offline-arrive 450ms cubic-bezier(.2,.75,.25,1) both; }
    @keyframes ua-dot-bounce {
      0%, 60%, 100% { transform: translateY(0) scale(.8); opacity: .38; }
      30% { transform: translateY(-6px) scale(1); opacity: 1; }
    }
    @keyframes ua-splash-logo-arrive { from { opacity: 0; transform: translateY(12px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes ua-splash-logo-breathe {
      0%, 100% { box-shadow: 0 28px 70px rgba(0,0,0,.28), 0 0 0 8px rgba(147,197,253,.035), inset 0 1px 0 rgba(255,255,255,.18); }
      50% { box-shadow: 0 30px 76px rgba(0,0,0,.31), 0 0 0 12px rgba(147,197,253,.055), inset 0 1px 0 rgba(255,255,255,.2); }
    }
    @keyframes ua-splash-progress { 0% { transform: translateX(-110%); } 55% { transform: translateX(160%); } 100% { transform: translateX(330%); } }
    @keyframes ua-splash-drift { from { transform: translate3d(-8px, 0, 0) scale(.96); } to { transform: translate3d(15px, 13px, 0) scale(1.05); } }
    @keyframes ua-offline-arrive { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .ua-app-mark, .ua-offline-mark, .ua-loading-dots span, .ua-splash-logo-shell,
      .ua-loading-screen .ua-status-glow, .ua-splash-progress span { animation: none !important; }
    }

    /* Authentication screen: app-matched navy hero and clean mobile-first form. */
    .ua-auth-page {
      background:
        radial-gradient(ellipse at 8% 5%, rgba(219,234,254,.68) 0%, rgba(248,250,252,0) 36%),
        linear-gradient(180deg, #f8fafc 0%, #ffffff 52%, #f1f5f9 100%);
    }
    .ua-auth-hero { isolation: isolate; animation: ua-auth-panel-in 440ms cubic-bezier(.18,.72,.25,1) both; }
    .ua-auth-hero::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .14;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 34px 34px; mask-image: linear-gradient(to bottom right, black, transparent 82%);
    }
    .ua-auth-orbit { position: absolute; border: 1px solid rgba(255,255,255,.10); border-radius: 9999px; pointer-events: none; }
    .ua-auth-card { position: relative; animation: ua-auth-panel-in 480ms cubic-bezier(.18,.72,.25,1) 65ms both; }
    .ua-auth-tab { min-height: 46px; transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
    .ua-auth-tab:active { transform: scale(.985); }
    .ua-auth-input { transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease; }
    .ua-auth-input:focus-within { border-color: #64748b; box-shadow: 0 0 0 4px rgba(15,23,42,.07); background: #fff; }
    .ua-auth-submit { min-height: 54px; transition: transform 180ms cubic-bezier(.2,.75,.25,1), background-color 180ms ease, box-shadow 180ms ease; box-shadow: 0 8px 18px rgba(15,23,42,.12); }
    .ua-auth-submit:hover { box-shadow: 0 12px 24px rgba(15,23,42,.17); transform: translateY(-1px); }
    .ua-auth-submit:active { transform: scale(.985); }
    .ua-auth-check { accent-color: #0f172a; }
    @keyframes ua-auth-panel-in { from { opacity: 0; transform: translate3d(0, 12px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
    @media (prefers-reduced-motion: reduce) {
      .ua-auth-hero, .ua-auth-card { animation: none !important; }
      .ua-auth-tab, .ua-auth-input, .ua-auth-submit { transition: none !important; }
    }
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-50 text-slate-900">

  function friendlyAppError(err, operation = "Speichern") {
    const message = String(err?.message || (typeof err === "string" ? err : "")).trim();
    const lower = message.toLowerCase();
    const code = String(err?.code || "").toUpperCase();
    const status = Number(err?.status || err?.statusCode || 0);

    if (err?.name === "FunctionsHttpError" || /edge function returned a non-2xx status/.test(lower)) {
      return "Der serverseitige Vorgang konnte nicht abgeschlossen werden. Prüfe die Meldung und versuche es erneut.";
    }
    if (/invalid login credentials|invalid_credentials/.test(lower)) return "E-Mail oder Passwort stimmen nicht.";
    if (/email not confirmed/.test(lower)) return "Deine E-Mail-Adresse wurde noch nicht bestätigt.";
    if (code === "42501" || status === 403 || /row-level security|permission denied|not authorized|insufficient privilege/.test(lower)) {
      return "Der Server hat den Zugriff verweigert. Prüfe, ob du für diesen Urlaub die nötigen Rechte hast.";
    }
    if (status === 401 || code === "PGRST301" || /jwt expired|invalid jwt|refresh token.*(expired|not found)|session has expired/.test(lower)) {
      return "Deine Anmeldung ist abgelaufen. Melde dich bitte erneut an und versuche es noch einmal.";
    }
    if (/failed to fetch|networkerror|network request failed|load failed|err_internet_disconnected|fetch failed|the internet connection appears to be offline/.test(lower) || (err?.name === "TypeError" && /fetch|network|load failed/.test(lower))) {
      return "Keine Verbindung zum Server. Prüfe WLAN oder mobile Daten und versuche es erneut.";
    }
    if (err?.name === "AbortError" || /timed out|timeout|statement timeout/.test(lower)) {
      return "Der Server antwortet gerade zu langsam. Deine letzte Änderung ist möglicherweise nicht gespeichert. Lade die Daten neu und prüfe den Stand, bevor du es erneut versuchst.";
    }
    if (code === "P0001" && message) return message;
    if (code === "23505") return "Dieser Eintrag existiert bereits. Prüfe, ob du ihn schon angelegt hast.";
    if (code === "23503") return "Dieser Eintrag ist noch mit anderen Daten verknüpft. Entferne zuerst die Verknüpfung und versuche es erneut.";
    if (code === "23514" || code === "22P02" || code === "22007" || code === "22008") {
      return "Einige Angaben werden vom Server nicht akzeptiert. Prüfe deine Eingaben und versuche es erneut.";
    }
    if (code === "PGRST116" || /no rows|zero rows/.test(lower)) {
      return "Der Eintrag wurde nicht gefunden oder wurde inzwischen geändert. Aktualisiere die Ansicht und versuche es erneut.";
    }
    if (status >= 500 || /^PGRST2/.test(code) || /^5[0-9A-Z]{4}$/.test(code)) {
      return "Der Server hat einen Fehler gemeldet. Es ist unklar, ob die letzte Änderung gespeichert wurde. Aktualisiere die Ansicht, bevor du es erneut versuchst.";
    }
    if (message && !code && !status) return message;
    if (code || status) return "Beim " + operation + " ist ein Serverfehler aufgetreten. Bitte versuche es erneut.";
    return "Beim " + operation + " ist ein Fehler aufgetreten. Bitte versuche es erneut.";
  }

  function daysUntil(dateValue) {
    if (!dateValue) return null;
    const today = new Date();
    today.setHours(12,0,0,0);
    const target = new Date(dateValue + "T12:00:00");
    return Math.ceil((target - today) / 86400000);
  }

  function tripCheckData(trip) {
    const checklist = getChecklist(trip?.id);
    const items = [
      {key:"documents", label:"Ausweis / Reisepass", icon:"id-card"},
      {key:"tickets", label:"Tickets & Buchungen", icon:"ticket"},
      {key:"payment", label:"Karten & Zahlungsmittel", icon:"credit-card"},
      {key:"luggage", label:"Koffer & wichtige Sachen", icon:"luggage"}
    ];
    const done = items.filter(item => checklist[item.key]).length;
    return {checklist, items, done, total:items.length, days:daysUntil(trip?.startDate)};
  }

  function sendBrowserNotification(title, body) {
    try {
      if (typeof Notification === "undefined" || Notification.permission !== "granted") return false;
      new Notification(title, {body});
      return true;
    } catch { return false; }
  }

  function checkReminders() {
    if (!session || !remindersEnabled || typeof Notification === "undefined" || Notification.permission !== "granted") return;
    const trip = activeTrip();
    if (!trip) return;
    const data = tripCheckData(trip);
    const today = iso();
    if (passportReminderEnabled && data.days !== null && [14,7,3,1,0].includes(data.days) && !data.checklist.documents) {
      const key = reminderSentKey(trip.id, "passport", today);
      if (localStorage.getItem(key) !== "1") {
        sendBrowserNotification("Urlaubassistent", data.days === 0 ? "Heute geht es los. Sind Ausweis oder Reisepass schon bereit?" : `Noch ${data.days} ${data.days === 1 ? "Tag" : "Tage"} bis zur Abreise. Denk an Ausweis oder Reisepass.`);
        localStorage.setItem(key, "1");
      }
    }
    if (departureReminderEnabled && data.days === 1 && data.done < data.total) {
      const key = reminderSentKey(trip.id, "departure", today);
      if (localStorage.getItem(key) !== "1") {
        sendBrowserNotification("Abreise-Check", `Noch ${data.total-data.done} wichtige Punkte offen. Ist alles fertig?`);
        localStorage.setItem(key, "1");
      }
    }
  }

        ${day.length > LIST_LIMIT ? moreButtonHTML("day", dayExpanded) : ""}

      <div class="grid gap-4 md:grid-cols-2">

            <button data-action="navigate" data-page="people" class="rounded-2xl bg-slate-50 p-4 text-left ring-1 ring-slate-200 transition hover:bg-slate-100"><div class="mb-2 flex h-10 w-10 items-center justify-center rounded-xl bg-slate-900 text-white">${icon("users", "h-5 w-5")}</div><div class="font-semibold">Personen</div><div class="mt-1 text-xs text-slate-500">Budget & Schulden</div></button>

  // Die festen Kategorien bleiben bewusst klein und übersichtlich.
  // Eigene Kategorien werden separat gespeichert und erscheinen nach dem Hinzufügen
  // ebenfalls direkt oben bei den normalen Kategorien.
  const EXPENSE_BASE_CATEGORIES = [
    { value: "Essen", label: "Essen", icon: "utensils" },
    { value: "Hotel", label: "Hotel", icon: "hotel" },
    { value: "Tank", label: "Tank", icon: "fuel" },
    { value: "Aktivitäten", label: "Aktivitäten", icon: "sparkles" },
    { value: "Sonstiges", label: "Sonstiges", icon: "layers-3" }
  ];

  const EXPENSE_CATEGORIES = EXPENSE_BASE_CATEGORIES.map(c => [c.value, c.label]);
  const EXPENSE_CATEGORY_ICONS = Object.fromEntries(EXPENSE_BASE_CATEGORIES.map(c => [c.value, c.icon]));

  function normalizeExpenseCategory(category) {
    const value = String(category || "").trim();
    return value.toLowerCase() === "tanken" ? "Tank" : value;
  }

  function storedCustomExpenseCategories(tripId) {
    if (!tripId) return [];
    const cached = Array.isArray(customExpenseCategoryCache[tripId]) ? customExpenseCategoryCache[tripId] : [];
    let stored = [];
    try {
      const raw = localStorage.getItem(K.customExpenseCategoriesPrefix + tripId);
      const parsed = JSON.parse(raw || "[]");
      stored = Array.isArray(parsed) ? parsed.map(v => String(v || "").trim()).filter(Boolean) : [];
    } catch {}
    return [...new Set([...cached, ...stored].map(normalizeExpenseCategory).filter(Boolean))];
  }

  function saveCustomExpenseCategories(tripId, categories) {
    if (!tripId) return [];
    const base = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const clean = [...new Set((categories || [])
      .map(v => String(v || "").trim())
      .filter(Boolean)
      .map(normalizeExpenseCategory)
      .filter(v => !base.has(v)))]
      .sort((a, b) => a.localeCompare(b, "de"));
    customExpenseCategoryCache[tripId] = clean;
    try {
      localStorage.setItem(K.customExpenseCategoriesPrefix + tripId, JSON.stringify(clean));
    } catch {}
    return clean;
  }

  function customExpenseCategories(trip) {
    const base = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const stored = storedCustomExpenseCategories(trip?.id);
    const used = (trip?.expenses || []).map(entry => normalizeExpenseCategory(entry.category));
    return [...new Set([...stored, ...used])]
      .filter(Boolean)
      .filter(category => !base.has(category))
      .sort((a, b) => a.localeCompare(b, "de"));
  }

  function expenseCategoryLabel(category, trip) {
    const value = normalizeExpenseCategory(category);
    return EXPENSE_BASE_CATEGORIES.find(c => c.value === value)?.label || value || "Essen";
  }

  function expenseCategoryIcon(category) {
    return EXPENSE_CATEGORY_ICONS[normalizeExpenseCategory(category)] || "tag";
  }

  function expenseCategorySelectHTML(trip) {
    const selected = normalizeExpenseCategory(expenseForm.category || "Essen") || "Essen";
    const baseValues = new Set(EXPENSE_BASE_CATEGORIES.map(c => c.value));
    const customCategories = customExpenseCategories(trip);
    const allCategories = [
      ...EXPENSE_BASE_CATEGORIES.map(c => ({ value: c.value, label: c.label, icon: c.icon, custom: false })),
      ...customCategories.map(category => ({ value: category, label: category, icon: "tag", custom: true }))
    ];
    const query = String(expenseCategorySearch || "").trim().toLocaleLowerCase("de-DE");
    const filtered = query
      ? allCategories.filter(item => item.label.toLocaleLowerCase("de-DE").includes(query))
      : allCategories;

    const categoryOptions = allCategories.map((category, index) => {
      const active = selected === category.value;
      const initiallyHidden = !expenseCategoryMoreOpen && index >= 9;
      return `<button type="button" data-search-option="1" data-search="${esc(category.label)}" data-action="${category.custom ? "select-expense-custom-category" : "select-expense-category"}" data-category="${esc(category.value)}" ${category.custom ? `data-custom-category="true"` : ""} ${disabledIfViewer()}
        class="group flex min-w-0 items-center gap-2.5 rounded-2xl border px-3 py-3 text-left transition ${initiallyHidden ? "hidden" : ""} ${active ? "border-slate-900 bg-slate-900 text-white shadow-sm" : "border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-100/50"} disabled:cursor-not-allowed disabled:opacity-50">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl ${active ? "bg-white/10 text-white" : "bg-slate-900 text-white"}">${icon(category.icon, "h-4 w-4")}</span>
        <span class="min-w-0 flex-1 truncate text-sm font-semibold">${esc(category.label)}</span>
        ${active ? icon("check", "h-4 w-4") : icon("chevron-right", "h-4 w-4 text-slate-300 group-hover:text-slate-500")}
      </button>`;
    }).join("");


    return `<div class="relative">
      <div class="mb-2 flex items-center justify-between gap-3 px-1">
        <div class="flex items-center gap-2 text-sm font-semibold text-slate-800">
          <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-900 text-white">${icon("tag", "h-4 w-4")}</span>
          Kategorie
        </div>

  function stableCategoryColor(category) {
    const key = normalizeExpenseCategory(category) || "Sonstiges";
    const baseColors = {
      "Essen": "#1557A6",
      "Hotel": "#123F7A",
      "Tank": "#1B6AC9",
      "Aktivitäten": "#214F91",
      "Sonstiges": "#2B79CC"
    };
    if (baseColors[key]) return baseColors[key];

    const blues = ["#0E3A73", "#12447F", "#174D8F", "#1B579E", "#1F61AD", "#2369B9", "#2872C4", "#2E78C8", "#346EB4"];
    let hash = 0;
    for (let i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
    return blues[Math.abs(hash) % blues.length];
  }

  function categoryTint(color, amount = 0.88) {
    const hex = String(color || "#1557A6").replace("#", "");
    if (hex.length !== 6) return "rgba(21,87,166,0.08)";
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
    const p = Math.max(0, Math.min(1, amount));
    return `rgba(${Math.round(r + (255-r)*p)},${Math.round(g + (255-g)*p)},${Math.round(b + (255-b)*p)},0.92)`;
  }

  function expenseCategoryChartIcon(category) {
    return icon(expenseCategoryIcon(category), "h-6 w-6");
  }

  function expenseStackSegmentLabel(category, amount, total) {
    const percent = total > 0 ? Math.round((amount / total) * 100) : 0;
    const color = stableCategoryColor(category);
    return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}" class="flex min-w-0 items-center justify-center gap-2 rounded-xl px-1.5 py-1.5 text-center transition hover:bg-white/80 focus:outline-none">
      <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:${color}"></span>
      <span class="truncate text-xs font-semibold" style="color:${color}">${percent}% ${esc(category)}</span>
    </button>`;
  }

  function expenseCategoryChartHTML(trip) {
    const entries = Array.isArray(trip?.expenses) ? trip.expenses : [];
    const totals = {};
    entries.forEach(entry => {
      const category = normalizeExpenseCategory(entry.category) || "Sonstiges";
      const amount = Number(entry.amount || 0);
      if (amount > 0) totals[category] = (totals[category] || 0) + amount;
    });

    const rows = Object.entries(totals)
      .filter(([, amount]) => amount > 0)
      .sort((a, b) => b[1] - a[1]);
    const total = rows.reduce((sum, [, amount]) => sum + amount, 0);
    if (!rows.length || total <= 0) {
      return cardHTML("Ausgaben nach Kategorie", "So verteilt sich dein Urlaubsbudget", "pie-chart", emptyHTML("Noch keine Ausgaben für das Kreisdiagramm vorhanden."));
    }

    const selectedCategory = rows.some(([category]) => category === selectedExpenseChartCategory) ? selectedExpenseChartCategory : null;
    const selectedAmount = selectedCategory ? (totals[selectedCategory] || 0) : total;
    const selectedPercent = selectedCategory ? Math.round((selectedAmount / total) * 100) : 100;
    const selectedEntries = selectedCategory
      ? entries
          .filter(entry => (normalizeExpenseCategory(entry.category) || "Sonstiges") === selectedCategory && Number(entry.amount || 0) > 0)
          .sort((a, b) => Number(b.amount || 0) - Number(a.amount || 0))
      : [];

    const segments = rows.map(([category, amount]) => {
      const percent = amount / total * 100;
      const color = stableCategoryColor(category);
      const selected = selectedCategory === category;
      return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}" title="${esc(category)} · ${money(amount)}"
        class="h-full min-w-0 transition-all duration-200 focus:outline-none ${selected ? "scale-y-105 shadow-[0_8px_20px_rgba(15,23,42,0.18)]" : "hover:brightness-105"}"
        style="width:${Math.max(percent, 1.15)}%;background:${color};opacity:${selectedCategory && !selected ? "0.38" : "1"};border-right:3px solid rgba(255,255,255,0.92);">
      </button>`;
    }).join("");

    const quickLabels = rows.slice(0, 4).map(([category, amount]) => expenseStackSegmentLabel(category, amount, total)).join("");
    const legend = rows.map(([category, amount]) => {
      const percent = Math.round(amount / total * 100);
      const color = stableCategoryColor(category);
      const tint = categoryTint(color, 0.84);
      const selected = selectedCategory === category;
      return `<button type="button" data-action="toggle-chart-category" data-category="${esc(category)}"
        class="group w-full rounded-[1.5rem] border text-left transition-all duration-200 focus:outline-none ${selected ? "border-slate-300 bg-white shadow-[0_12px_28px_rgba(15,23,42,0.12)] -translate-y-0.5" : "border-slate-200 bg-white hover:border-slate-200 hover:shadow-sm"}">
        <div class="flex items-center gap-4 px-4 py-4 sm:px-5">
          <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full ring-1 ring-white shadow-sm" style="background:${tint};color:${color}">${expenseCategoryChartIcon(category)}</div>
          <div class="min-w-0 flex-1">
            <div class="truncate text-[18px] font-bold text-slate-900">${esc(category)}</div>
            <div class="mt-0.5 text-[14px] font-medium text-slate-500">${money(amount)}</div>
          </div>
          <div class="shrink-0 text-right">
            <div class="text-[18px] font-bold" style="color:${color}">${percent}%</div>
            <div class="mt-0.5 text-[11px] font-medium text-slate-400">der Gesamtausgaben</div>
          </div>
        </div>
      </button>`;
    }).join("");

    const detail = selectedCategory ? `
      <div class="mt-4 rounded-[1.5rem] border border-slate-200 bg-white p-4 shadow-sm">
        <div class="flex items-start justify-between gap-3">
          <div class="flex min-w-0 items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl" style="background:${categoryTint(stableCategoryColor(selectedCategory),0.84)};color:${stableCategoryColor(selectedCategory)}">${icon(expenseCategoryIcon(selectedCategory), "h-5 w-5")}</div>
            <div class="min-w-0">
              <div class="truncate text-base font-bold text-slate-900">${esc(selectedCategory)}</div>
              <div class="text-sm font-medium text-slate-500">${selectedPercent}% · ${money(selectedAmount)}</div>
            </div>
          </div>
          <button type="button" data-action="toggle-chart-category" data-category="${esc(selectedCategory)}" class="shrink-0 rounded-xl bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 transition hover:bg-slate-200">Schließen</button>
        </div>
        <div class="mt-3 space-y-2">
          ${selectedEntries.length ? selectedEntries.map(entry => {
            const person = trip.people?.find(p => String(p.id) === String(entry.personId));
            return `<div class="flex items-center justify-between gap-3 rounded-2xl bg-slate-50 px-3.5 py-3 ring-1 ring-slate-200/80">
              <div class="min-w-0"><div class="truncate text-sm font-semibold text-slate-800">${esc(entry.title || "Ausgabe")}</div><div class="mt-0.5 truncate text-xs text-slate-500">${shortDate(entry.date)}${person ? ` · ${esc(person.name)}` : ""}${entry.note ? ` · ${esc(entry.note)}` : ""}</div></div>
              <div class="shrink-0 text-sm font-bold text-slate-900">${money(entry.amount)}</div>
            </div>`;
          }).join("") : emptyHTML("Keine einzelnen Ausgaben in dieser Kategorie gefunden.")}
        </div>
      </div>` : `<div class="mt-4 text-center text-xs font-medium text-slate-500">Tippe auf einen Bereich oder eine Kategorie, um die einzelnen Ausgaben zu sehen.</div>`;

    return cardHTML("Ausgaben nach Kategorie", "So verteilt sich dein Urlaubsbudget", "pie-chart", `
      <div class="overflow-hidden rounded-[2rem] bg-gradient-to-br from-slate-50/85 via-white to-slate-50/55 p-4 ring-1 ring-slate-200/90 sm:p-6">
        <div class="mt-1 text-center">
          <div class="text-xs font-bold uppercase tracking-[0.28em] text-slate-500">${selectedCategory ? esc(selectedCategory) : "Gesamt"}</div>
          <div class="mt-1 text-4xl font-black tracking-tight text-slate-950 sm:text-5xl">${money(selectedAmount)}</div>
          <div class="mt-2 text-sm font-semibold text-slate-500">${selectedCategory ? `${selectedPercent}% der Gesamtausgaben` : `${rows.length} ${rows.length === 1 ? "Kategorie" : "Kategorien"} · gesamte Ausgaben`}</div>
        </div>

        <div class="mt-7">
          <div class="flex h-16 w-full overflow-hidden rounded-full bg-slate-200/90 shadow-inner ring-4 ring-white/80">
            ${segments}
          </div>
          <div class="mt-3 grid grid-cols-2 gap-x-2 gap-y-1.5 sm:grid-cols-4">${quickLabels}</div>
        </div>

        <div class="mt-7">
          <div class="mb-3 flex items-center justify-between gap-3">
            <div class="text-base font-bold text-slate-950">Aufteilung</div>
            <div class="text-sm font-semibold text-slate-400">${rows.length} ${rows.length === 1 ? "Kategorie" : "Kategorien"}</div>
          </div>
          <div class="space-y-3">${legend}</div>
        </div>
        ${detail}
      </div>
    `);
  }

  function aiContext() {
    const trip = activeTrip();
    const historicalTrips = trips
      .filter(t => (!trip || t.id !== trip.id) && String(t.endDate || "") < iso())
      .sort((a,b) => String(b.endDate || "").localeCompare(String(a.endDate || "")))
      .slice(0, 12)
      .map(t => {
        const rows = [...(t.expenses || []), ...(t.tolls || [])];
        const spent = rows.reduce((sum, e) => sum + Number(e.amount || 0), 0);
        const categoryTotals = {};
        rows.forEach(e => {
          const category = String(e.category || "Sonstiges");
          categoryTotals[category] = (categoryTotals[category] || 0) + Number(e.amount || 0);
        });
        return {
          name: t.name,
          destination: t.destination,
          startDate: t.startDate,
          endDate: t.endDate,
          budget: Number(t.budget || 0),
          spent,
          remaining: Number(t.budget || 0) - spent,
          transactionCount: rows.length,
          categoryTotals: Object.entries(categoryTotals)
            .sort((a,b) => Number(b[1]) - Number(a[1]))
            .slice(0, 6)
            .map(([category, amount]) => ({ category, amount: Number(amount) }))
        };
      });

    const availableTrips = trips
      .filter(t => !trip || t.id !== trip.id)
      .slice(0, 10)
      .map(t => ({name:t.name,destination:t.destination,startDate:t.startDate,endDate:t.endDate,budget:t.budget}));

    if (!trip) {
      return {
        currentTrip: null,
        account: { name: actorName() },
        availableTrips,
        tripHistory: historicalTrips
      };
    }

    const allCurrentSpending = [...trip.expenses, ...trip.tolls];
    const total = allCurrentSpending.reduce((sum, e) => sum + Number(e.amount || 0), 0);
    const currentCategoryTotals = {};
    allCurrentSpending.forEach(e => {
      const category = String(e.category || "Sonstiges");
      currentCategoryTotals[category] = (currentCategoryTotals[category] || 0) + Number(e.amount || 0);
    });
    const budget = Number(trip.budget || 0);
    const peopleCount = Math.max(1, (trip.people || []).length);
    const dayMs = 86400000;
    const todayMs = new Date(iso() + "T12:00:00").getTime();
    const startMs = trip.startDate ? new Date(trip.startDate + "T12:00:00").getTime() : NaN;
    const endMs = trip.endDate ? new Date(trip.endDate + "T12:00:00").getTime() : NaN;
    const plannedDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs
      ? Math.floor((endMs - startMs) / dayMs) + 1 : null;
    const remainingTripDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs && endMs >= todayMs
      ? Math.floor((endMs - Math.max(todayMs, startMs)) / dayMs) + 1 : 0;
    const elapsedTripDays = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs >= startMs
      ? (todayMs < startMs ? 0 : Math.max(1, Math.min(plannedDays, Math.floor((Math.min(todayMs, endMs) - startMs) / dayMs) + 1))) : null;
    const remainingBudget = budget - total;

    return {
      account: { name: actorName() },
      currentTrip: {
        name: trip.name,
        destination: trip.destination,
        startDate: trip.startDate,
        endDate: trip.endDate,
        budget: trip.budget,
        role: trip.role,
        people: trip.people.map(p => p.name),
        spending: {
          total,
          remaining: remainingBudget,
          expenseCount: trip.expenses.length,
          tollCount: trip.tolls.length,
          categoryTotals: Object.entries(currentCategoryTotals)
            .sort((a,b) => Number(b[1]) - Number(a[1]))
            .slice(0, 8)
            .map(([category, amount]) => ({ category, amount: Number(amount) }))
        },
        budgetCoach: {
          peopleCount,
          plannedDays,
          elapsedTripDays,
          remainingTripDays,
          spentPerPerson: total / peopleCount,
          remainingPerPerson: remainingBudget / peopleCount,
          spendingPerElapsedDay: elapsedTripDays ? total / elapsedTripDays : null,
          suggestedDailyLimit: budget > 0 && remainingTripDays > 0 ? Math.max(0, remainingBudget / remainingTripDays) : null,
          usedPercent: budget > 0 ? (total / budget) * 100 : null,
          isOverBudget: budget > 0 && total > budget
        },
        recentExpenses: trip.expenses.slice(-12).map(e => ({title:e.title, amount:e.amount, category:e.category, date:e.date, note:e.note || ""})),
        recentTolls: trip.tolls.slice(-8).map(e => ({title:e.title, amount:e.amount, date:e.date, note:e.note || ""})),
        openTodos: trip.todos.filter(x=>!x.done).slice(0,20).map((x,i)=>({id:"todo-"+(i+1),text:x.text})),
        openPacking: trip.packlist.filter(x=>!x.done).slice(0,20).map((x,i)=>({id:"packing-"+(i+1),text:x.text})),
        customCategories: customExpenseCategories(trip)
      },
      availableTrips,
      tripHistory: historicalTrips
    };
  }

  function aiMarkdownInline(value) {
    let html = esc(value);
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (match, label, rawUrl) => {
      try {
        const safeUrl = new URL(rawUrl.replaceAll("&amp;", "&"));
        if (safeUrl.protocol !== "https:" && safeUrl.protocol !== "http:") return label;
        return '<a href="' + esc(safeUrl.href) + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
      } catch { return label; }
    });
    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/__(.+?)__/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    return html;
  }

  function aiMarkdownHTML(value) {
    const lines = String(value ?? "").replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let paragraph = [];
    let list = null;
    let quote = [];
    let recommendationCardOpen = false;

    const flushParagraph = () => {
      if (!paragraph.length) return;
      out.push("<p>" + paragraph.map(aiMarkdownInline).join(" ") + "</p>");
      paragraph = [];
    };
    const flushList = () => {
      if (!list) return;
      const items = list.items.map(item => list.type === "ol"
        ? '<li><span class="ai-markdown-number">' + esc(item.number) + '</span><span>' + aiMarkdownInline(item.text) + '</span></li>'
        : '<li><span class="ai-markdown-bullet" aria-hidden="true"></span><span>' + aiMarkdownInline(item.text) + '</span></li>').join("");
      out.push("<" + list.type + ">" + items + "</" + list.type + ">");
      list = null;
    };
    const flushQuote = () => {
      if (!quote.length) return;
      out.push("<blockquote>" + quote.map(aiMarkdownInline).join(" ") + "</blockquote>");
      quote = [];
    };
    const flushBlocks = () => { flushParagraph(); flushList(); flushQuote(); };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) { flushBlocks(); continue; }

      const heading = line.match(/^(#{1,4})\s+(.+)$/);
      if (heading) {
        flushBlocks();
        const level = heading[1].length <= 3 ? 3 : 4;
        if (level === 3) {
          if (recommendationCardOpen) out.push("</section>");
          const headingText = heading[2].toLowerCase();
          const cardIcon = /(budget|ausgab|kosten|spar|geld|euro)/i.test(headingText) ? "wallet-cards" : /(pack|to-do|aufgabe|checkliste|erledigt)/i.test(headingText) ? "list-checks" : "map-pinned";
          out.push('<section class="ai-recommendation-card"><h3><span class="ai-recommendation-icon">' + icon(cardIcon, "h-4 w-4") + '</span>' + aiMarkdownInline(heading[2]) + "</h3>");
          recommendationCardOpen = true;
        } else {
          out.push("<h4>" + aiMarkdownInline(heading[2]) + "</h4>");
        }
        continue;
      }
      if (/^(---+|___+)\s*$/.test(line)) {
        flushBlocks(); out.push("<hr>"); continue;
      }

      const quoteLine = line.match(/^>\s?(.*)$/);
      if (quoteLine) {
        flushParagraph(); flushList();
        quote.push(quoteLine[1]);
        continue;
      }
      flushQuote();

      const unordered = line.match(/^[-*•]\s+(.+)$/);
      const ordered = line.match(/^(\d+)[.)]\s+(.+)$/);
      const match = unordered || ordered;
      if (match) {
        flushParagraph();
        const type = unordered ? "ul" : "ol";
        if (list && list.type !== type) flushList();
        if (!list) list = {type, items:[]};
        list.items.push(unordered ? {text:unordered[1]} : {number:ordered[1],text:ordered[2]});
        continue;
      }
      flushList();
      paragraph.push(line);
    }
    flushBlocks();
    if (recommendationCardOpen) out.push("</section>");
    return out.join("");
  }

  function aiQuestionNeedsWebSearch(input) {
    const q = String(input || "").toLowerCase();
    const asksForPersonalNumbers = /(meine?\s+(ausgaben|kosten|budgets?|rechnungen)|wie\s+viel\s+habe\s+ich\s+.*ausgegeben|wieviel\s+habe\s+ich\s+.*ausgegeben|bisherigen\s+urlaub|früheren\s+urlaub|letzten\s+urlaub\s+.*ausgegeben|ausgaben\s+vergleichen|budget\s+berechnen)/i.test(q);
    const asksForRecommendations = /(reiseziele?|wohin|urlaubsideen?|reiseideen?|reisevorschl[aä]ge?|empfehl.*(reise|urlaub|ziel)|plan.*(urlaub|reise)|urlaub.*(plan|ideen)|nächsten\s+urlaub|nächster\s+urlaub|ausflüge?|sehenswürdigkeiten?|attraktionen?|was\s+kann\s+man\s+in|beste\s+reisezeit|wann\s+.*reisen)/i.test(q);
    const asksForTravelResearch = /(wetter|öffnungszeit|einreisebestimmung|reisehinweis|hotelpreis|flugpreis|flugverbindung|eintrittspreis|wechselkurs|umrechnungskurs|veranstaltung|geöffnet|live-preis|aktuelle\s+preise|quellen\s+für|online\s+recherch)/i.test(q);
    const asksForCurrentInfo = /(aktuell|aktuelle|aktuellen|heute|jetzt|dieses\s+jahr|diesen\s+sommer|dieses\s+wochenende|preis|preise|verfügbarkeit|geöffnet)/i.test(q);
    if (asksForPersonalNumbers && !asksForRecommendations) return false;
    return asksForRecommendations || (asksForTravelResearch && asksForCurrentInfo);
  }

  function aiThinkingStepsFor(input) {
    const q = String(input || "").toLowerCase();
    if (aiQuestionNeedsWebSearch(input)) {
      return [
        "Ich suche aktuelle Reiseinformationen",
        "Ich prüfe passende Websites",
        "Ich vergleiche die gefundenen Quellen",
        "Ich gleiche die Informationen mit deinem Budget ab",
        "Ich fasse die wichtigsten Punkte zusammen"
      ];
    }
    if (/(ausgab|kosten|budget|spar|teuer|geld|vergleich|bisherigen urlaub|früheren urlaub|ausgegeben)/.test(q)) {
      return [
        "Ich werte deine Urlaubsausgaben aus",
        "Ich vergleiche deine bisherigen Reisen",
        "Ich suche nach Sparmöglichkeiten",
        "Ich fasse die wichtigsten Zahlen zusammen"
      ];
    }
    return [
      "Ich lese deine Frage",
      "Ich prüfe die passenden Reisedaten",
      "Ich sortiere die wichtigsten Informationen",
      "Ich formuliere deine Antwort"
    ];
  }

  function stopAIThinking() {
    if (aiThinkingTimer !== null) {
      clearInterval(aiThinkingTimer);
      aiThinkingTimer = null;
    }
  }

  function startAIThinking(input) {
    stopAIThinking();
    const steps = aiThinkingStepsFor(input);
    let index = 0;
    aiThinkingStatus = steps[0];
    aiThinkingTimer = setInterval(() => {
      index = (index + 1) % steps.length;
      aiThinkingStatus = steps[index];
      const label = document.getElementById("ai-thinking-label");
      if (label) {
        label.textContent = aiThinkingStatus;
        label.classList.remove("ai-thinking-refresh");
        void label.offsetWidth;
        label.classList.add("ai-thinking-refresh");
      }
    }, 1750);
  }

  async function sendAIMessage(textOverride = "") {
    const input = String(textOverride || aiInput || "").trim();
    if (!input || aiLoading) return;
    if (aiQuotaRemaining === 0) {
      aiError = "Dein kostenloses KI-Limit für heute ist erreicht. Morgen kannst du wieder Fragen stellen.";
      render();
      return;
    }
    aiInput = "";
    aiError = "";
    aiChatHistoryOpen = false;
    aiMessages = [...aiMessages, {role:"user", content:input}];
    saveAIChatHistory();
    aiLoading = true;
    startAIThinking(input);
    render();
    try {
      const context = aiContext();
      const receiptImageForRequest = aiReceiptImageDataUrl;
      const payload = { messages: aiMessages.slice(-12), context, webSearchEnabled: false };
      if (receiptImageForRequest) payload.receiptImageDataUrl = receiptImageForRequest;
      const result = await supabase.functions.invoke("urlaubassistent-ai", { body: payload });
      const fnError = result.error;
      if (fnError) {
        let detail = {};
        const response = fnError?.context;
        try {
          if (response?.clone) detail = await response.clone().json();
        } catch {}
        const status = Number(response?.status || 0);
        if (detail?.code === "AI_DAILY_LIMIT" || status === 429) {
          aiQuotaRemaining = 0;
          aiError = detail?.global
            ? "Die kostenlose Reise-KI ist für heute bereits ausgelastet. Morgen geht es weiter."
            : "Du hast dein kostenloses KI-Limit für heute erreicht. Morgen geht es weiter.";
        } else if (detail?.code === "AI_PROVIDER_BUSY") {
          aiError = "Die kostenlose Reise-KI ist gerade stark ausgelastet. Bitte versuche es später erneut.";
        } else if (status === 401) {
          aiError = "Die Reise-KI ist gerade nicht verbunden. Bitte melde dich einmal neu an.";
        } else {
          aiError = "Die Reise-KI ist gerade nicht erreichbar. Deine restliche App funktioniert natürlich weiter.";
        }
        throw fnError;
      }
      const data = result.data || {};
      const reply = String(data?.reply || "").trim();
      if (!reply) throw new Error("empty-ai-reply");
      if (Number.isFinite(Number(data?.quota?.remaining))) aiQuotaRemaining = Math.max(0, Number(data.quota.remaining));
      const sources = Array.isArray(data?.sources) ? data.sources : [];
      const actions = normalizeAIActionProposal(data?.actions);
      if (Number.isFinite(Number(data?.searchQuota?.remaining))) aiSearchQuotaRemaining = Math.max(0, Number(data.searchQuota.remaining));
      aiMessages = [...aiMessages, {
        role:"assistant", content:reply, sources, actions,
        webSearchRequested:Boolean(data?.webSearchRequested),
        webSearchEligible:Boolean(data?.webSearchEligible),
        webSearchBlockedReason:String(data?.webSearchBlockedReason || ""),
        followUps:aiFollowUpsFor(input)
      }];
      await saveAIChatHistory();
    } catch (e) {
      if (!aiError) {
        aiError = e?.message === "empty-ai-reply"
          ? "Die Reise-KI hat gerade keine Antwort zurückgegeben. Versuch es gleich noch einmal."
          : "Die Reise-KI ist gerade nicht erreichbar. Versuch es gleich noch einmal.";
      }
    } finally {
      stopAIThinking();
      aiLoading = false;
      if (aiReceiptImageDataUrl) { aiReceiptImageDataUrl = ""; aiReceiptImageName = ""; }
      await saveAIChatHistory();
      render();
      setTimeout(()=>{ const box=document.getElementById("ai-chat-messages"); if(box) box.scrollTop=box.scrollHeight; }, 0);
    }
  }

  function normalizeAIActionProposal(value) {
    if (!value || typeof value !== "object" || Array.isArray(value)) return null;
    const text = (v, max) => typeof v === "string" ? v.trim().slice(0, max || 160) : "";
    const rows = (list, kind) => (Array.isArray(list) ? list : []).slice(0, 10).map(item => {
      if (!item || typeof item !== "object") return null;
      if (kind === "text") {
        const value = text(item.text, 160);
        return value ? {text:value} : null;
      }
      const title = text(item.title, 100);
      const amount = Number(item.amount);
      if (!title || !Number.isFinite(amount) || amount <= 0 || amount > 1000000) return null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(String(item.date || "")) ? String(item.date) : iso();
      return {title,amount:Math.round(amount*100)/100,category:text(item.category,48),date,note:text(item.note,220),personName:text(item.personName,80)};
    }).filter(Boolean);
    const ids = list => Array.isArray(list) ? [...new Set(list.filter(id=>typeof id==="string"&&id.length<=80).map(id=>id.trim()).filter(Boolean))].slice(0,20) : [];
    const actions = {
      expenses:rows(value.expenses,"expense"),
      tolls:rows(value.tolls,"toll"),
      packingItems:rows(value.packingItems,"text"),
      todos:rows(value.todos,"text"),
      completeTodoIds:ids(value.completeTodoIds),
      completePackingIds:ids(value.completePackingIds)
    };
    return Object.values(actions).some(list=>list.length) ? actions : null;
  }

  function aiActionPreviewHTML(actions, messageIndex) {
    const a=normalizeAIActionProposal(actions);
    if(!a)return "";
    const expenseTotal=a.expenses.reduce((sum,item)=>sum+item.amount,0);
    const tollTotal=a.tolls.reduce((sum,item)=>sum+item.amount,0);
    const count=a.expenses.length+a.tolls.length+a.packingItems.length+a.todos.length+a.completeTodoIds.length+a.completePackingIds.length;
    const lines=[];
    if(a.expenses.length)lines.push('<div class="flex items-start gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-slate-900 text-white">'+icon("receipt-text","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="text-xs font-bold text-slate-800">'+a.expenses.length+' '+(a.expenses.length===1?"Ausgabe":"Ausgaben")+' · '+money(expenseTotal)+'</div><div class="mt-1 text-[11px] leading-4 text-slate-500">'+a.expenses.map(item=>esc(item.title)+" · "+money(item.amount)+" · "+esc(item.category||"Sonstiges")+" · "+esc(shortDate(item.date))).join("<br>")+'</div></div></div>');
    if(a.tolls.length)lines.push('<div class="flex items-start gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-amber-50 text-amber-700">'+icon("car-front","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="text-xs font-bold text-slate-800">'+a.tolls.length+' '+(a.tolls.length===1?"Gebühreneintrag":"Gebühreneinträge")+' · '+money(tollTotal)+'</div><div class="mt-1 text-[11px] leading-4 text-slate-500">'+a.tolls.map(item=>esc(item.title)+" · "+money(item.amount)+" · "+esc(item.category||"Parken")+" · "+esc(shortDate(item.date))).join("<br>")+'</div></div></div>');
    if(a.packingItems.length)lines.push('<div class="flex items-start gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-violet-50 text-violet-700">'+icon("luggage","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="text-xs font-bold text-slate-800">'+a.packingItems.length+' Packlistenpunkt(e)</div><div class="text-[11px] leading-4 text-slate-500">'+a.packingItems.map(item=>esc(item.text)).join(", ")+'</div></div></div>');
    if(a.todos.length)lines.push('<div class="flex items-start gap-2"><span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-emerald-50 text-emerald-700">'+icon("list-checks","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="text-xs font-bold text-slate-800">'+a.todos.length+' To-do(s)</div><div class="text-[11px] leading-4 text-slate-500">'+a.todos.map(item=>esc(item.text)).join(", ")+'</div></div></div>');
    if(a.completeTodoIds.length)lines.push('<div class="text-xs font-semibold text-slate-700">'+a.completeTodoIds.length+' To-do(s) als erledigt markieren</div>');
    if(a.completePackingIds.length)lines.push('<div class="text-xs font-semibold text-slate-700">'+a.completePackingIds.length+' Packlistenpunkt(e) abhaken</div>');
    const trip=activeTrip();
    const blocked=!trip||trip.role==="viewer"||aiActionsApplying;
    return '<div class="mt-3 rounded-2xl border border-slate-300 bg-gradient-to-br from-slate-50/80 to-white p-3"><div class="flex items-start gap-2"><span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-white">'+icon("clipboard-check","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="text-sm font-bold text-slate-900">Änderungen vorbereiten</div><div class="mt-0.5 text-[11px] leading-4 text-slate-500">'+count+' Änderung(en) für '+(trip?esc(trip.name):"deinen Urlaub")+' – noch nicht gespeichert</div></div></div><div class="mt-3 space-y-3">'+lines.join("")+'</div>' +
      (!trip?'<div class="mt-3 text-xs text-rose-600">Wähle zuerst einen Urlaub aus.</div>':trip.role==="viewer"?'<div class="mt-3 text-xs text-rose-600">Du hast in diesem geteilten Urlaub nur Leserechte.</div>':"") +
      '<div class="mt-4 grid grid-cols-2 gap-2"><button type="button" data-action="discard-ai-actions" data-message-index="'+messageIndex+'" class="rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-xs font-bold text-slate-600" '+(aiActionsApplying?"disabled":"")+'>'+icon("x","mr-1 inline-block h-3.5 w-3.5")+'Verwerfen</button><button type="button" data-action="approve-ai-actions" data-message-index="'+messageIndex+'" class="flex items-center justify-center gap-1.5 rounded-xl bg-slate-900 px-3 py-2.5 text-xs font-bold text-white disabled:opacity-40" '+(blocked?"disabled":"")+'>'+icon("check","h-3.5 w-3.5")+'Bestätigen & speichern</button></div></div>';
  }

  function aiInputToolsHTML() {
    let preview="";
    if(aiReceiptImageDataUrl)preview='<div class="mb-2 flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-100/70 p-2"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white text-slate-900">'+icon("receipt-text","h-4 w-4")+'</span><div class="min-w-0 flex-1"><div class="truncate text-xs font-semibold text-slate-800">'+esc(aiReceiptImageName||"Kassenbonfoto bereit")+'</div><div class="text-[10px] text-slate-500">Wird zur Analyse an den KI-Dienst übertragen</div></div><button type="button" data-action="remove-ai-receipt" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-white" aria-label="Kassenbonfoto entfernen">'+icon("x","h-4 w-4")+'</button></div>';

  async function optimizeReceiptImage(file) {
    if(!file||!String(file.type||"").startsWith("image/"))throw new Error("Bitte wähle ein Foto oder Bild des Kassenbons.");
    if(file.size>15*1024*1024)throw new Error("Das Foto ist zu groß. Bitte wähle ein Bild unter 15 MB.");
    const source=await new Promise((resolve,reject)=>{
      const reader=new FileReader();reader.onerror=()=>reject(new Error("Das Kassenbonfoto konnte nicht gelesen werden."));
      reader.onload=()=>resolve(String(reader.result||""));reader.readAsDataURL(file);
    });
    const image=await new Promise((resolve,reject)=>{
      const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("Das Foto konnte nicht geöffnet werden."));img.src=source;
    });
    const scale=Math.min(1,1440/Math.max(image.width,image.height));
    const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    const ctx=canvas.getContext("2d");if(!ctx)throw new Error("Das Foto konnte nicht vorbereitet werden.");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
    let optimized=canvas.toDataURL("image/jpeg",0.78);if(optimized.length>2800000)optimized=canvas.toDataURL("image/jpeg",0.58);
    if(optimized.length>3000000)throw new Error("Das Bild ist noch zu groß. Bitte fotografiere den Bon erneut.");
    return optimized;
  }

  function startAISpeechInput() {
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){aiError="Dieser Browser unterstützt keine integrierte Spracherkennung. Nutze die Texteingabe oder die Kassenbon-Funktion.";render();return;}
    if(aiListening){try{aiSpeechRecognition?.stop();}catch{}aiListening=false;render();return;}
    try{
      const recognition=new Recognition();recognition.lang="de-DE";recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;
      recognition.onresult=event=>{
        const transcript=String(event.results?.[0]?.[0]?.transcript||"").trim();aiListening=false;
        if(transcript)aiInput=[aiInput,transcript].filter(Boolean).join(" ").trim();else aiError="Ich habe nichts verstanden. Versuche es bitte noch einmal.";
        render();setTimeout(()=>{const input=document.getElementById("ai-input");if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}},0);
      };
      recognition.onerror=event=>{aiListening=false;aiError=event.error==="not-allowed"?"Bitte erlaube den Mikrofonzugriff in deinem Browser.":"Die Sprache konnte nicht erkannt werden. Du kannst es erneut versuchen oder tippen.";render();};
      recognition.onend=()=>{if(aiListening){aiListening=false;render();}};
      aiSpeechRecognition=recognition;aiListening=true;aiError="";render();recognition.start();
    }catch{aiListening=false;aiError="Das Mikrofon konnte nicht gestartet werden. Prüfe die Browser-Berechtigung.";render();}
  }

  async function applyAIActions(messageIndex) {
    if (aiActionsApplying) return;
    const message = aiMessages[messageIndex];
    const actions = normalizeAIActionProposal(message?.actions);
    const trip = activeTrip();
    if (!actions || !trip) { aiError = "Bitte wähle zuerst einen Urlaub aus."; render(); return; }
    if (!session?.user?.id) { aiError = "Bitte melde dich an, um Änderungen zu speichern."; render(); return; }
    if (trip.role === "viewer") { aiError = "Du hast in diesem geteilten Urlaub nur Leserechte."; render(); return; }

    const openTodos = trip.todos.filter(item => !item.done).slice(0, 20);
    const openPacking = trip.packlist.filter(item => !item.done).slice(0, 20);
    const completeTodoIds = actions.completeTodoIds.map(key => {
      const match = /^todo-(\d+)$/.exec(String(key));
      return match ? openTodos[Number(match[1]) - 1]?.id : null;
    }).filter(Boolean);
    const completePackingIds = actions.completePackingIds.map(key => {
      const match = /^packing-(\d+)$/.exec(String(key));
      return match ? openPacking[Number(match[1]) - 1]?.id : null;
    }).filter(Boolean);

    const operations = [];
    actions.expenses.forEach(item => {
      const person = item.personName ? trip.people.find(p => String(p.name).toLowerCase() === item.personName.toLowerCase()) : null;
      operations.push({
        table: "trip_expenses", method: "upsert", onConflict: "id",
        payload: {
          id: localOperationId(), user_id: session.user.id, trip_id: trip.id,
          title: item.title, amount: item.amount,
          category: normalizeExpenseCategory(item.category || "Sonstiges") || "Sonstiges",
          person_id: person?.id || null, note: item.note || "", expense_date: item.date || iso()
        }
      });
    });
    actions.tolls.forEach(item => {
      const person = item.personName ? trip.people.find(p => String(p.name).toLowerCase() === item.personName.toLowerCase()) : null;
      operations.push({
        table: "trip_tolls", method: "upsert", onConflict: "id",
        payload: {
          id: localOperationId(), user_id: session.user.id, trip_id: trip.id,
          title: item.title, amount: item.amount,
          category: normalizeExpenseCategory(item.category || "Parken") || "Parken",
          person_id: person?.id || null, note: item.note || "", toll_date: item.date || iso()
        }
      });
    });
    actions.packingItems.forEach(item => operations.push({
      table: "trip_pack_items", method: "upsert", onConflict: "id",
      payload: { id: localOperationId(), user_id: session.user.id, trip_id: trip.id, text: item.text, done: false }
    }));
    actions.todos.forEach(item => operations.push({
      table: "trip_todos", method: "upsert", onConflict: "id",
      payload: { id: localOperationId(), user_id: session.user.id, trip_id: trip.id, text: item.text, done: false }
    }));
    completeTodoIds.forEach(id => operations.push({
      table: "trip_todos", method: "update", payload: { done: true },
      filters: [{ column: "trip_id", value: trip.id }, { column: "id", value: id }]
    }));
    completePackingIds.forEach(id => operations.push({
      table: "trip_pack_items", method: "update", payload: { done: true },
      filters: [{ column: "trip_id", value: trip.id }, { column: "id", value: id }]
    }));

    const counts = {
      expenses: actions.expenses.length, tolls: actions.tolls.length,
      packing: actions.packingItems.length, todos: actions.todos.length,
      doneTodos: completeTodoIds.length, donePacking: completePackingIds.length
    };
    aiActionsApplying = true;
    aiError = "";
    render();
    try {
      const saved = operations.length ? await persistLocalFirstOperations(operations) : { queued: false };
      if (counts.expenses) {
        message.actions.expenses = [];
        addActivity(trip.id, "hat " + counts.expenses + " KI-Ausgabe(n) eingetragen", "receipt-text");
      }
      if (counts.tolls) {
        message.actions.tolls = [];
        addActivity(trip.id, "hat " + counts.tolls + " KI-Gebühreneintrag/-einträge eingetragen", "car-front");
      }
      if (counts.packing) {
        message.actions.packingItems = [];
        addActivity(trip.id, "hat " + counts.packing + " KI-Packlistenpunkt(e) hinzugefügt", "luggage");
      }
      if (counts.todos) {
        message.actions.todos = [];
        addActivity(trip.id, "hat " + counts.todos + " KI-To-do(s) hinzugefügt", "list-checks");
      }
      if (completeTodoIds.length) message.actions.completeTodoIds = [];
      if (completePackingIds.length) message.actions.completePackingIds = [];
      if (!saved.queued) {
        if (counts.expenses) broadcastActivity(trip.id, "hat " + counts.expenses + " KI-Ausgabe(n) eingetragen", "receipt-text");
        if (counts.tolls) broadcastActivity(trip.id, "hat " + counts.tolls + " KI-Gebühreneintrag/-einträge eingetragen", "car-front");
        if (counts.packing) broadcastActivity(trip.id, "hat " + counts.packing + " KI-Packlistenpunkt(e) hinzugefügt", "luggage");
        if (counts.todos) broadcastActivity(trip.id, "hat " + counts.todos + " KI-To-do(s) hinzugefügt", "list-checks");
      }
      message.actions = null;
      message.actionsApplied = true;
      await loadTrips();

      const savedSummary = [];
      if (counts.expenses) savedSummary.push(counts.expenses + " " + (counts.expenses === 1 ? "Ausgabe" : "Ausgaben"));
      if (counts.tolls) savedSummary.push(counts.tolls + " Gebühreneinträge");
      if (counts.packing) savedSummary.push(counts.packing + " Packlistenpunkte");
      if (counts.todos) savedSummary.push(counts.todos + " To-dos");
      if (counts.doneTodos) savedSummary.push(counts.doneTodos + " To-dos abgehakt");
      if (counts.donePacking) savedSummary.push(counts.donePacking + " Packlistenpunkte abgehakt");
      const content = saved.queued
        ? "Lokal gespeichert. " + savedSummary.join(", ") + (savedSummary.length ? " – wird bei Wiederverbindung synchronisiert." : "Die Änderungen werden bei Wiederverbindung synchronisiert.")
        : (savedSummary.length ? "Erledigt! Gespeichert: " + savedSummary.join(", ") + "." : "Es gab keine gültigen Änderungen zum Speichern.");
      aiMessages = [...aiMessages, { role: "assistant", content, followUps: ["Zeige mir mein aktuelles Budget", "Was ist auf meiner Packliste noch offen?"] }];
      saveAIChatHistory();
      render();
    } catch (e) {
      console.error("KI-Änderungen konnten nicht gespeichert werden:", e);
      aiError = friendlyAppError(e, "Speichern der KI-Änderungen") + " Prüfe die Listen, bevor du es erneut versuchst.";
      render();
    } finally {
      aiActionsApplying = false;
      render();
    }
  }
